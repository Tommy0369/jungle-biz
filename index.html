<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover が無いと env(safe-area-inset-*) が常に 0 になり、
     セーフエリアを避けている13箇所の指定がすべて無効化される（ホームインジケータや
     ノッチに下部UIが潜り込む）。cover を付けて初めてそれらが機能する。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b3d2e" />
<title>🌴 JUNGLE BIZ — ゼロから始めるジャングル経営サバイバル</title>
<style>
/* =========================================================================
   JUNGLE BIZ — スタイル
   デザイン方針: Tropical / Casual / Playful / Premium。
   「難しい経営シミュレーター」ではなく「かわいいジャングルゲーム」に見せる。
   ========================================================================= */
:root{
  --leaf-900:#0b3d2e; --leaf-800:#0f4d39; --leaf-700:#14603f;
  --leaf-500:#2fbf71; --leaf-400:#3ddc84; --leaf-300:#7be8a8;
  --banana:#ffd23f; --banana-600:#f5b800;
  --coral:#ff6b57; --coral-600:#e6503c;
  --sky:#4cc9f0; --sky-600:#2aa9d6;
  --grape:#9d7bff;
  --cream:#fffdf5; --cream-2:#fff7e6;
  --ink:#20301f; --ink-soft:#4d5f48;
  --card-shadow:0 10px 26px rgba(3,30,18,.28);
  --radius:20px;
  --good:#2fbf71; --warn:#f5a623; --danger:#ff5252;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(61,220,132,.18), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(76,201,240,.12), transparent 55%),
    linear-gradient(160deg, var(--leaf-900), var(--leaf-800) 55%, #0a2c22);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* うっすら葉っぱ模様 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.06; z-index:0;
  background-image:radial-gradient(circle at 20% 30%, #fff 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, #fff 2px, transparent 3px),
    radial-gradient(circle at 45% 85%, #fff 2px, transparent 3px);
  background-size:180px 180px, 220px 220px, 260px 260px;
}
#app,#modal-root{position:relative; z-index:1;}
.wrap{max-width:720px; margin:0 auto; padding:16px 14px 120px;}
.hidden{display:none !important;}

/* ---- 汎用 ---- */
.card{background:var(--cream); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:16px;}
.btn{
  appearance:none; border:none; cursor:pointer; font-family:var(--font);
  font-weight:800; border-radius:16px; padding:14px 18px; font-size:16px;
  background:var(--leaf-500); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.18); transition:transform .08s, box-shadow .08s, filter .1s;
  touch-action:manipulation;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
.btn:disabled{filter:grayscale(.6) brightness(.9); opacity:.6; cursor:not-allowed;}
.btn.big{width:100%; padding:18px; font-size:19px; border-radius:20px;}
.btn.banana{background:linear-gradient(180deg,#ffd85a,#f5b800); color:#5b4200; box-shadow:0 5px 0 #cf9b00;}
.btn.coral{background:linear-gradient(180deg,#ff7d6b,#e6503c); box-shadow:0 5px 0 #b83a29;}
/* B-3 水色は明るいので白文字だとコントラスト1.66。banana と同じく濃い文字を載せる（最悪5.47） */
.btn.sky{background:linear-gradient(180deg,#6fd6f5,#2aa9d6); color:#052b3c; box-shadow:0 5px 0 #1f86ab;}
/* .ghost は「暗い背景の上」専用。明るいカードに置くと白文字が消える（B-4 の原因） */
.btn.ghost{background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:2px solid rgba(255,255,255,.25);}
/* B-4 明るいカードの上に置く控えめボタン。.ghost の明背景版（比14.1） */
.btn.outline{background:#fff; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.10);
  border:2px solid rgba(32,48,31,.22);}
/* モーダルの地は cream。この中の .ghost は白文字が消える（比1.02＝「閉じる」が見えない）。
   個別に張り替えるのではなく、明るい地の側で面倒を見る。 */
.modal .btn.ghost, .card .btn.ghost{
  background:#fff; color:var(--ink); border-color:rgba(32,48,31,.22);
  box-shadow:0 3px 0 rgba(0,0,0,.10);}
.btn.small{padding:9px 12px; font-size:14px; border-radius:12px; box-shadow:0 3px 0 rgba(0,0,0,.18);}
.btn.small:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
.row{display:flex; gap:10px;} .row.wrap{flex-wrap:wrap;}
.center{text-align:center;}
.muted{color:var(--ink-soft);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-weight:800; font-size:12px; background:var(--cream-2); color:var(--ink-soft);}
h1,h2,h3{margin:0;}
.tabnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}

/* ---- タイトル ---- */
.title-screen{min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 18px 60px;}
.logo{font-size:clamp(44px,13vw,88px); font-weight:900; letter-spacing:-2px; color:#fff; line-height:.95;
  text-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 30px rgba(61,220,132,.5);}
.logo .biz{color:var(--banana);}
.sub{color:var(--leaf-300); font-weight:800; margin-top:10px; font-size:clamp(14px,4vw,19px);}
.tagline{color:#e9fff2; opacity:.85; margin:22px auto 0; max-width:420px; line-height:1.7; font-size:15px;}
.float-emoji{position:absolute; font-size:34px; opacity:.5; animation:floaty 6s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-18px) rotate(6deg)}}

/* ---- KPIグリッド ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.kpi{background:var(--cream); border-radius:16px; padding:12px 10px; text-align:center; box-shadow:var(--card-shadow); position:relative; overflow:hidden;}
.kpi .lbl{font-size:11px; font-weight:800; color:var(--ink-soft); letter-spacing:.04em; display:flex; gap:4px; justify-content:center; align-items:center;}
.kpi .val{font-size:clamp(18px,5.4vw,24px); font-weight:900; margin-top:3px; line-height:1;}
.kpi .val small{font-size:13px; font-weight:800;}
.kpi .trend{font-size:11px; font-weight:800; margin-top:3px;}
.up{color:var(--good);} .down{color:var(--danger);} .flat{color:var(--ink-soft);}
.kpi.hero{grid-column:span 3; display:flex; justify-content:space-around; align-items:center; background:linear-gradient(120deg,#12603f,#0f4d39); color:#fff;}
.kpi.hero .val{color:#fff;} .kpi.hero .lbl{color:var(--leaf-300);}
.kpi.hero .sep{width:1px; align-self:stretch; background:rgba(255,255,255,.15);}

/* ---- ヘッダーバー ---- */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; color:#fff;}
.week-badge{font-weight:900; font-size:20px; display:flex; align-items:center; gap:8px;}
.week-badge .area{font-size:11px; font-weight:800; color:var(--leaf-300); display:block; margin-top:-2px;}
.lvl-chip{background:var(--banana); color:#5b4200; font-weight:900; padding:5px 11px; border-radius:999px; font-size:12px;}
.xpbar{height:7px; background:rgba(255,255,255,.16); border-radius:99px; overflow:hidden; margin-top:6px;}
.xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--banana),var(--leaf-400)); border-radius:99px; transition:width .5s;}

/* ---- セクション見出し ---- */
.sec-h{color:#fff; font-weight:900; font-size:15px; margin:18px 4px 8px; display:flex; align-items:center; gap:7px;}
.sec-h .hint{font-size:11px; font-weight:800; color:var(--leaf-300); margin-left:auto;}

/* ---- 時間バジェット ---- */
.time-wrap{background:linear-gradient(120deg,#173d2c,#12331f); border-radius:16px; padding:12px 14px; color:#fff; box-shadow:var(--card-shadow);}
.time-top{display:flex; justify-content:space-between; align-items:baseline; font-weight:900;}
.time-top b{font-size:22px;} .time-top small{color:var(--leaf-300); font-weight:800;}
.time-bar{height:14px; background:rgba(0,0,0,.3); border-radius:99px; overflow:hidden; margin-top:8px; display:flex;}
.time-bar>i{height:100%; transition:width .3s;}
.time-bar>i.used{background:repeating-linear-gradient(45deg,var(--banana),var(--banana) 8px,#f5b800 8px,#f5b800 16px);}
.time-bar>i.over{background:var(--danger);}

/* ---- アクションカード ---- */
.act-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.act{background:var(--cream); border-radius:16px; padding:12px; box-shadow:var(--card-shadow); text-align:left; position:relative; border:3px solid transparent; transition:border-color .12s, transform .08s;}
.act .emo{font-size:26px;}
.act .nm{font-weight:900; font-size:15px; margin-top:2px;}
.act .ds{font-size:11px; color:var(--ink-soft); line-height:1.35; margin-top:2px; min-height:29px;}
.act .cost{display:inline-block; margin-top:6px; font-size:11px; font-weight:900; color:var(--leaf-700); background:var(--cream-2); padding:3px 8px; border-radius:8px;}
.act.on{border-color:var(--leaf-400); background:#f2fff7;}
.act.on::after{content:"✓"; position:absolute; top:8px; right:10px; background:var(--leaf-500); color:#fff; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:14px;}
.act.locked{opacity:.5; filter:grayscale(.7);}
.act .stepper{display:flex; align-items:center; gap:8px; margin-top:8px;}
/* B-1 仕込み回数の増減は最頻操作。タップ下限44pxを満たす（Fitts's Law）。
      flex で潰されると 44 を割るので、縮まないよう固定する。 */
.act .stepper button{flex:0 0 44px; width:44px; height:44px; border-radius:13px; border:none; font-weight:900; font-size:20px; background:var(--leaf-500); color:#fff;}
.act .stepper .cnt{flex:1 1 auto; min-width:0; font-weight:900; text-align:center; font-size:13px; line-height:1.2;}

/* 価格・広告コントロール */
.ctrl{background:var(--cream); border-radius:16px; padding:14px; box-shadow:var(--card-shadow); margin-bottom:10px;}
.ctrl .hd{display:flex; justify-content:space-between; align-items:center; font-weight:900;}
.ctrl .hd .big{font-size:22px; color:var(--leaf-700);}
/* 価格の直接入力。スライダーで大づかみ、ここで詰める */
.price-edit{display:inline-flex; align-items:baseline; gap:2px; font-size:18px;
  font-weight:900; color:var(--leaf-700);}
.pinput{
  width:5.2em; min-height:44px;          /* B-2と同じくタップ下限44pxを満たす */
  font:inherit; font-size:22px; font-weight:900; color:var(--leaf-700);
  text-align:right; background:#fff; border:2px solid var(--leaf-300); border-radius:10px;
  padding:2px 8px; -moz-appearance:textfield;
}
.pinput:focus{outline:none; border-color:var(--leaf-700); box-shadow:0 0 0 3px rgba(47,158,95,.18);}
.pinput::-webkit-outer-spin-button, .pinput::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0;
}
/* B-2 見た目の帯は10pxのまま、当たり判定だけ44pxに広げる。
      トラックは擬似要素で描くので、input 自身の高さは触れる面積として使える。 */
.slider{width:100%; margin-top:6px; -webkit-appearance:none; height:44px;
  background:transparent; outline:none; cursor:pointer;}
.slider::-webkit-slider-runnable-track{height:10px; border-radius:99px;
  background:linear-gradient(90deg,var(--sky),var(--banana),var(--coral));}
.slider::-moz-range-track{height:10px; border-radius:99px;
  background:linear-gradient(90deg,var(--sky),var(--banana),var(--coral));}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:30px; height:30px; border-radius:50%; background:#fff; border:4px solid var(--leaf-500); box-shadow:0 3px 8px rgba(0,0,0,.3); cursor:pointer; margin-top:-10px;}
.slider::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:#fff; border:4px solid var(--leaf-500);}
.slider:focus-visible::-webkit-slider-thumb{outline:3px solid var(--leaf-700); outline-offset:2px;}
.tiers{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
.tier{padding:12px 4px; border-radius:12px; border:3px solid #e7e0cf; background:#fff; font-weight:900; font-size:13px; text-align:center; cursor:pointer;}
.tier small{display:block; font-size:10px; color:var(--ink-soft); font-weight:800;}
.tier.on{border-color:var(--coral); background:#fff2ef; color:var(--coral-600);}

/* ---- キャラ吹き出し ---- */
.speech{display:flex; gap:10px; align-items:flex-start; background:var(--cream); border-radius:16px; padding:12px 14px; box-shadow:var(--card-shadow); animation:pop .3s ease;}
.speech .ava{font-size:34px; flex:0 0 auto; line-height:1;}
/* OWL は絵文字ではなく立ち絵で出す。決算のように感情が動く場面に絵文字が座っていると、
   プレイヤーはそこへ感情を預けられない。素材は正規化済みで表情を変えても位置がズレない。
   ——立ち絵側は width:100% を持つので、寸法はこのラッパーで決める（!important を使わない）。 */
.speech .ava .avaimg{display:block; width:54px; margin:-8px -2px -6px;
  filter:drop-shadow(1px 4px 6px rgba(40,28,12,.28));
  /* 立ち絵が完全に止まっていると人形に見える。呼吸だけ入れる（足元を軸にして浮かせない）。
     CHARACTER_PACK：プレイヤーが見ている時間の8割はアイドル。 */
  transform-origin:50% 94%; animation:jzBreath 3.4s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ .speech .ava .avaimg{animation:none;} }
.speech .bub{font-size:13.5px; line-height:1.55;}
.speech .bub b{color:var(--leaf-700);}

/* ---- モーダル ---- */
.overlay{position:fixed; inset:0; background:rgba(4,20,12,.62); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
.modal{background:var(--cream); border-radius:26px; width:100%; max-width:460px; max-height:92vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:pop .28s cubic-bezier(.2,1.2,.4,1);}
.modal .mhead{padding:20px 20px 6px; text-align:center;}
.modal .mbig{font-size:44px; line-height:1; margin-bottom:6px;}
.modal .mtit{font-size:20px; font-weight:900;}
.modal .mbody{padding:8px 20px 20px;}
@keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}

/* イベント選択肢 */
.choice{width:100%; text-align:left; background:#fff; border:3px solid #e7e0cf; border-radius:14px; padding:13px 14px; margin-top:9px; font-weight:800; font-size:14.5px; cursor:pointer; transition:border-color .1s, transform .06s;}
.choice:active{transform:scale(.99);}
.choice:hover{border-color:var(--leaf-400);}
.choice .cd{font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
.choice .k{display:inline-block; background:var(--leaf-500); color:#fff; width:22px; height:22px; border-radius:7px; text-align:center; line-height:22px; margin-right:8px; font-weight:900;}

/* 決算表 */
.pl{margin-top:6px;}
.pl .r{display:flex; justify-content:space-between; padding:8px 2px; border-bottom:1px dashed #e6dfce; font-size:15px;}
.pl .r b{font-weight:900;} .pl .r .tabnum{font-weight:800;}
.pl .r.total{border-bottom:none; border-top:3px solid var(--ink); margin-top:4px; padding-top:11px; font-size:18px;}
.pl .r.sub{color:var(--ink-soft); font-size:13.5px;}
.deltapill{font-size:12px; font-weight:900; padding:2px 7px; border-radius:8px; margin-left:6px;}
.deltapill.up{background:#e4f8ed; color:var(--good);} .deltapill.down{background:#ffe9e9; color:var(--danger);}

/* バッジ */
.badge-pop{font-size:64px; animation:badgepop .6s cubic-bezier(.2,1.4,.4,1);}
@keyframes badgepop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}

/* レーダーチャート最終画面 */
.final-score{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
.fs{background:#fff; border-radius:12px; padding:10px 6px; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,.08);}
.fs .n{font-size:11px; font-weight:800; color:var(--ink-soft);}
.fs .v{font-size:22px; font-weight:900;}

/* 小さなラインチャート */
.chart{width:100%; height:120px; display:block; background:#fff; border-radius:12px; margin-top:6px;}

/* フローティング下部バー */
.gobar{position:fixed; left:0; right:0; bottom:0; z-index:30; padding:12px 14px calc(12px + var(--sab)); background:linear-gradient(180deg, rgba(11,61,46,0), #0b3d2e 40%);}
.gobar .inner{max-width:720px; margin:0 auto;}

/* コイン演出 */
.coin{position:fixed; z-index:60; font-size:26px; pointer-events:none; animation:coinfly 1s ease forwards;}
@keyframes coinfly{0%{transform:translateY(0) scale(.6); opacity:0}20%{opacity:1}100%{transform:translateY(-120px) scale(1.2); opacity:0}}

/* トースト */
.toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#20301f; color:#fff; padding:11px 18px; border-radius:14px; font-weight:800; font-size:14px; z-index:70; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:toastin .3s ease;}
@keyframes toastin{from{transform:translate(-50%,-14px); opacity:0}to{transform:translate(-50%,0); opacity:1}}

/* 事業選択カード */
/* ---- 市場・競合バー（§19 §47）---- */
.marketbar{background:var(--cream); border-radius:14px; padding:9px 11px; margin-bottom:10px;
  box-shadow:var(--card-shadow); font-size:12px; color:var(--ink);}
.marketbar .mb-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.marketbar .mb-tag{font-weight:900; font-size:10.5px; letter-spacing:.03em;
  background:var(--leaf-900); color:var(--cream); border-radius:7px; padding:2px 7px;}
.marketbar .mb-reg{font-weight:900; font-size:12.5px;}
.marketbar .mb-fc{margin-left:auto; font-size:11.5px; color:var(--ink-soft);}
.marketbar .mb-sub{font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.45;}
.marketbar .mb-warn{font-size:11px; font-weight:800; color:var(--coral-600); margin-top:4px;}
/* ---- 難易度選択（§4 難易度は「世界の違い」）---- */
.sec-label{font-weight:900; font-size:14px; color:var(--cream); margin:0 2px 8px; letter-spacing:.02em;
  text-shadow:0 2px 8px rgba(0,0,0,.45);}
.diff-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:6px;}
@media (max-width:400px){ .diff-grid{grid-template-columns:1fr;} }
.diff-card{text-align:left; background:var(--cream); border-radius:16px; padding:12px;
  box-shadow:var(--card-shadow); border:3px solid transparent; cursor:pointer;
  transition:border-color .12s, transform .08s;}
.diff-card:active{transform:scale(.99);}
.diff-card.on{border-color:var(--banana);}
.diff-card .dhead{display:flex; align-items:center; gap:8px;}
.diff-card .de{font-size:26px;}
.diff-card .dn{font-weight:900; font-size:15px; line-height:1.15; display:flex; flex-direction:column;}
.diff-card .dn em{font-style:normal; font-weight:800; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em;}
.diff-card .dcon{font-weight:800; font-size:12.5px; color:var(--leaf-700); margin:6px 0 3px;}
.diff-card .dtx{font-size:11.5px; line-height:1.5; color:var(--ink-soft);}
.diff-card .daxes{margin-top:8px; display:grid; gap:3px;}
.diff-card .dax{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-soft);}
.diff-card .dax span{flex:0 0 74px;}
.diff-card .dax i{flex:1; height:5px; border-radius:3px; background:rgba(0,0,0,.09); overflow:hidden;}
.diff-card .dax b{display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--leaf-500), var(--banana-600));}
.biz-card{width:100%; text-align:left; background:var(--cream); border-radius:18px; padding:15px; box-shadow:var(--card-shadow); border:4px solid transparent; margin-bottom:12px; cursor:pointer; display:flex; gap:13px; align-items:center; transition:border-color .12s, transform .08s;}
.biz-card:active{transform:scale(.99);}
.biz-card.on{border-color:var(--banana);}
.biz-card .be{font-size:40px; flex:0 0 auto;}
.biz-card .bn{font-weight:900; font-size:17px;}

function levelForWeek(week){
  let lv=1; Object.keys(WEEK_UNLOCKS).forEach(w=>{ if(+w<=week) lv=Math.max(lv, WEEK_UNLOCKS[w].lv); });
  return lv;
}

/* ===== 24週で必ず通したい20の体験（§26 最終完成条件）===== */
const EXPERIENCES = {
  sales_up:    "売上が増えた",      first_loss:   "赤字を経験した",
  discount:    "値下げをした",      ads:          "広告を出した",
  ads_fail:    "広告で損をした",    conv_up:      "成約率を改善した",
  repeat:      "リピーターがついた", good_review:  "良い口コミが出た",
  bad_review:  "悪い口コミが出た",  oversell:     "売れすぎで捌けなかった",
  stockout:    "供給が足りなくなった", no_time:    "時間が足りなくなった",
  fatigue:     "疲労を抱えた",      hire:         "人を採用した",
  training:    "新人を育てた",      staff_issue:  "スタッフの問題に直面した",
  system:      "仕組み化した",      automation:   "自動化を導入した",
  cash_crisis: "資金危機を経験した", investment:   "投資判断をした",
};
// 体験を記録する。初回のみ 🎓 BUSINESS LESSON を出す（§9 失敗は罰ではなく学習イベント）
function markExp(key){
  const s=Engine.state; if(!s) return;
  s.exp = s.exp || {};
  if(s.exp[key]) return;
  s.exp[key]=true;
  if(LESSONS[key]) pendingLessons.push(key);
}
// 20体験の判定を一箇所に集約（§26）。本番(resolveWeek)もテスト(checkExperiences)もこれを呼ぶ。
// 判定を二重に書くと「テストは通るのに本番で立たない」順序バグが生まれるため、必ずここに集約する。
// 呼び出し規約：状態を今週ぶん更新し、今週の履歴を push した「後」に呼ぶ。
//   m = { prevRep, hadTrainee, prevSales, prevConv, eventId }（前4つは更新前の値。eventId は今週遭遇したイベントの id / なければ null）
function detectExperiences(s, res, m){
  const B=BUSINESSES[s.bizId];
  if(m.prevSales!=null && res.sales>m.prevSales) markExp("sales_up");
  if(res.opProfit<0) markExp("first_loss");
  if(res.price < B.price*0.9) markExp("discount");
  if(res.adCost>0){ markExp("ads");
    if(res.adReach*res.conversion*res.price < res.adCost || res.lost>0) markExp("ads_fail"); }
  if(m.prevConv!=null && res.conversion > m.prevConv*1.08) markExp("conv_up");
  if(res.repeatCustomers>=5) markExp("repeat");
  if(res.next.reputation > m.prevRep) markExp("good_review");     // 更新前の評判と比較
  if(res.next.reputation < m.prevRep-1.5) markExp("bad_review");
  if(res.lost>0){ markExp("stockout"); if(res.loadRatio>1.3) markExp("oversell"); }
  if(res.freeHours<=2) markExp("no_time");
  if(res.next.ownerFatigue>=60) markExp("fatigue");
  if((s.staff||[]).length>0){ markExp("hire"); if(m.hadTrainee) markExp("training"); }
  // スタッフ問題は状態からは検出できず、staff_morale イベント遭遇でのみ起きる
  // （同じ cat:"staff" でも talent は「チャンス」なので含めない）
  if(m.eventId==="staff_morale") markExp("staff_issue");
  if(res.next.systemLevel>=25) markExp("system");
  if((s.autos||[]).length>0) markExp("automation");
  // §31 資金の危うさは2つの形：①あと3週で尽きる ②黒字なのに現金が大きく減る
  if(s.cash < (res.fixed + res.salaries)*3
     || (res.opProfit>0 && res.cashDelta < -res.opProfit*0.5)) markExp("cash_crisis");
}
let pendingLessons=[];

// 週あたりの固定的な出費（固定費＋人件費＋自動化）。資金危機の規模を事業サイズに合わせる。
function weeklyBurn(s){
  const b=BUSINESSES[s.bizId];
  let salary=0; (s.staff||[]).forEach(e=>{ const id=(typeof e==="string")?e:e.id;
    const st=STAFF.find(x=>x.id===id); if(st) salary+=st.salary; });
  return b.fixed + salary + Economy.autoEffect(s).fixed;
}

/* 乱数（テスト再現性のためシード可能 §106）。乱数は不確実性の演出に限定する。 */
let _rndSeed = null;
function setSeed(s){ _rndSeed = (s===null||s===undefined) ? null : (s>>>0); }
function rnd(){
  if(_rndSeed===null) return Math.random();
  _rndSeed = (_rndSeed*1664525 + 1013904223) >>> 0;
  return _rndSeed / 4294967296;
}

const Economy = {
  clamp(v,min,max){ return Math.max(min, Math.min(max, v)); },

  // 季節係数（1年≒26週の緩やかな波）
  season(week){ return 1 + Math.sin((week/26)*Math.PI*2)*ECON.seasonAmplitude; },

  // スタッフの合計効果（§50 生産性 / §53 採用直後は戦力にならない）
  staffEffect(state){
    let cap=0, salary=0, conv=0, sys=0, aware=0, count=0, relief=0;
    (state.staff||[]).forEach(entry=>{
      const id = (typeof entry==="string") ? entry : entry.id;
      const weeks = (typeof entry==="string") ? 9 : (entry.weeks||1);
      const s = STAFF.find(x=>x.id===id); if(!s) return;
      const ramp = weeks<=1 ? 0.5 : weeks===2 ? 0.7 : weeks===3 ? 0.9 : 1.0; // §53 教育カーブ
      const motivation = (typeof entry==="object" && entry.motivation!=null) ? entry.motivation : 85;
      const prod = ramp * (0.70 + motivation/100*0.35);
      cap += s.cap*prod; conv += (s.conv||0)*prod; sys += (s.sysUp||0)*ramp;
      aware += (s.aware||0)*ramp;
      relief += (s.fatigueRelief||0)*ramp;   // §48 力仕事を代わってくれる＝オーナーの消耗が減る
      salary += s.salary; count++;
    });
    return {cap,salary,conv,sys,aware,count,relief};
  },

  // 自動化・設備の合計効果（§21）。入れすぎると人の手ざわりが減る（§57）
  autoEffect(state){
    let cap=0, fixed=0, repeat=0, aware=0, sat=0, count=0;
    (state.autos||[]).forEach(id=>{ const a=AUTOMATIONS.find(x=>x.id===id); if(!a) return;
      cap+=(a.cap||0); fixed+=a.fixed; repeat+=(a.repeat||0); aware+=(a.aware||0); sat+=(a.sat||0); count++; });
    // §57 自動化の罠：3つを超えると、機械的すぎて顧客体験が落ちる
    const overload = Math.max(0, count-3) * 4;
    return { cap, fixed, repeat, aware, sat: sat - overload, count, overload };
  },
  /* §7 固定費の内訳（表示専用）。実際に引かれた総額 res.fixed を、実費と1円もズレないように分解する。
     店舗固定費（家賃/光熱/通信/雑費）＋ 設備維持費。倍率は総額から逆算して内訳にも同じだけ効かせる。
     合計は必ず res.fixed に一致（端数は雑費で吸収）——だから計算・バランスには一切影響しない。 */
  fixedBreakdown(res, state){
    const b = BUSINESSES[state.bizId] || {};
    const autoFixed = this.autoEffect(state).fixed || 0;
    const baseSum = (b.fixed||0) + autoFixed;
    const M = baseSum>0 ? res.fixed/baseSum : 1;   // 実際にかかった総合倍率（難易度×テンション×縮小）
    const equip = Math.round(autoFixed * M);       // 設備維持費（導入した自動化の維持）
    const shop  = res.fixed - equip;               // 店舗の固定費（残り全部）
    const sp = ECON.fixedSplit;
    const rent    = Math.round(shop * sp.rent);
    const utility = Math.round(shop * sp.utility);
    const comm    = Math.round(shop * sp.comm);
    const misc    = shop - rent - utility - comm;  // 端数は雑費で吸収（合計＝res.fixed を保証）
    return { rent, utility, comm, misc, equip, total: res.fixed };
  },

  // §24 規模の経済（数が出るほど仕入単価が下がる）
  scaleCostMult(units){ for(const t of ECON.scaleTiers){ if(units<=t.upTo) return t.mult; } return 1; },

  // §14 顧客が感じる価値（価格だけで買わせない）
  perceivedValue(state, quality, serviceQuality){
    return quality + state.brand*0.4 + state.reputation*0.3 + serviceQuality*0.3;
  },

  // §58 §59 限界効用逓減（質を上げるほど、上げにくくなる）
  improveGain(q){ return Math.max(1.5, 9*(1 - q/115)); },

  // §76 いま一番の詰まりはどこか（OWLの問いかけの根拠になる）
  /* 資金繰りは「あと何週もつか」で重みを決める。固定の最強重みにすると、
     24週すべてが CASH になり、フェーズごとに用意した6つの学びが表に出てこない。
     薄いだけの週に、他の詰まりを全部持っていかせないこと。 */
  evaluateBottleneck(r, state){
    const list = [];
    const cashAfter = state.cash + r.cashDelta;
    const burn = Math.max(1, r.fixed + r.salaries);      // 給与も含めた本当の燃焼
    const weeksLeft = cashAfter / burn;
    // 6週分を切ってから効き始め、尽きるほど支配的になる（6週:0.5 → 2週:2.3 → 0週:3.6）
    if(weeksLeft < 6){
      const t = this.clamp((6 - this.clamp(weeksLeft, 0, 6)) / 6, 0, 1);
      list.push({code:"CASH", label:"資金繰り", w: 0.5 + Math.pow(t, 1.4) * 3.1});
    }
    if(r.capacity>0 && r.demandCustomers > r.capacity*1.05) list.push({code:"CAPACITY", label:"供給能力", w:1.2+r.demandCustomers/Math.max(1,r.capacity)});
    if(r.totalProspects < 25) list.push({code:"TRAFFIC", label:"集客", w:2.2 - r.totalProspects/25});
    if(r.conversion < 0.18) list.push({code:"CONVERSION", label:"成約率", w:1.9 - r.conversion*5});
    if(r.sales>0 && r.grossMargin < 0.45) list.push({code:"MARGIN", label:"利益率", w:1.6 - r.grossMargin});
    if(r.freeHours <= 2) list.push({code:"TIME", label:"自分の時間", w:1.7});
    /* §PEOPLE 自分自身が上限になっている。手は足りないのに、任せる先が育っていない。
       PHASES は PEOPLE を宣言しているのに、評価器に存在せず一度も出せなかった。
       ただし「まだ人を雇えない週」に言っても手の打ちようがないので、解放後に限る。 */
    const dep = r.next ? r.next.ownerDependency : (state.ownerDependency||100);
    const canAct = (typeof recruitGate==="function") ? recruitGate(state).ok : (state.week>=17);
    if(canAct && r.freeHours <= 8 && dep >= 70 && r.loadRatio > 0.80)
      list.push({code:"PEOPLE", label:"人と仕組み", w: Math.min(1.6, 1.25 + (dep-70)/75)});
    /* §CAPITAL 現金は足りているのに、次の成長へ配分できていない。
       経営者の仕事＝資源配分そのものが、詰まりとして一度も出てこなかった。 */
    if(state.week >= 17 && weeksLeft >= 10 && (state.systemLevel||0) < 40
       && (state.autos||[]).length === 0)
      list.push({code:"CAPITAL", label:"資本の配分", w:1.5});
    if(!list.length) return {code:"NONE", label:"大きな詰まりなし"};
    // いまのフェーズが教えようとしている詰まりは、実際に起きているときだけ少し前に出す
    const want = (typeof phaseOf==="function") ? (phaseOf(state.week)||{}).bottleneck : null;
    if(want) list.forEach(x=>{ if(x.code===want) x.w *= 1.25; });
    list.sort((a,b)=>b.w-a.w);
    return list[0];
  },

  // 1週間を計算する。state は変更せず結果を返す（因果の透明性）。順序は設計書 §101。
  computeWeek(state, plan, ctx){
    ctx = ctx||{};
    const b = BUSINESSES[state.bizId];
    const staff = this.staffEffect(state);
    const auto  = this.autoEffect(state);

    /* ── 1. calculateMarket（§6）市場需要 ──
       事業が育つと「届く範囲」そのものが広がる。ブランド・評判・仕組み・仲間が
       商圏を押し広げる（＝24週で規模が変わる）。*/
    const season = this.season(state.week);
    // §11 乱数の配分：序盤ほど「判断が結果を決める」。終盤は不確実性を上げる。
    const varScale = state.week<=8 ? 1.0 : state.week<=16 ? 1.7 : 2.4;
    // §21 難易度は「ブレ幅」そのものを変える（volMult）。1.0で従来と同一。
    const variance = 1 + (rnd()*2-1)*ECON.marketVariance*varScale*(ctx.volMult||1);
    // 商圏が広がるのは「平均より良い」からであって、普通にやっているからではない。
    // 評判50は世間並み＝商圏は広がらない。そこを超えた分だけ届く範囲が増える。
    const marketExpansion = 1
      + (state.brand + Math.max(0, state.reputation - ECON.reputationBaseline))/ECON.reachExpansionDiv
      + (state.systemLevel||0)/ECON.systemExpansionDiv
      + staff.count*ECON.staffExpansion;
    const marketDemand = b.market * marketExpansion * season * variance * (ctx.marketMult||1);

    /* ── 2. 今週の実効パラメータ ── */
    const quality = this.clamp(state.quality + (ctx.qualityBonus||0), 0, 100);
    const price = Math.round(plan.price * (ctx.priceMult||1));
    const fatigued = (state.ownerFatigue||0) > ECON.fatigueThreshold;   // §46
    const serviceQuality = this.clamp(
      (state.serviceQuality!=null?state.serviceQuality:50)
      + (plan.actions.includes("service") ? 18 : 0)
      - (fatigued ? 15 : 0), 0, 100);

    /* ── 3. calculateOrganicTraffic（§7）認知が生む見込み客 ── */
    const organicReach = marketDemand * (state.awareness/100);

    /* ── 4. calculatePaidTraffic（§10 §11）広告は疲労で効率が落ちる ── */
    // §6 広告オークション：競合が同じ枠を買うとCPCが上がる（cpcMult）。
    //    §6 オーディエンス飽和：出稿を続けるほど1円あたりの到達が痩せる（adSatMult）。
    const adEfficiency = Math.max(0.25, 1 - (state.adFatigue||0)/150) * (ctx.adSatMult||1);
    const effCPC = ECON.baseCPC * (1 + (state.complexity||0)/300) * (ctx.cpcMult||1);
    const adCost = plan.adBudget||0;
    const adReach = adCost>0 ? (adCost/effCPC)*adEfficiency : 0;

    /* ── 5. calculateRepeatTraffic（§39）リピートプールから戻ってくる客 ── */
    const returningCustomers = (state.repeatPool||0) * ECON.purchaseFrequency;

    /* ── 6. calculateTotalProspects ── */
    const totalProspects = Math.max(0,
      (organicReach + adReach + (ctx.reachBonus||0)) * (ctx.reachMult||1));

    /* ── 7. calculatePerceivedValue（§14） ── */
    const pv = this.perceivedValue(state, quality, serviceQuality);

    /* ── 8. calculateConversion（§13 §15 §17 §18） ── */
    const valueModifier = 0.55 + (pv/ECON.pvBaseline)*0.50;
    const trustModifier = 0.80 + state.reputation/100*0.40;
    const brandModifier = 1 + state.brand/100*0.25;
    // §18 ブランドは値上げ耐性になる。§7 難易度が上がるほど価格への反応そのものが鋭くなる。
    const effElas = b.elas * (1 - state.brand*0.004) * (ctx.elasMult||1);
    // §7 §8 相場は競合が作る。競合が値下げすれば、同じ価格でも「高い」になる。
    //    値上げに耐えられるかはブランド次第（effElas が下がる）＝価格戦略に対抗策が生まれる。
    const refPrice = b.price * (ctx.marketPriceMult||1);
    const priceRatio = price / refPrice;
    const priceModifier = Math.pow(priceRatio, -effElas);  // 値上げは成約率を下げる（§17）
    const salesBoost = plan.actions.includes("sales") ? 1.18 : 1;
    const researchBoost = plan.actions.includes("research") ? 1.07 : 1;
    let conversion = b.baseConv * valueModifier * trustModifier * brandModifier
                     * priceModifier * salesBoost * researchBoost * (ctx.convMult||1)
                     + staff.conv + (state.convPermanent||0);
    conversion = this.clamp(conversion, 0.01, 0.95);

    /* ── 9. calculateDemand ── */
    const newDemand = totalProspects * conversion;
    const demandCustomers = newDemand + returningCustomers;

    /* ── 10-11. calculateCapacity / ActualCustomers（§19 §20 売り切れ） ── */
    const produceBlocks = plan.produce||0;
    // §55 仕組み化は同じ時間で回せる量を増やす（＝自分の時間を空ける）
    // 仕組みが整った現場では、スタッフ1人が捌ける量も増える
    const systemBoost = 1 + (state.systemLevel||0)/150;
    const staffLeverage = 1 + (state.systemLevel||0)/100*ECON.staffSystemLeverage;
    // §12 営業を絞ると、同じ人数でも捌ける量が落ちる（capPenalty）
    const capacity = Math.floor(
      (produceBlocks * b.capPerBlock * (1 + quality/400) * systemBoost
       + staff.cap * staffLeverage) * (1 + auto.cap) * (ctx.capMult||1)
      * (1 - (state.capPenalty||0)));
    const actual = Math.floor(Math.min(demandCustomers, capacity));
    const lost = Math.max(0, Math.round(demandCustomers - actual));
    const loadRatio = capacity>0 ? demandCustomers/capacity : (demandCustomers>0 ? 9 : 0);

    /* ── 12. calculateSales（§21） ── */
    const sales = Math.round(actual * price);

    /* ── 13. calculateCOGS（§23 §24 §25） ── */
    const scaleMult = this.scaleCostMult(actual);                       // 規模の経済
    const unitCost = Math.round(b.cost * scaleMult * (ctx.costMult||1) * (1 + (quality-50)/500));
    const cogs = Math.round(actual * unitCost);
    const overProduced = Math.max(0, capacity - actual);
    const spoilLoss = Math.round(overProduced * unitCost * (b.spoil||0) * 0.5); // 作りすぎは廃棄

    /* ── 14. calculateCustomerSatisfaction（§33 §34 期待値 §35 待ち時間） ── */
    const expected  = ECON.expectationBase + state.brand*ECON.brandExpectation; // ブランドは期待も上げる
    const delivered = quality*0.7 + serviceQuality*0.3;
    // 係数1.1：質と接客を磨けば満足度90台に届く。手を抜けば一気に落ちる。
    const expectationGap = (delivered - expected)*1.10;
    const waitPenalty = loadRatio>1 ? Math.min(30, (loadRatio-1)*ECON.waitPenaltyPerLoad) : 0;
    const targetSat = this.clamp(50 + expectationGap - waitPenalty + auto.sat + (ctx.satBonus||0), 0, 100);
    const newSat = this.clamp(state.satisfaction + (targetSat - state.satisfaction)*0.40, 0, 100);

    /* ── 15. calculateReviews（§36 §37 §61） ──
       評判は「最近の体験」を映す遅行指標。満足度へ寄っていき、待たせると下がる。
       ブランド（長期資産）と違って、良くも悪くも動きが速い。 */
    const targetRep = this.clamp(
      newSat + (newSat>=85 ? 8 : 0)
      - (lost>0 ? Math.min(12, lost/Math.max(1,demandCustomers)*16) : 0), 0, 100);
    const newRep = this.clamp(
      state.reputation + (targetRep - state.reputation)*0.25 + (ctx.repBonus||0), 0, 100);

    /* ── 16. calculateRepeatCustomers（§38 §39 リピートプール） ── */
    // 満足度がリピートを大きく左右する（低いと毎週ゼロから集客することになる）
    const repeatRate = this.clamp(b.repeat*(0.30 + newSat/100*1.40)*(1 + state.brand/300) + auto.repeat, 0, 0.85);
    // §48 取りこぼした客・不満な客は競合へ流れる（poolDrain）。放置した供給不足は資産を削る。
    const newPool = Math.max(0,
      ((state.repeatPool||0)*ECON.poolRetention - returningCustomers*0.15 + actual*repeatRate)
      * (1 - (ctx.poolDrain||0)));

    /* ── 17. calculateMarketingMetrics（§40 §41 §42 §43） ── */
    const newCustomers = Math.max(0, Math.round(actual - Math.min(actual, returningCustomers)));
    const cac = newCustomers>0 && adCost>0 ? Math.round(adCost/newCustomers) : null;
    const contributionMargin = price - unitCost;                        // §43
    const grossMarginRate = sales>0 ? (sales-cogs)/sales : 0;
    const ltv = Math.round(price * (grossMarginRate||0.5) * (1/(1-Math.min(0.8, repeatRate))));
    const roas = adCost>0 ? (adReach*conversion*price)/adCost : null;
    const breakEvenCAC = Math.round(contributionMargin * (1/(1-Math.min(0.8, repeatRate))));

    /* ── 18-20. コスト・利益（§27 §28 §29） ── */
    const salaries = staff.salary;
    // 自動化は毎週の固定費として効き続ける。§12 縮小すると固定費そのものが下がる
    // §3 固定費は難易度で変わる（diffFixedMult）。state.fixedMult は縮小オペ（§12）の分。
    const fixed = Math.round((b.fixed + auto.fixed)
      * (state.fixedMult!=null ? state.fixedMult : 1) * (ctx.fixedMult||1));
    /* 利息は費用。利益から引かれる（元金の返済は費用ではないので、ここには出さない）。
       週0.3%（年15.6%）は消費者金融の水準で、創業融資（年3.25〜4.65%）とは別物だった。
       信用に応じた実勢の年利を週割りする。 */
    const annual = (typeof Finance!=="undefined" && Finance.rate) ? Finance.rate(state) : 0.04;
    const interest = Math.round(((state.debt||0)+(state.loan||0)) * annual/52);
    const otherOut = (ctx.cashOut||0), otherIn = (ctx.cashIn||0);
    const gross = sales - cogs;
    const opProfit = gross - adCost - salaries - fixed - spoilLoss - interest;

    /* ── 21. calculateCashFlow（§30 §31 利益とキャッシュは別物） ── */
    const cashDelta = opProfit - otherOut + otherIn;

    /* ── 22. calculateFatigue（§45 §46） ── */
    const over = Math.max(0, plan.hoursUsed - CONFIG.baseHours);
    const newFatigue = this.clamp((state.ownerFatigue||0) + over*2
      + (plan.hoursUsed>=38 ? 6 : 0) - (plan.hoursUsed<=25 ? 10 : 2)
      - (staff.relief||0)                      // §48 力仕事を担ってくれる仲間がいると消耗が減る
      + (ctx.fatigueBonus||0), 0, 100);

    /* ── 23. calculateBrand（§60 §61 ブランドはゆっくり動く） ── */
    /* §5 §43 SNSも「打ち続ければ効く」わけではない。同じ発信を毎週続けると飽きられる。
       休めば戻る。無料だからと連打するのではなく、いつ出すかを選ぶ行動にする。 */
    const snsEfficiency = Math.max(ECON.snsFatigueFloor, 1 - (state.snsFatigue||0)/ECON.snsFatigueDiv);
    const snsUsed = plan.actions.includes("sns");
    const snsGain = snsUsed ? 6*b.sns*snsEfficiency : 0;
    const newSnsFatigue = this.clamp((state.snsFatigue||0)
      + (snsUsed ? ECON.snsFatiguePerUse : -ECON.snsFatigueRecover), 0, 100);
    const newBrand = this.clamp(state.brand + snsGain*0.16 + (newSat>75?1.4:0)
      + (ctx.brandBonus||0) - 0.25, 0, 100);

    /* ── 認知の更新（§8 ブランドが高いほど忘れられにくい） ── */
    const decay = Math.max(0.005,
      (ECON.awarenessDecay - state.brand*ECON.brandDecayShield) * (ctx.decayMult||1));
    const adAwareGain = adCost>0 ? Math.min(7, adCost/7000) : 0;
    const newAware = this.clamp(
      state.awareness*(1-decay) + snsGain
      + (plan.actions.includes("sales") ? ECON.salesAwareGain : 0)
      + adAwareGain
      // 普通のサービスは口コミされない。期待を超えたぶんだけ人は人に話す（§36）。
      + (actual>0 ? Math.max(0, (newSat - ECON.wordOfMouthFloor)/100) * ECON.wordOfMouthGain : 0)
      + (state.systemLevel/100)*ECON.systemAwareGain
      + auto.aware + staff.aware + (ctx.awareBonus||0), 0, 100);

    /* ── 広告疲労の更新（§11） ── */
    let newAdFatigue = (state.adFatigue||0)
      + (adCost>0 ? ECON.adFatiguePerUse : -ECON.adFatigueRecover)
      - (plan.actions.includes("improve") ? ECON.adImproveRelief : 0);
    newAdFatigue = this.clamp(newAdFatigue, 0, 100);

    /* ── 品質・サービス・仕組み・複雑性・オーナー依存度 ── */
    const newQuality = this.clamp(
      quality + (plan.actions.includes("improve") ? this.improveGain(quality) : 0) - 0.4, 0, 100);
    const newServiceQ = this.clamp(serviceQuality + (plan.actions.includes("service") ? 3 : -1.5), 0, 100);
    const newSystem = this.clamp(state.systemLevel + (plan.actions.includes("manual")?8:0)
      + staff.sys + (ctx.systemBonus||0), 0, 100);
    const newComplexity = this.clamp(                                    // §71 §72 雪だるま防止
      staff.count*ECON.complexityPerStaff + sales*ECON.complexityPerSalesStep - newSystem*0.5, 0, 100);
    const ownerDependency = this.clamp(100 - newSystem*0.6 - staff.count*12, 0, 100); // §48

    const r = {
      // 今週の結果
      week:state.week, price, unitCost, capacity, conversion,
      marketDemand:Math.round(marketDemand),
      organicReach:Math.round(organicReach), adReach:Math.round(adReach),
      totalProspects:Math.round(totalProspects), totalReach:Math.round(totalProspects),
      newInterested:Math.round(newDemand), repeatCustomers:Math.round(returningCustomers),
      demandCustomers:Math.round(demandCustomers), potential:Math.round(demandCustomers),
      actual, lost, loadRatio, newCustomers,
      sales, cogs, gross, adCost, salaries, fixed, spoilLoss, interest, otherOut, otherIn,
      opProfit, cashDelta, grossMargin:grossMarginRate, avgPrice:price,
      perceivedValue:Math.round(pv), priceModifier, repeatRate,
      cac, ltv, roas, contributionMargin, breakEvenCAC,
      hoursUsed:plan.hoursUsed, freeHours:Math.max(0, CONFIG.baseHours - plan.hoursUsed),
      // 次週へ持ち越す状態
      next:{ awareness:newAware, quality:newQuality, satisfaction:newSat, brand:newBrand,
             reputation:newRep, serviceQuality:newServiceQ, systemLevel:newSystem,
             repeatPool:newPool, activeCustomers:Math.round(newPool),
             adFatigue:newAdFatigue, snsFatigue:newSnsFatigue, ownerFatigue:newFatigue,
             complexity:newComplexity, ownerDependency,
             convPermanent:(state.convPermanent||0)+(ctx.convPermanent||0) },
      ctxNote: ctx.note, ctxChar: ctx.char, ctxXp: ctx.xp||0,
    };
    r.bottleneck = this.evaluateBottleneck(r, state);   // §76
    return r;
  },
};

/* ========================= 市場レジーム（§21〜§23） =========================
   市場は毎週ランダムに変わるのではなく「流れ」を持つ。Markov連鎖で状態遷移し、
   難易度が高いほど転換が増える。ただし転換前には必ず予兆（news）を出す（§23）。 */
const REGIMES = {
  BOOM:      { id:"BOOM",      name:"好況",  emoji:"🔥", demand:1.32, cpc:1.22, elas:0.90,
               news:"街に人が増えている。財布のひもがゆるい。" },
  GROWTH:    { id:"GROWTH",    name:"成長",  emoji:"📈", demand:1.13, cpc:1.07, elas:0.96,
               news:"客足が伸びてきた。市場そのものが広がっている。" },
  NORMAL:    { id:"NORMAL",    name:"平常",  emoji:"☀️", demand:1.00, cpc:1.00, elas:1.00,
               news:"特に大きな動きはない。いつも通りの週。" },
  SLOWDOWN:  { id:"SLOWDOWN",  name:"減速",  emoji:"🌥", demand:0.85, cpc:0.95, elas:1.08,
               news:"客の動きが鈍い。みんな財布を見ている。" },
  RECESSION: { id:"RECESSION", name:"不況",  emoji:"🌧", demand:0.66, cpc:0.88, elas:1.20,
               news:"街から人が消えた。値段を見てから買う人が増えた。" },
};
// 遷移確率（§22 NORMALからの分岐は仕様の値をそのまま使う）
const REGIME_MATRIX = {
  BOOM:      { BOOM:0.45, GROWTH:0.30, NORMAL:0.18, SLOWDOWN:0.05, RECESSION:0.02 },
  GROWTH:    { BOOM:0.08, GROWTH:0.50, NORMAL:0.30, SLOWDOWN:0.10, RECESSION:0.02 },
  NORMAL:    { BOOM:0.03, GROWTH:0.15, NORMAL:0.60, SLOWDOWN:0.20, RECESSION:0.02 },
  SLOWDOWN:  { BOOM:0.01, GROWTH:0.10, NORMAL:0.32, SLOWDOWN:0.42, RECESSION:0.15 },
  RECESSION: { BOOM:0.01, GROWTH:0.06, NORMAL:0.22, SLOWDOWN:0.35, RECESSION:0.36 },
};
const MarketRegime = {
  def(s){ return REGIMES[(s.regime&&s.regime.id)||"NORMAL"]; },

  // 難易度の「粘り」で自己遷移確率を調整してから抽選する
  next(s){
    const p = Difficulty.profile(s);
    const cur = (s.regime&&s.regime.id)||"NORMAL";
    const row = REGIME_MATRIX[cur];
    const w = {}; let sum=0;
    // stickiness 0.74（NORMAL）を中立として、自己遷移の重みを増減する
    Object.keys(row).forEach(k=>{
      w[k] = row[k] * (k===cur ? (p.regimeStickiness/0.74) : 1);
      sum += w[k];
    });
    let r = rnd()*sum, pick = cur;
    for(const k of Object.keys(w)){ r -= w[k]; if(r<=0){ pick=k; break; } }
    return pick;
  },

  // §23 予兆：次に「下」へ向かう確率が高いときだけニュースを出す
  omen(s){
    const cur = (s.regime&&s.regime.id)||"NORMAL";
    const row = REGIME_MATRIX[cur];
    const down = row.SLOWDOWN + row.RECESSION, up = row.BOOM + row.GROWTH;
    if(down>=0.30) return { dir:"down", text:"来週にかけて客足が落ちる兆しがある。" };
    if(up>=0.30)   return { dir:"up",   text:"来週にかけて市場が伸びる兆しがある。" };
    return null;
  },

  tick(s){
    if(!s.regime) s.regime = { id:"NORMAL", weeks:0 };
    const nx = this.next(s);
    const changed = nx !== s.regime.id;
    s.regime = { id:nx, weeks: changed ? 1 : (s.regime.weeks||0)+1, changed };
    return s.regime;
  },
};

/* ========================= 競合AI（§11〜§14 §46〜§49） =========================
   競合は背景の数字ではなく、プレイヤーとの反復ゲーム（repeated game）の相手。
   直近の価格・広告・シェアを記憶し、アーキタイプごとに違う反応を返す。
   HARD は「弱点を突く」、EXPERT は「過去から戦略を推定して先回りする」。 */
const COMPETITOR_TYPES = {
  price_hunter: { id:"price_hunter", name:"安売りハイエナ", emoji:"🏷",
    desc:"こちらが値下げすると、さらに下を取ってくる。価格戦争を仕掛ける相手。",
    counters:"price" },
  brand_builder:{ id:"brand_builder", name:"ブランド志向の老舗", emoji:"💎",
    desc:"価格競争を避け、品質とブランドに投資する。こちらの値上げに耐性を作ってくる。",
    counters:"quality" },
  growth_attacker:{ id:"growth_attacker", name:"攻めの新興", emoji:"🚀",
    desc:"こちらが捌けなかった客を広告で刈り取る。供給不足を放置すると奪われる。",
    counters:"capacity" },
};
const Competitor = {
  init(s){
    const ids = Object.keys(COMPETITOR_TYPES);
    return ids.map(id=>({
      id, price:1.00, ad:0.30, brand:20, share:0.20, aggression:0,
      memory:{ prices:[], ads:[], shares:[], lost:[] },
    }));
  },

  // §47 直近 memory 週ぶんのプレイヤー行動を記録する
  remember(s, r, plan){
    const p = Difficulty.profile(s), keep = p.competitorMemory;
    const b = BUSINESSES[s.bizId];
    const share = r.marketDemand>0 ? Math.min(1, r.actual/Math.max(1,r.marketDemand)) : 0;
    // §14 「今週の打ち手」を1つの指紋にする。これが同じまま続けば、相手に読まれる。
    const sig = [plan.produce, Math.round((plan.price||b.price)/b.price*20),
                 Math.min(5, Math.round((plan.adBudget||0)/10000)),
                 (plan.actions||[]).slice().sort().join("+")].join("/");
    (s.competitors||[]).forEach(c=>{
      const m=c.memory;
      m.prices.push((plan.price||b.price)/b.price);
      m.ads.push(plan.adBudget||0);
      m.shares.push(share);
      m.lost.push(r.lost||0);
      if(!m.sigs) m.sigs=[];
      m.sigs.push(sig);
      ["prices","ads","shares","lost","sigs"].forEach(k=>{ while(m[k].length>keep) m[k].shift(); });
    });
  },

  /* §14 §49 読まれやすさ。直近の打ち手がどれだけ同じかを 0〜1 で返す。
     EASY の競合はこれを見抜けない。EXPERT の競合はここから先回りしてくる。 */
  predictability(s, c){
    const m=c.memory, sg=m.sigs||[];
    if(sg.length<3) return 0;
    const lastSig=sg[sg.length-1];
    let same=0; for(let i=sg.length-1;i>=0 && sg[i]===lastSig;i--) same++;
    return Math.min(1, (same-1)/Math.max(2, sg.length-1));
  },

  // §14 §49 EXPERT はパターンを推定する。「同じ手の連打」を検出して先回りする。
  exploit(s, c){
    const p = Difficulty.profile(s);
    const m = c.memory, n = m.prices.length;
    if(n<3) return null;
    const intel = p.axes.competitorIntelligence/100;      // 0.10〜0.95
    if(intel < 0.55) return null;                         // EASY/NORMAL は見抜けない
    const avgP = m.prices.reduce((a,x)=>a+x,0)/n;
    const avgA = m.ads.reduce((a,x)=>a+x,0)/n;
    const avgL = m.lost.reduce((a,x)=>a+x,0)/n;
    // 連打しているほど exploit が強くなる（同じ戦略の繰り返しが危険 §14）
    const varP = m.prices.reduce((a,x)=>a+Math.abs(x-avgP),0)/n;
    const streak = varP<0.05 ? 1 : 0.4;                   // 価格を動かしていない＝読まれる
    if(avgP<0.88 && c.id==="price_hunter")
      return { kind:"price_war", power:streak*intel, note:"値下げの連打を読まれた" };
    if(avgA>18000 && (c.id==="growth_attacker"||c.id==="price_hunter"))
      return { kind:"ad_auction", power:streak*intel*Math.min(1.6, avgA/30000), note:"広告の連打で入札が競り上がった" };
    if(avgP>1.12 && c.id==="brand_builder")
      return { kind:"undercut_premium", power:intel, note:"高値を続けたので中価格帯を取られた" };
    if(avgL>8 && c.id==="growth_attacker")
      return { kind:"steal_lost", power:intel*Math.min(1.5, avgL/15), note:"取りこぼした客を狙われた" };
    return null;
  },

  // §12 §13 §48 アーキタイプごとの反応。難易度で反応速度と精度が変わる。
  tick(s){
    const p = Difficulty.profile(s);
    const speed = p.competitorReactionSpeed, aggr = p.competitorAggression;
    const notes = [];
    (s.competitors||[]).forEach(c=>{
      const m = c.memory, n = m.prices.length;
      const lastP = n ? m.prices[n-1] : 1;
      const lastA = n ? m.ads[n-1] : 0;
      const lastL = n ? m.lost[n-1] : 0;
      // EASY は判断を間違える（§13 反応遅い・判断ミスあり）
      const mistake = rnd() < (1-p.axes.competitorIntelligence/100)*0.5;
      let tp = c.price, ta = c.ad;

      if(c.id==="price_hunter"){
        // §7 こちらが下げれば、さらに下を取る
        tp = mistake ? c.price : Math.max(0.62, lastP - 0.04*aggr);
        ta = 0.25 + aggr*0.25;
      } else if(c.id==="brand_builder"){
        // §8 価格競争を避け品質へ。こちらの値上げには中価格帯で応じる
        tp = mistake ? c.price : (lastP>1.10 ? 0.98 : 1.06);
        c.brand = Economy.clamp(c.brand + 1.4*aggr, 0, 100);
        ta = 0.20 + aggr*0.15;
      } else {
        // §48 供給不足・シェア急増に反応して広告を増やす
        const hungry = (lastL>5?1:0) + (n>1 && m.shares[n-1]>m.shares[0]+0.05 ? 1:0);
        ta = mistake ? c.ad : Math.min(1.8, 0.25 + aggr*(0.35 + hungry*0.45));
        tp = 0.96;
      }
      // 反応速度ぶんだけ目標へ近づく（EASY は遅い＝すぐには追随してこない）
      c.price += (tp - c.price) * speed;
      c.ad    += (ta - c.ad)    * speed;

      const ex = this.exploit(s, c);
      c.exploit = ex;
      if(ex){
        notes.push({ by:c.id, ...ex });
        if(ex.kind==="price_war")       c.price = Math.max(0.58, c.price - 0.05*ex.power);
        if(ex.kind==="ad_auction")      c.ad    = Math.min(2.2, c.ad + 0.45*ex.power);
        if(ex.kind==="undercut_premium")c.price = Math.min(c.price, 0.95);
        if(ex.kind==="steal_lost")      c.ad    = Math.min(2.2, c.ad + 0.35*ex.power);
      }
      c.aggression = aggr;
    });
    s.competitorNotes = notes;
    return notes;
  },

  // 競合の状態を「世界の係数」に翻訳する
  pressure(s){
    const cs = s.competitors||[];
    if(!cs.length) return { priceLevel:1, adPressure:0, drain:0, reachLoss:0, notes:[] };
    const p = Difficulty.profile(s);
    const B = BUSINESSES[s.bizId];
    const priceLevel = cs.reduce((a,c)=>a+c.price,0)/cs.length;
    const adPressure = cs.reduce((a,c)=>a+c.ad,0)/cs.length;
    const attacker = cs.find(c=>c.id==="growth_attacker");
    // §48 攻めの新興が広告を張っているほど、こちらのリピート資産が削られる
    const drain = Math.min(0.22, (attacker? attacker.ad:0) * 0.09
      + (cs.some(c=>c.exploit&&c.exploit.kind==="steal_lost") ? 0.05 : 0));
    /* §8 値上げへの対抗。相場より高く売るなら、その理由がブランドで説明できなければ
       客は競合へ流れる（＝届く範囲そのものが痩せる）。ブランドが立てば完全に無効化できる。
       「小さく作って高く売るだけ」を最適解にしないための対抗策。 */
    const myRatio = (s.price||B.price)/B.price;
    const gap = Math.max(0, myRatio - priceLevel);
    const brandShield = Math.min(1, (s.brand||0)/ECON.priceTrustBrand);
    const priceLoss = Math.min(0.45, gap * 0.95 * (1-brandShield) * (0.5+p.competitorAggression*0.7));
    /* §14 §49 同じ打ち手の連打は読まれる。読まれた分だけ先回りされ、客を持っていかれる。
       EASY の競合は見抜けない（intel 0.10）。EXPERT はほぼ確実に見抜く（intel 0.95）。
       これが HARD「世界が厳しい」と EXPERT「世界がこちらに適応する」の差になる。 */
    const intel = p.axes.competitorIntelligence/100;
    const pred = cs.reduce((a,c)=>a+this.predictability(s,c),0)/cs.length;
    const readLoss  = pred * intel * 0.30;
    const readDrain = pred * intel * 0.09;
    const reachLoss = Math.min(0.60, priceLoss + readLoss);
    return { priceLevel, adPressure, drain: Math.min(0.30, drain+readDrain),
             reachLoss, priceLoss, readLoss, predictability:pred, gap, brandShield,
             notes:s.competitorNotes||[] };
  },
};

/* ========================= 難易度エンジン（§3〜§5 §24〜§26） ========================= */
// §25 テンション曲線。24週を単調に厳しくせず、4週ごとに山と谷を作る。
const DIFFICULTY_PULSE = [
  0.50,0.60,0.75,1.00,  0.75,0.90,1.05,1.25,  0.85,1.05,1.20,1.40,
  1.00,1.20,1.40,1.60,  1.10,1.35,1.55,1.75,  1.30,1.55,1.75,2.00,
];
// §26 Difficulty Budget の配分先。毎週同じ問題を出さないためのローテーション。
const PRESSURE_KINDS = ["market","competitor","cash","supply","staff"];
const PRESSURE_LABEL = { market:"市場変動", competitor:"競合圧力", cash:"資金圧力",
                         supply:"供給リスク", staff:"人の問題" };
const Difficulty = {
  profile(s){ return DIFFICULTY[(s&&s.difficulty)||"NORMAL"] || DIFFICULTY.NORMAL; },

  // §25 週ごとの圧力の強さ（24週以降は最大値で頭打ち＋わずかに上げ続ける）
  pulse(week){
    const w = Math.max(1, week|0);
    if(w<=24) return DIFFICULTY_PULSE[w-1];
    return Math.min(2.6, 2.00 + (w-24)*0.012);
  },
  // 24週の平均パルス。これで割ると「平常が1.0」になる（総量を変えずに配分だけ変えるため）
  pulseMean: DIFFICULTY_PULSE.reduce((a,b)=>a+b,0) / DIFFICULTY_PULSE.length,

  /* §24 §25 テンション曲線を固定費に効かせる。
     序盤は認知が低く固定費だけが出ていくので、放っておくと「最初の8週が一番苦しい」
     という設計と逆の形になる（実測で赤字率 W1-8 が 76〜98%、相関 −0.94）。
     24週の総額は保ったまま、序盤を軽く・終盤を重くして山と谷を作る。 */
  loadCurve(week){
    const t = this.pulse(week) / this.pulseMean;      // 平常=1.0
    return 0.35 + 0.65 * t;                           // W1≒0.62 → W24≒1.44
  },

  // §26 100点を配分する。どの圧力を高めるかを週ごとに変える。
  budget(s){
    const total = 100 * this.pulse(s.week);
    const i = (s.week-1) % PRESSURE_KINDS.length;
    const primary = PRESSURE_KINDS[i], secondary = PRESSURE_KINDS[(i+2)%PRESSURE_KINDS.length];
    const alloc = {};
    PRESSURE_KINDS.forEach(k=> alloc[k] = total*0.10);
    alloc[primary]   += total*0.30;
    alloc[secondary] += total*0.20;
    return { total, primary, secondary, alloc };
  },

  // 世界の状態（難易度 × レジーム × 競合 × パルス）を computeWeek 用の ctx に翻訳する
  ctx(s){
    const p = this.profile(s);
    const R = MarketRegime.def(s);
    const cp = Competitor.pressure(s);
    const bg = this.budget(s);
    const A = bg.alloc;
    // 市場：レジーム × 難易度ドリフト（EASYは伸び、EXPERTは縮む）
    const drift = Math.pow(1 + p.demandDrift, Math.max(0, s.week-1));
    return {
      marketMult: R.demand * drift,
      volMult:    p.demandVolatility * (0.70 + A.market/50),
      // §6 広告：レジーム × 競合の入札 × 難易度の基準CPC
      cpcMult:    p.cpcBase * R.cpc * (1 + cp.adPressure*0.45*(0.7+A.competitor/60))
                  * (1 + (rnd()*2-1)*p.cpcVolatility),
      // §6 オーディエンス飽和：出稿を続けるほど効率が落ちる
      adSatMult:  1 / (1 + (s.adFatigue||0)/100 * p.adSaturation),
      // §7 §8 相場は競合が作る
      marketPriceMult: cp.priceLevel,
      // §8 ブランドなき高値は、客が競合へ流れて届く範囲が痩せる
      reachMult:  1 - cp.reachLoss,
      elasMult:   p.priceElasticityMultiplier * R.elas,
      // §3 固定費と資金圧力
      fixedMult:  p.fixedCostMultiplier * (1 + (A.cash-10)/400) * this.loadCurve(s.week),
      // §48 競合に奪われるリピート資産
      poolDrain:  cp.drain * (0.7 + A.competitor/60),
      decayMult:  p.awarenessDecayMult,
      _diff:{ regime:R, pressure:cp, budget:bg, profile:p },
    };
  },

  // §19 §20 需要予測。難易度が上がるほどレンジが広く、EXPERTは定性表現だけになる。
  forecast(s, lastDemand){
    const p = this.profile(s);
    const base = lastDemand || 0;
    const acc = p.forecastAccuracy;
    if(acc < 0.40){
      // EXPERT：数字を出さない。ただし推測材料（レジーム予兆）は必ず残す（§20）
      const om = MarketRegime.omen(s);
      return { mode:"qualitative",
        text: om ? om.text : "市場の方向感ははっきりしない。過去データと競合の動きから読むしかない。" };
    }
    const spread = (1-acc) * 1.6;                       // EASY≒0.13 / NORMAL≒0.40 / HARD≒0.72
    return { mode:"range",
      low: Math.max(0, Math.round(base*(1-spread))),
      high: Math.round(base*(1+spread)), acc };
  },

  // 世界を1週ぶん進める（レジーム遷移 → 競合の反応）
  tick(s){
    MarketRegime.tick(s);
    Competitor.tick(s);
  },
};

/* ========================= プレイデータ（教育・分析用） =========================
   何のために records するか：「どんな判断をしたら、何が起きたか」を後から辿れるようにする。
   意思決定と結果を必ず対で持つ。片方だけでは教材にならない。

   設計方針（他人のデータを預かる以上、ここは緩めない）

   - プレイヤーは、いつでも中身を見られる／書き出せる／消せる。
*/

  classId: "",                        // 任意。研修・授業を分けたいときのラベル（個人名は入れない）

const PlayLog = {

  /* ---- 同意の状態。既定は「共有しない」 ---- */
  consent(){ try{ return localStorage.getItem(PLAYLOG_CONSENT_KEY)==="yes"; }catch(e){ return false; } },
  setConsent(yes){ try{ localStorage.setItem(PLAYLOG_CONSENT_KEY, yes?"yes":"no"); }catch(e){} },
  consentAnswered(){ try{ return localStorage.getItem(PLAYLOG_CONSENT_KEY)!=null; }catch(e){ return false; } },

  /* ---- 保存領域 ---- */
  load(){ try{ const s=localStorage.getItem(PLAYLOG_KEY); return s?JSON.parse(s):{runs:[]}; }
          catch(e){ return {runs:[]}; } },
  save(db){ try{ localStorage.setItem(PLAYLOG_KEY, JSON.stringify(db)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(PLAYLOG_KEY); }catch(e){} return "プレイ記録を削除しました"; },

  newId(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },

  /* ---- 1ラン開始 ---- */
  start(s){
    const db=this.load();
    const run={
      id:this.newId(), v:CONFIG.saveVersion, at:new Date().toISOString().slice(0,10),
      biz:s.bizId, diff:s.difficulty, startCash:s.cash, seedPool:s.repeatPool,
      weeks:[], outcome:null
    };
    db.runs.push(run);
    while(db.runs.length>this.MAX_RUNS) db.runs.shift();
    this.save(db);
    s._runId=run.id;
    return run.id;
  },

  /* ---- 1週ぶんを記録。plan=その週に決めたこと / res=その結果 ---- */
  week(s, plan, res, meta){
    const db=this.load();
    const run=db.runs.find(r=>r.id===s._runId);
    if(!run) return;
    run.weeks.push({
      w:s.week,
      // 決めたこと
      produce:plan.produce, price:plan.price, ad:plan.adBudget||0,
      acts:(plan.actions||[]).slice(), hours:plan.hoursUsed,
      staff:(s.staff||[]).length, autos:(s.autos||[]).length,
      // 起きたこと
      sales:Math.round(res.sales), profit:Math.round(res.opProfit), cash:Math.round(s.cash),
      cust:res.actual, lost:res.lost, conv:+(res.conversion*100).toFixed(1),
      aware:Math.round(s.awareness), sat:Math.round(s.satisfaction),
      brand:Math.round(s.brand), sys:Math.round(s.systemLevel),
      // 世界の状態（同じ判断でも結果が変わる理由）
      bn:res.bottleneck?res.bottleneck.code:null,
      regime:(s.regime&&s.regime.id)||null,
      macro:(s.macro&&s.macro.id)||null,
      ev:(meta&&meta.eventId)||null
    });
    this.save(db);
  },

  /* ---- 終了（クリア/破綻/売却/撤退） ---- */
  end(s, outcome){
    const db=this.load();
    const run=db.runs.find(r=>r.id===s._runId);
    if(!run) return;
    run.outcome={
      type:outcome, week:s.week,
      cash:Math.round(s.cash), loan:Math.round(s.loan||0),
      net:Math.round((s.cash||0)-(s.loan||0)),
      crises:s.crisisCount||0, staff:(s.staff||[]).length, autos:(s.autos||[]).length,
      sat:Math.round(s.satisfaction), brand:Math.round(s.brand), sys:Math.round(s.systemLevel)
    };
    this.save(db);
  },

  /* ---- プレイヤー自身が中身を見るための集計 ---- */
  stats(){
    const db=this.load(), runs=db.runs||[];
    const done=runs.filter(r=>r.outcome);
    return {
      記録数:runs.length, 完了:done.length,
      総週数:runs.reduce((a,r)=>a+r.weeks.length,0),
      難易度別:runs.reduce((a,r)=>{ a[r.diff]=(a[r.diff]||0)+1; return a; },{}),
      事業別:runs.reduce((a,r)=>{ a[r.biz]=(a[r.biz]||0)+1; return a; },{}),
      結末:done.reduce((a,r)=>{ a[r.outcome.type]=(a[r.outcome.type]||0)+1; return a; },{}),
      共有同意:this.consent()?"あり":"なし（端末内のみ）"
    };
  },

  /* ---- 書き出し。分析はここから始まる ---- */
  toJSON(){ return JSON.stringify(this.load(), null, 1); },
  toCSV(){
    const db=this.load(), head=["runId","date","biz","diff","week","produce","price","ad",
      "actions","hours","staff","autos","sales","profit","cash","customers","lost","conv",
      "awareness","satisfaction","brand","system","bottleneck","regime","macro","event",
      "outcome","outcomeWeek","netWorth"];
    const rows=[head.join(",")];
    (db.runs||[]).forEach(r=>{
      const o=r.outcome||{};
      r.weeks.forEach(w=>{
        rows.push([r.id,r.at,r.biz,r.diff,w.w,w.produce,w.price,w.ad,
          '"'+(w.acts||[]).join("|")+'"',w.hours,w.staff,w.autos,
          w.sales,w.profit,w.cash,w.cust,w.lost,w.conv,
          w.aware,w.sat,w.brand,w.sys,w.bn||"",w.regime||"",w.macro||"",w.ev||"",
          o.type||"",o.week||"",o.net||""].join(","));
      });
    });
    return rows.join("\n");
  },
  /* ---- 送信（同意がある場合だけ）----
     送るのは「完了したラン1件ぶんの、判断と結果」だけ。名前も端末情報も送らない。
     Apps Script は text/plain で受ける（プリフライトを起こさない）。 */
  submit(runId){
    if(!SHARE.configured() || !this.consent()) return false;
    const db=this.load();
    const run=db.runs.find(r=>r.id===runId);
    if(!run || !run.outcome || run.sent) return false;
    const payload={ v:1, classId:SHARE.classId||"", run:run };
    try{
      fetch(SHARE.endpoint, {
        method:"POST", mode:"no-cors", keepalive:true,
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      }).catch(()=>{});
      run.sent = new Date().toISOString();   // no-cors は結果を読めないので、送った事実だけ残す
      this.save(db);
      return true;
    }catch(e){ return false; }
  },
  /* まだ送っていない完了ランをまとめて送る（同意した直後や、次回起動時の取りこぼし回収） */
  submitPending(){
    if(!SHARE.configured() || !this.consent()) return 0;
    const db=this.load(); let n=0;
    (db.runs||[]).forEach(r=>{ if(r.outcome && !r.sent){ if(this.submit(r.id)) n++; } });
    return n;
  },

  download(kind){
    const csv = kind==="csv";
    const body = csv ? this.toCSV() : this.toJSON();
    const blob = new Blob([body], {type: csv?"text/csv;charset=utf-8":"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="junglebiz_playlog_"+new Date().toISOString().slice(0,10)+(csv?".csv":".json");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    return "書き出しました";
  },
};

/* ========================= Engine（状態・進行・セーブ） ========================= */
const Engine = {
  state:null,

  newGame(bizId, difficulty){
    const b = BUSINESSES[bizId];
    // §3 難易度は「持って始められる現金」から違う（資金圧力 v0.4）
    const D = DIFFICULTY[difficulty] || DIFFICULTY.NORMAL;
    /* §24 開店支援。W1の固定費の一部を賄える人数だけ、最初から常連がいる状態にする。
       事業ごとに単価も固定費も違うので、人数ではなく「固定費の何割を賄えるか」で揃える。 */
    // 難易度倍率は掛けない。声をかけられる知人の数は島によらず同じで、
    // 家賃が高い島ほど「同じ人数では足りない」——そこが難易度差になる。
    const w1Fixed = b.fixed * Difficulty.loadCurve(1);
    const unitMargin = Math.max(1, b.price - b.cost);
    const seedPool = Math.round(
      (w1Fixed * ECON.openingSupportRatio / unitMargin) / ECON.purchaseFrequency);
    // 初期値は設計書 §93 に準拠
    this.state = {
      bizId, week:1, cash:Math.round(CONFIG.startCash * D.startCashMultiplier),
      level:1, xp:0,
      awareness:Math.round(b.aware*ECON.openingAwareMult), quality:50, satisfaction:50, brand:5,
      reputation:50, serviceQuality:50,
      systemLevel:0, ownerDependency:100, complexity:0,
      repeatPool:seedPool, activeCustomers:seedPool, convPermanent:0,
      adFatigue:0, snsFatigue:0, ownerFatigue:0, debt:0,
      price:b.price,
      staff:[], autos:[], exp:{},
      // ---- 創業融資（§実情ベース）----
      loan:0,                      // 元金残高
      loanTotal:0,                 // 借りた総額（実績表示用）
      loanGrace:0,                 // 据置の残り週数
      loanTermLeft:0,              // 返済の残り週数
      lateCount:0,                 // 返せなかった回数
      bankTrust:ECON.bankTrustStart,
      financeChoice:null,          // 開業時に選んだ資金の作り方
      badges:[], history:[], // history: {week,sales,profit,cash,customers}
      reveal:{}, // 解放済み指標
      freeHoursLog:[], // 自由時間の記録（FREEDOMスコア用）
      lastWeek:null,   // 前週の結果（なぜ？判定用）
      seenEvents:[],
      // ---- 事業ライフサイクル v0.3（§72-75）----
      saveVersion: CONFIG.saveVersion,
      era: "STARTUP",              // §2 STARTUP / SURVIVAL_SCALE / OWNER_INVESTOR
      eraDone: {},                 // 通過した ERA レポート（二重表示の防止）
      bizStatus: "ACTIVE",         // §74 ACTIVE/DOWNSIZING/PIVOTING/FOR_SALE/SOLD/CLOSED
      founded: 1,                  // 創業週（§57 事業の履歴に使う）
      macro: null,                 // 進行中のマクロ事象（§7）
      pivot: null,                 // §17 売り方の転換
      portfolio: [],               // §37 人に任せている事業
      _peakStaff: 0,
      macroSchedule: null,         // 予定されているマクロ事象（§43 予兆）
      macroSeen: [],               // 経験したマクロ事象
      fixedMult: 1,                // §12 縮小で固定費が下がる
      capPenalty: 0,               // §13 人を減らすと供給力が落ちる
      recoveryPenalty: 0,          // §14 リストラは回復を遅らせる
      severancePaid: 0,            // 支払った退職金の累計
      // §36 オーナー資産（事業とは別に、人に残るもの）
      owner: { xp:0, level:1, network:0, investorRep:0, knowledge:[], achievements:[], businessesRun:1 },
      bizHistory: [],              // §57-58 過去に営んだ事業の記録
      // ---- 難易度 v0.4（§4 難易度は「世界の違い」）----
      difficulty: D.id,
      crisisCount: 0,                     // §54 資金危機に陥った回数
      regime: { id:"NORMAL", weeks:0 },   // §21 市場レジーム
      competitors: Competitor.init(),     // §11 反復ゲームの相手
      competitorNotes: [],
      diffLog: [],                        // 週ごとの世界の状態（振り返り・レポート用）
    };
    WEEK_UNLOCKS[1].reveal.forEach(r=> this.state.reveal[r]=true);   // 週1で見せるのは4つだけ
    this.save();
    return this.state;
  },

  save(){ try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.state)); }catch(e){} },
  load(){ try{ const s=localStorage.getItem(CONFIG.saveKey); if(s){ this.state=this.migrate(JSON.parse(s)); return true; } }catch(e){} return false; },

  /* §76 旧セーブを壊さない。欠けているフィールドだけ補う（値は上書きしない）。
     v2（24週で終わるゲーム）で保存された途中データも、そのまま続きから遊べる。 */
  migrate(st){
    if(!st || typeof st!=="object") return st;
    const def = (k,v)=>{ if(st[k]===undefined || st[k]===null) st[k]=v; };
    def("saveVersion", 2);
    def("era", (st.week||1) <= CONFIG.startupWeeks ? "STARTUP"
             : (st.week||1) <= CONFIG.survivalWeeks ? "SURVIVAL_SCALE" : "OWNER_INVESTOR");
    def("eraDone", {});
    def("bizStatus", "ACTIVE");
    def("founded", 1);
    def("macro", null);
    def("pivot", null);
    def("portfolio", []);
    def("_peakStaff", (st.staff||[]).length);
    def("macroSchedule", null);
    def("macroSeen", []);
    def("fixedMult", 1);
    def("capPenalty", 0);
    def("recoveryPenalty", 0);
    def("severancePaid", 0);
    def("bizHistory", []);
    // ---- v4 難易度システム（旧セーブは NORMAL 相当として続きから遊べる）----
    def("difficulty", "NORMAL");
    def("snsFatigue", 0);
    def("crisisCount", 0);
    // ---- v5 創業融資（旧セーブは「据置なし・返済なしの借入」として扱う）----
    def("loanTotal", st.loan||0);
    def("loanGrace", 0);
    def("loanTermLeft", (st.loan||0)>0 ? ECON.loanTermWeeks : 0);
    def("lateCount", 0);
    def("bankTrust", ECON.bankTrustStart);
    def("financeChoice", null);
    def("regime", { id:"NORMAL", weeks:0 });
    def("competitorNotes", []);
    def("diffLog", []);
    if(!Array.isArray(st.competitors) || !st.competitors.length) st.competitors = Competitor.init();
    if(!st.owner) st.owner = { xp:st.xp||0, level:st.level||1, network:0, investorRep:0,
                               knowledge:[], achievements:[], businessesRun:1 };
    st.saveVersion = CONFIG.saveVersion;
    return st;
  },
  clear(){ try{ localStorage.removeItem(CONFIG.saveKey); }catch(e){} this.state=null; },
  hasSave(){ try{ return !!localStorage.getItem(CONFIG.saveKey); }catch(e){ return false; } },

  addXp(n){ this.state.xp += n; },

  // レベルの必要XP（表示用）
  xpForLevel(lv){ return lv*100; },

  currentArea(){
    let a = AREAS[0];
    AREAS.forEach(x=>{ if(this.state.week>=x.w) a=x; });
    return a;
  },

  isRevealed(key){ return !!this.state.reveal[key]; },
};

   §1 24週は「終わり」ではなく STARTUP ERA の終わり。事業には
   誕生→成長→成熟→危機→転換→撤退がある（§86）。
   設計方針：Economy.computeWeek（純粋関数）には手を入れず、
   ctx と state の追加フィールドだけで市場ショックを表現する。
   ==================================================================== */

/* ---- ERA（§2）。今は週数で決めるが、判定を1関数に集約しておき
        将来 state（資産・事業数）でも移行できるようにする ---- */
const ERAS = {
  STARTUP:        { id:"STARTUP",        emoji:"🌱", name:"STARTUP ERA",      sub:"商売を立ち上げる" },
  SURVIVAL_SCALE: { id:"SURVIVAL_SCALE", emoji:"🌊", name:"SURVIVAL & SCALE", sub:"市場は動く。耐えるか、変えるか" },
  OWNER_INVESTOR: { id:"OWNER_INVESTOR", emoji:"👑", name:"OWNER / INVESTOR", sub:"どこに資本を配るか" },
};
function eraOf(s){
  const w = (s && s.week) || 1;
  if(w <= CONFIG.startupWeeks)  return "STARTUP";
  if(w <= CONFIG.survivalWeeks) return "SURVIVAL_SCALE";
  return "OWNER_INVESTOR";
}
