      if(reg==="RECESSION"||reg==="SLOWDOWN"){ price*=0.93; ad=0; produce=2; }
      else if(reg==="BOOM"||reg==="GROWTH"){ price*=1.06; produce=3; }

      // 詰まりへの対応（§76 いま一番の問題を潰す）
      if(bn==="CAPACITY") produce=Math.min(4, produce+1);
      if(bn==="TRAFFIC"  && w>=9 && cp.adPressure<1.0) ad=22000;
      if(bn==="CONVERSION"){ acts.push("improve"); price*=0.97; }
      if(bn==="MARGIN"){ price*=1.06; ad=0; }
      if(bn==="CASH"){ produce=Math.max(1,produce-1); ad=0; price*=1.03; }
      if(bn==="TIME" && w>=20) acts.push("manual");

      // 競合への対応（§7 §8 値下げ合戦には乗らず、ブランドで耐える）
      if(cp.priceLevel<0.92){ acts.push("improve"); price=Math.max(price, B.price*1.0); }
      if(cp.adPressure>1.1) ad=0;                       // 入札が過熱したら降りる
      /* §14 §49 読まれ始めたら手を変える。EXPERTで生き残るために必要なのはこれ。
         同じ打ち手を続けないこと自体が、適応する市場に対する戦略になる。 */
      if((cp.predictability||0) > 0.35){
        const rot = w % 3;
        if(rot===0){ price = Math.round(price*1.05); if(!acts.includes("improve")) acts.push("improve"); }
        else if(rot===1){ produce = Math.max(1, Math.min(4, produce + (produce>=3 ? -1 : 1))); }
        else { price = Math.round(price*0.96); if(w>=3 && !acts.includes("sales")) acts.push("sales"); }
      }
      // §8 ブランドが立っていないのに相場より高く売らない
      if(s.brand < ECON.priceTrustBrand && price > B.price*cp.priceLevel*1.12)
        price = B.price*cp.priceLevel*1.10;

      if(w>=2 && acts.length<2) acts.push("sns");
      if(w>=13 && acts.length<2 && !acts.includes("improve")) acts.push("service");
      if(w>=20 && !acts.includes("manual")) acts.push("manual");

      // 供給が余っているのに作りすぎない（§25 廃棄）
      if(last && last.capacity > last.demandCustomers*1.6) produce=Math.max(1,produce-1);

      return { produce, price:Math.round(price), adBudget:ad, actions:acts,
               hire: (w>=17 && bn==="CAPACITY" && s.cash>150000) ? ["ele"] : null,
               buy:  (w>=21 && s.cash>200000) ? ["pos"] : null }; } },
};

const Sim = {
  PERSONAS,

  // 1ラン（1事業 × 1ペルソナ × 1難易度 × 1シード）を24週まわす
  // opt: {weeks, capture:[週番号...]}  capture した週は state のスナップショットを返す（Regret用）
  runOne(bizId, personaKey, difficulty, seed, opt){
    opt = (typeof opt==="number") ? {weeks:opt} : (opt||{});
    setSeed(seed);
    Engine.newGame(bizId, difficulty);
    const s=Engine.state, P=PERSONAS[personaKey], p=Difficulty.profile(s);
    /* 開業資金の作り方。実情では 2/3 が借入なので、AIも既定で借りて始める。
       返済も現金から引かれるので、ここを省くと難易度が実態より甘く出る。 */
    const plan0 = (P.finance!=null) ? P.finance : "full";
    const fp = FINANCE_PLANS.find(x=>x.id===plan0) || FINANCE_PLANS[2];
    if(fp.mult>0) Finance.borrow(s, Math.round(s.cash*fp.mult/1000)*1000);
    s.financeChoice = fp.id;
    const B=BUSINESSES[bizId], W=opt.weeks||CONFIG.totalWeeks;
    const capture=opt.capture||null, states={};
    const startCash=s.cash;
    let cumProfit=0, cumSales=0, adSpend=0, lostTotal=0, negWeeks=0, turnover=0, restructured=0, lateWeeks=0;
    let peakCash=startCash, maxDD=0, minCash=startCash, minRunway=999, freeSum=0;
    let bankrupt=false, survived=W, last=null;
    const log=[], actUse={};

    for(let w=1; w<=W; w++){
      s.week=w;
      if(capture && capture.indexOf(w)>=0) states[w]=JSON.parse(JSON.stringify(s));
      Difficulty.tick(s);                                    // 世界が先に動く
      const ctx=Difficulty.ctx(s);
      const weeklyFixed=Math.round((B.fixed+Economy.autoEffect(s).fixed)*ctx.fixedMult)
                        + Economy.staffEffect(s).salary;
      const info={ week:w, last, bottleneck:last?last.bottleneck:null, regime:s.regime,
        forecast:Difficulty.forecast(s, last?last.demandCustomers:null),
        runway: weeklyFixed>0 ? s.cash/weeklyFixed : 99 };

      const d=P.play(s,w,info)||{};
      // 採用（W17解放）— 給与2週ぶんの現金がなければ雇えない
      if(d.hire && w>=17) d.hire.forEach(id=>{ const st=STAFF.find(x=>x.id===id);
        const has=(s.staff||[]).some(e=>(typeof e==="string"?e:e.id)===id);
        if(st && !has && s.cash>st.salary*2) s.staff.push({id, weeks:1, motivation:85}); });
      // 自動化（W21解放）
      if(d.buy && w>=21) d.buy.forEach(id=>{ const a=AUTOMATIONS.find(x=>x.id===id);
        if(a && !s.autos.includes(id) && s.cash>a.cost*1.05){
          s.cash-=a.cost; s.autos.push(id);
          s.systemLevel=Economy.clamp(s.systemLevel+a.sys,0,100); } });

      // 解放週を守る＋40時間に収める（本番と同じ制約）
      const acts=(d.actions||[]).filter(a=>ACTIONS[a] && w>=ACTIONS[a].unlockWeek)
                                .filter((a,i,ar)=>ar.indexOf(a)===i);
      const plan={ produce:Math.max(0,Math.min(4,d.produce||1)),
        price:Economy.clamp(Math.round(d.price||B.price), B.minP, B.maxP),
        adBudget:Math.max(0, Math.min(d.adBudget||0, Math.max(0,s.cash))),
        actions:acts.slice(), hoursUsed:0 };
      const hrs=()=> plan.produce*ACTIONS.operate.hours
                     + plan.actions.reduce((a,id)=>a+ACTIONS[id].hours,0);
      plan.hoursUsed=hrs();
      while(plan.hoursUsed>CONFIG.baseHours && plan.actions.length){ plan.actions.pop(); plan.hoursUsed=hrs(); }
      plan.actions.forEach(a=>actUse[a]=(actUse[a]||0)+1);
      if(plan.adBudget>0) actUse.ad=(actUse.ad||0)+1;

      const r=Economy.computeWeek(s, plan, ctx);
      Competitor.remember(s, r, plan);                       // §47 相手はこちらを記憶する

      s.cash+=r.cashDelta; Object.assign(s, r.next); s.price=plan.price;
      // 借入の返済（元金は利益に出ないが現金から出ていく）
      const rp=Finance.tick(s);
      if(rp.principal>0) s.cash-=rp.principal;
      if(rp.late) lateWeeks++;
      s.staff=(s.staff||[]).map(e=> typeof e==="string"?{id:e,weeks:9,motivation:85}
                                    :Object.assign({},e,{weeks:(e.weeks||1)+1}));
      // §9 離職：難易度と現場の複雑さで辞めやすくなる
      if(s.staff.length && rnd() < 0.010*p.staffTurnoverMultiplier*(1+(s.complexity||0)/120)){
        s.staff.pop(); turnover++;
      }
      /* §54 §55 資金が尽きたときの階段は本番（openCrisis）と同じ順序で降りる。
         ①枠の残りまで借りる ②設備を売る ③人を減らす ④どれも尽きたら破綻。
         ここを本番と揃えておかないと、シミュレーションだけ延命できてしまう。 */
      if(s.cash<0){
        const creditLimit=Math.round(Math.max(3000, weeklyFixed)*10*p.creditAvailability);
        const borrow=Math.min(-s.cash, Math.max(0, creditLimit-(s.loan||0)));
        if(borrow>0){ s.loan=(s.loan||0)+borrow; s.cash+=borrow; }
        if(s.cash<0 && (s.autos||[]).length){          // 設備を処分して現金化（買値では売れない）
          s.cash+=(s.autos||[]).reduce((a,id)=>{ const x=AUTOMATIONS.find(y=>y.id===id);
            return a+(x?Math.round(x.cost*0.44):0); },0);
          s.autos=[]; restructured++;
        }
        if(s.cash<0 && (s.staff||[]).length){          // 人を減らす（退職金がいま出ていく）
          s.cash-=s.staff.length*CONFIG.severancePerStaff;
          s.staff=[]; s.capPenalty=Math.min(0.5,(s.capPenalty||0)+0.15); restructured++;
        }
        if(s.cash<0){ bankrupt=true; survived=w; break; }
      }
      cumProfit+=r.opProfit; cumSales+=r.sales; adSpend+=r.adCost; lostTotal+=r.lost;
      freeSum+=r.freeHours; if(r.opProfit<0) negWeeks++;
      const net=s.cash-(s.loan||0);
      if(net>peakCash) peakCash=net;
      if(peakCash>0) maxDD=Math.max(maxDD,(peakCash-net)/peakCash);
      minCash=Math.min(minCash, net);
      minRunway=Math.min(minRunway, weeklyFixed>0 ? net/weeklyFixed : 99);
      s.history.push({week:w,sales:r.sales,profit:r.opProfit,cash:s.cash,
                      customers:r.actual,conv:r.conversion,price:r.price});
      log.push({ w, regime:s.regime.id, price:plan.price, ad:plan.adBudget,
        produce:plan.produce, acts:plan.actions.slice(),
        sales:r.sales, profit:Math.round(r.opProfit), net:Math.round(net),
        cust:r.actual, lost:r.lost, bn:r.bottleneck.code,
        cpc:+(ctx.cpcMult||1).toFixed(2), refP:+(ctx.marketPriceMult||1).toFixed(3) });
      last=r;
    }
    setSeed(null);
    const net=s.cash-(s.loan||0);
    /* CLEAR の定義（§28）— 「現金を減らさなかった」では事業が成立したとは言えない。
       ①破綻せず完走 ②投下資本を1.5倍にした ③終盤4週が黒字＝続けられる状態にある
       の3つを満たしたときだけクリアとする。現金を抱えて縮こまる戦略はここで落ちる。 */
    const tail=log.slice(-4);
    const tailProfit=tail.length ? tail.reduce((a,x)=>a+x.profit,0)/tail.length : -1;
    const clear = !bankrupt && net>=startCash*1.5 && tailProfit>0;
    // ゾンビ経営：破綻はしていないが、借入で穴を埋めながら純資産がマイナスのまま完走した状態
    const zombie = !bankrupt && net<0;
    return { persona:personaKey, tag:P.tag, biz:bizId, difficulty:s.difficulty, seed,
      clear, bankrupt, zombie, survived, startCash,
      endCash:Math.round(s.cash), loan:Math.round(s.loan||0), netWorth:Math.round(net),
      tailProfit:Math.round(tailProfit),
      cumProfit:Math.round(cumProfit), cumSales:Math.round(cumSales),
      negWeeks, maxDD:+maxDD.toFixed(3), minCash:Math.round(minCash),
      minRunway:+minRunway.toFixed(1), adSpend, lostTotal, turnover,
      lateWeeks, bankTrust:Math.round(Finance.trust(s)), loanTotal:s.loanTotal||0,
      financeChoice:s.financeChoice,
      avgFree:+(freeSum/Math.max(1,log.length)).toFixed(1),
      staff:s.staff.length, autos:s.autos.length,
      sat:Math.round(s.satisfaction), brand:Math.round(s.brand),
      system:Math.round(s.systemLevel), actUse, log, states };
  },

  // §34 §35 同一シードで難易度を比較するモンテカルロ
  monteCarlo(opt){
    opt=opt||{};
    const biz=opt.biz||Object.keys(BUSINESSES);
    const personas=opt.personas||Object.keys(PERSONAS);
    const diffs=opt.difficulties||DIFF_ORDER;
    const n=opt.seeds||100;
    const seeds=[]; for(let i=0;i<n;i++) seeds.push(10007+i*7919);   // 全難易度で同一
    const runs=[];
    diffs.forEach(D=> personas.forEach(P=> biz.forEach(B=> seeds.forEach(sd=>{
      const r=this.runOne(B,P,D,sd); delete r.log; delete r.states; runs.push(r);
    }))));
    return { runs, seeds:seeds.length, total:runs.length,
             config:{biz, personas, difficulties:diffs} };
  },
};

/* ========================= 難易度メトリクス（§15〜§17 §38 §43〜§45） =========================
   プレイヤーには見せない。バランス調整・難易度評価のために使う数字（§16）。 */
const Metrics = {
  clone(s){ return JSON.parse(JSON.stringify(s)); },

  // §44 同じ状態から比べる代表的な打ち手
  CANDIDATES: {
    hold:   { label:"何もしない",   mk:(s,B)=>({produce:2, price:s.price, adBudget:0, actions:[]}) },
    ad:     { label:"広告を打つ",   mk:(s,B)=>({produce:2, price:s.price, adBudget:30000, actions:[]}) },
    raise:  { label:"値上げする",   mk:(s,B)=>({produce:2, price:Math.round(s.price*1.15), adBudget:0, actions:[]}) },
    cut:    { label:"値下げする",   mk:(s,B)=>({produce:2, price:Math.round(s.price*0.85), adBudget:0, actions:[]}) },
    improve:{ label:"商品を改善",   mk:(s,B)=>({produce:2, price:s.price, adBudget:0, actions:["improve"]}) },
    service:{ label:"接客を磨く",   mk:(s,B)=>({produce:2, price:s.price, adBudget:0, actions:["service"]}) },
    expand: { label:"供給を増やす", mk:(s,B)=>({produce:4, price:s.price, adBudget:0, actions:[]}) },
    hire:   { label:"人を雇う",     mk:(s,B)=>({produce:2, price:s.price, adBudget:0, actions:[]}), hire:"ele" },
  },

  // 1つの打ち手を horizon 週ぶん、trials 回ロールアウトして平均利益を返す（§44）
  rollout(state, mkPlan, horizon, trials, hireId){
    let sum=0;
    for(let t=0;t<trials;t++){
      const s=this.clone(state);
      setSeed(90001 + t*131);
      if(hireId && s.week>=17){ const st=STAFF.find(x=>x.id===hireId);
        const has=(s.staff||[]).some(e=>(typeof e==="string"?e:e.id)===hireId);
        if(st && !has && s.cash>st.salary*2) s.staff.push({id:hireId, weeks:1, motivation:85}); }
      let profit=0;
      for(let h=0; h<horizon; h++){
        Difficulty.tick(s);
        const ctx=Difficulty.ctx(s), B=BUSINESSES[s.bizId];
        const p=mkPlan(s,B,h)||{};
        p.actions=(p.actions||[]).filter(a=>ACTIONS[a] && s.week>=ACTIONS[a].unlockWeek);
        p.produce=Math.max(0,Math.min(4,p.produce||1));
        p.price=Economy.clamp(Math.round(p.price||B.price), B.minP, B.maxP);
        p.adBudget=Math.max(0, Math.min(p.adBudget||0, Math.max(0,s.cash)));
        p.hoursUsed=p.produce*10 + p.actions.reduce((a,id)=>a+ACTIONS[id].hours,0);
        while(p.hoursUsed>CONFIG.baseHours && p.actions.length){
          p.actions.pop(); p.hoursUsed=p.produce*10+p.actions.reduce((a,id)=>a+ACTIONS[id].hours,0); }
        const r=Economy.computeWeek(s,p,ctx);
        Competitor.remember(s,r,p);
        s.cash+=r.cashDelta; Object.assign(s,r.next); s.price=p.price;
        { const rp=Finance.tick(s); if(rp.principal>0) s.cash-=rp.principal; }   // 返済も本番と同じ
        s.week++;
        s.staff=(s.staff||[]).map(e=> typeof e==="string"?{id:e,weeks:9,motivation:85}
                                      :Object.assign({},e,{weeks:(e.weeks||1)+1}));
        profit+=r.opProfit;
      }
      sum+=profit;
    }
    setSeed(null);
    return Math.round(sum/trials);
  },

  // §44 §45 各行動の期待値 → §17 Decision Sharpness（1位と2位の差）
  actionValue(state, horizon, trials){
    const H=horizon||4, T=trials||10;
    const evs=Object.keys(this.CANDIDATES).map(k=>{
      const C=this.CANDIDATES[k];
      return { key:k, label:C.label, ev:this.rollout(state, C.mk, H, T, C.hire) };
    });
    evs.sort((a,b)=>b.ev-a.ev);
    return { best:evs[0], second:evs[1],
             sharpness: evs.length>1 ? evs[0].ev-evs[1].ev : 0, all:evs };
  },

  /* §15 §16 REGRET：その週に取った行動の結果 vs その状態で最善だった行動の期待結果。
     プレイヤーには見せず、難易度評価にだけ使う。 */
  regret(bizId, personaKey, difficulty, seed, sampleWeeks){
    const sample=sampleWeeks||[6,10,14,18,22];
    const run=Sim.runOne(bizId, personaKey, difficulty, seed, {capture:sample});
    const P=PERSONAS[personaKey];
    const rows=sample.map(w=>{
      const st=run.states[w]; if(!st) return null;
      const av=this.actionValue(st, 4, 8);
      // そのペルソナ自身の打ち手を同じ条件でロールアウトする
      const ownEV=this.rollout(st, (s,B,h)=>P.play(s, s.week, {
        week:s.week, last:null, bottleneck:null, regime:s.regime,
        forecast:Difficulty.forecast(s,null), runway:9 }), 4, 8);
      return { week:w, 最善:av.best.label, 最善EV:av.best.ev, 実際EV:ownEV,
               regret:Math.max(0, av.best.ev-ownEV), 判断の際どさ:av.sharpness };
    }).filter(Boolean);
    const avg=rows.length? Math.round(rows.reduce((a,x)=>a+x.regret,0)/rows.length) : 0;
    const sharp=rows.length? Math.round(rows.reduce((a,x)=>a+x.判断の際どさ,0)/rows.length) : 0;
    return { persona:personaKey, difficulty, 平均Regret:avg, 平均Sharpness:sharp, rows };
  },

  // §37 §38 成功したランの戦略分布とエントロピー（1つの戦略が過半を占めないこと）
  strategyEntropy(runs){
    const win=runs.filter(r=>r.clear);
    if(!win.length) return { entropy:0, normalized:0, dist:{}, top:null, topShare:0, n:0 };
    const cnt={};
    win.forEach(r=>{ cnt[r.tag]=(cnt[r.tag]||0)+1; });
    const keys=Object.keys(cnt), n=win.length;
    let H=0; keys.forEach(k=>{ const p=cnt[k]/n; H -= p*Math.log2(p); });
    const maxH=Math.log2(Math.max(2, Object.keys(PERSONAS).length));
    const dist={}; keys.sort((a,b)=>cnt[b]-cnt[a])
      .forEach(k=> dist[k]=Math.round(cnt[k]/n*100)+"%");
    const top=keys[0];
    return { entropy:+H.toFixed(2), normalized:+(H/maxH).toFixed(2),
             dist, top, topShare:Math.round(cnt[top]/n*100), n };
  },

  /* §43 支配戦略の検出。ある行動が「勝ちラン中で何%使われたか」だけでは足りない。
     その行動なしの勝率が極端に低いとき、構造上その手が必須になっている。 */
  dominantStrategy(runs){
    const keys=["ad","improve","service","sns","manual","sales","research"];
    const win=runs.filter(r=>r.clear);
    const out=keys.map(k=>{
      const usedWin=win.filter(r=>(r.actUse||{})[k]>0).length;
      const withRuns=runs.filter(r=>(r.actUse||{})[k]>0);
      const withoutRuns=runs.filter(r=>!((r.actUse||{})[k]>0));
      const wr=a=>a.length? Math.round(a.filter(r=>r.clear).length/a.length*100) : null;
      return { 行動:k,
        勝ちラン中の使用率: win.length? Math.round(usedWin/win.length*100)+"%" : "—",
        使った時の勝率: wr(withRuns)===null?"—":wr(withRuns)+"%",
        使わない時の勝率: wr(withoutRuns)===null?"—":wr(withoutRuns)+"%",
        _with:wr(withRuns), _without:wr(withoutRuns) };
    });
    // 「使わないと勝率が著しく落ちる」ものを必須手として拾う
    const forced=out.filter(o=> o._with!=null && o._without!=null
                                && o._without < 8 && o._with-o._without >= 25);
    return { rows:out, forced:forced.map(o=>o.行動) };
  },

  // §30 §32 スキルギャップ（分析型 vs でたらめ）
  skillGap(runs){
    const pc=a=> a.length? Math.round(a.filter(r=>r.clear).length/a.length*100) : 0;
    const out={};
    DIFF_ORDER.forEach(D=>{
      const rows=runs.filter(r=>r.difficulty===D);
      const rd=pc(rows.filter(r=>r.persona==="random"));
      const an=pc(rows.filter(r=>r.persona==="analytical"));
      out[D]={ でたらめ:rd, 分析型:an, 差:an-rd };
    });
    return out;
  },

  // §28 難易度ごとの全指標
  summary(runs){
    const med=a=>{ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const out={};
    DIFF_ORDER.forEach(D=>{
      const rows=runs.filter(r=>r.difficulty===D);
      if(!rows.length) return;
      const win=rows.filter(r=>r.clear);
      const ent=this.strategyEntropy(rows);
      out[D]={
        n:rows.length,
        clearRate:Math.round(win.length/rows.length*100),
        bankruptcyRate:Math.round(rows.filter(r=>r.bankrupt).length/rows.length*100),
        medProfit:med(rows.map(r=>r.cumProfit)),
        medCash:med(rows.map(r=>r.endCash)),
        medNetWorth:med(rows.map(r=>r.netWorth)),
        negWeeks:med(rows.map(r=>r.negWeeks)),
        maxDrawdown:Math.round(med(rows.map(r=>r.maxDD))*100),
        minRunway:med(rows.map(r=>r.minRunway)),
        turnover:med(rows.map(r=>r.turnover)),
        entropy:ent.normalized, topStrategy:ent.top, topShare:ent.topShare,
        dist:ent.dist,
      };
    });
    return out;
  },
};

/* ========================= バランスレポート自動生成（§39〜§42） ========================= */
const BalanceReport = {
  // §42 自動で問題を検出する
  alerts(sum, runs, gap, dom, ent){
    const A=[];
    const c=D=> sum[D] ? sum[D].clearRate : null;
    // 難易度が分離しているか
    for(let i=0;i<DIFF_ORDER.length-1;i++){
      const a=DIFF_ORDER[i], b=DIFF_ORDER[i+1];
      if(c(a)!=null && c(b)!=null && Math.abs(c(a)-c(b))<8)
        A.push(`⚠ ${a} と ${b} のクリア率の差が ${Math.abs(c(a)-c(b))}pt しかない。難易度が分離していない。`);
    }
    // 目標帯の逸脱
    DIFF_ORDER.forEach(D=>{
      if(!sum[D]) return;
      const t=DIFFICULTY[D].clearTarget, v=sum[D].clearRate;
      if(v<t[0]) A.push(`⚠ ${D} のクリア率 ${v}% が目標下限 ${t[0]}% を下回る。理不尽になっていないか確認。`);
      if(v>t[1]) A.push(`⚠ ${D} のクリア率 ${v}% が目標上限 ${t[1]}% を超えている。圧力が足りない。`);
    });
    // ドローダウンが難易度順に増えているか
    for(let i=0;i<DIFF_ORDER.length-1;i++){
      const a=sum[DIFF_ORDER[i]], b=sum[DIFF_ORDER[i+1]];
      if(a&&b&&b.maxDrawdown<=a.maxDrawdown)
        A.push(`⚠ ${DIFF_ORDER[i+1]} の最大ドローダウンが ${DIFF_ORDER[i]} を上回っていない。資金圧力の順序が壊れている。`);
    }
    // スキルギャップ
    DIFF_ORDER.forEach(D=>{
      if(!gap[D]) return;
      if(gap[D].差 < 10)
        A.push(`⚠ ${D} で でたらめBot(${gap[D].でたらめ}%) と 分析型Bot(${gap[D].分析型}%) の差が ${gap[D].差}pt。スキルが結果に反映されていない。`);
    });
    if(gap.EXPERT && gap.EXPERT.分析型 < 15)
      A.push(`⚠ EXPERT で分析型Botが ${gap.EXPERT.分析型}% しか勝てない。運ゲーになっている可能性がある（§20）。`);
    // 支配戦略
    if(dom.forced.length)
      A.push(`⚠ ${dom.forced.join(" / ")} を使わないと勝率がほぼゼロ。構造上その手が必須になりすぎている。`);
    DIFF_ORDER.forEach(D=>{
      if(sum[D] && sum[D].topShare>=50)
        A.push(`⚠ ${D} の勝ちランの ${sum[D].topShare}% が「${sum[D].topStrategy}」に偏っている。支配戦略の疑い。`);
    });
    if(!A.length) A.push("✅ 自動検出された問題はありません。");
    return A;
  },

  build(opt){
    opt=opt||{};
    const mc=Sim.monteCarlo(opt);
    const runs=mc.runs;
    const sum=Metrics.summary(runs);
    const gap=Metrics.skillGap(runs);
    const dom=Metrics.dominantStrategy(runs);
    const ent=Metrics.strategyEntropy(runs);
    const yen=v=>"¥"+Math.round(v).toLocaleString("ja-JP");
    const L=[];
    const now=new Date();
    const stamp=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

    L.push("# DIFFICULTY BALANCE REPORT");
    L.push("");
    L.push(`- 生成: ${stamp}（\`JB.balanceReport({save:true})\` で自動生成）`);
    L.push(`- 規模: ${mc.config.personas.length}ペルソナ × ${mc.config.difficulties.length}難易度 × ${mc.config.biz.length}事業 × ${mc.seeds}シード = **${runs.length}ラン**`);
    L.push(`- 難易度間は**同一シード**で比較（運ではなく難易度の差を測るため §35）`);
    L.push(`- CLEAR の定義: 破綻せず24週完走 かつ 純資産が開始現金の1.5倍以上 かつ 終盤4週が黒字`);
    L.push("");

    // §41 難易度比較表
    L.push("## 難易度比較");
    L.push("");
    L.push("| | "+DIFF_ORDER.join(" | ")+" |");
    L.push("|---|"+DIFF_ORDER.map(()=>"---").join("|")+"|");
    const row=(label,fn)=> L.push("| "+label+" | "+DIFF_ORDER.map(D=> sum[D]?fn(sum[D]):"—").join(" | ")+" |");
    row("コンセプト", ()=>"");
    L[L.length-1]="| コンセプト | "+DIFF_ORDER.map(D=>DIFFICULTY[D].name).join(" | ")+" |";
    row("クリア率", s=>s.clearRate+"%");
    L.push("| 目標帯 | "+DIFF_ORDER.map(D=>DIFFICULTY[D].clearTarget.join("〜")+"%").join(" | ")+" |");
    L.push("| 判定 | "+DIFF_ORDER.map(D=>{ if(!sum[D])return"—";
      const t=DIFFICULTY[D].clearTarget,v=sum[D].clearRate;
      return (v>=t[0]&&v<=t[1])?"✅":"❌"; }).join(" | ")+" |");
    row("破綻率", s=>s.bankruptcyRate+"%");
    row("赤字週（中央値）", s=>s.negWeeks);
    row("最大ドローダウン", s=>s.maxDrawdown+"%");
    row("最小ランウェイ（週）", s=>s.minRunway);
    row("中央値 累計利益", s=>yen(s.medProfit));
    row("中央値 最終現金", s=>yen(s.medCash));
    row("中央値 純資産", s=>yen(s.medNetWorth));
    row("離職（中央値）", s=>s.turnover);
    row("戦略エントロピー", s=>s.entropy);
    row("最多戦略", s=>s.topStrategy+" "+s.topShare+"%");
    L.push("");

    // §30 §32 スキルギャップ
    L.push("## スキルギャップ（§30 §32）");
    L.push("");
    L.push("分析が上手いプレイヤーほど成績が良くなっているか。高難易度ほど差が開く必要がある。");
    L.push("");
    L.push("| 難易度 | でたらめBot | 分析型Bot | 差 |");
    L.push("|---|---|---|---|");
    DIFF_ORDER.forEach(D=> gap[D] && L.push(`| ${D} | ${gap[D].でたらめ}% | ${gap[D].分析型}% | **${gap[D].差}pt** |`));
    L.push("");

    // §37 §38 戦略の多様性
    L.push("## 戦略の多様性（§37 §38）");
    L.push("");
    L.push(`- 正規化エントロピー: **${ent.normalized}**（1.0に近いほど複数戦略が成立している）`);
    L.push(`- 最多戦略: **${ent.top}** が勝ちランの **${ent.topShare}%**（過半なら支配戦略の疑い）`);
    L.push("");
    L.push("難易度別の勝ちラン内訳:");
    L.push("");
    DIFF_ORDER.forEach(D=>{
      if(!sum[D]) return;
      const d=sum[D].dist, ks=Object.keys(d).slice(0,6);
      L.push(`- **${D}**: `+ (ks.length? ks.map(k=>`${k} ${d[k]}`).join(" / ") : "勝ちラン無し"));
    });
    L.push("");

    // §43 支配戦略検出
    L.push("## 支配戦略の検出（§43）");
    L.push("");
    L.push("| 行動 | 勝ちラン中の使用率 | 使った時の勝率 | 使わない時の勝率 |");
    L.push("|---|---|---|---|");
    dom.rows.forEach(r=> L.push(`| ${r.行動} | ${r.勝ちラン中の使用率} | ${r.使った時の勝率} | ${r.使わない時の勝率} |`));
    L.push("");
    L.push(dom.forced.length
      ? `**必須化している手**: ${dom.forced.join(" / ")}`
      : "**必須化している手はありません。** どの行動も「使わなくても勝てる」余地が残っている。");
    L.push("");

    // ペルソナ別
    L.push("## ペルソナ別クリア率");
    L.push("");
    L.push("| 戦略 | "+DIFF_ORDER.join(" | ")+" | 中央値 純資産 |");
    L.push("|---|"+DIFF_ORDER.map(()=>"---").join("|")+"|---|");
    const med=a=>{ if(!a.length)return 0; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    Object.keys(PERSONAS).forEach(p=>{
      const cells=DIFF_ORDER.map(D=>{
        const rs=runs.filter(r=>r.persona===p&&r.difficulty===D);
        return rs.length? Math.round(rs.filter(r=>r.clear).length/rs.length*100)+"%" : "—";
      });
      const all=runs.filter(r=>r.persona===p);
      L.push(`| ${PERSONAS[p].emoji} ${PERSONAS[p].tag} | ${cells.join(" | ")} | ${yen(med(all.map(r=>r.netWorth)))} |`);
    });
    L.push("");

    // 事業別
    L.push("## 事業別クリア率");
    L.push("");
    L.push("| 事業 | 表示難易度 | "+DIFF_ORDER.join(" | ")+" |");
    L.push("|---|---|"+DIFF_ORDER.map(()=>"---").join("|")+"|");
    mc.config.biz.forEach(b=>{
      const cells=DIFF_ORDER.map(D=>{
        const rs=runs.filter(r=>r.biz===b&&r.difficulty===D);
        return rs.length? Math.round(rs.filter(r=>r.clear).length/rs.length*100)+"%" : "—";
      });
      L.push(`| ${BUSINESSES[b].emoji} ${BUSINESSES[b].name} | ${BUSINESSES[b].difficulty} | ${cells.join(" | ")} |`);
    });
    L.push("");

    // §42 ALERT
    L.push("## ALERT（§42 自動検出）");
    L.push("");
    this.alerts(sum, runs, gap, dom, ent).forEach(a=> L.push("- "+a));
    L.push("");

    // 難易度ベクトル
    L.push("## 難易度ベクトル（§3 §4）");
    L.push("");
    L.push("難易度は単一倍率ではなく6軸で定義される。数字は0〜100。");
    L.push("");
    const axes=Object.keys(DIFF_AXIS_LABEL);
    L.push("| 軸 | "+DIFF_ORDER.join(" | ")+" |");
    L.push("|---|"+DIFF_ORDER.map(()=>"---").join("|")+"|");
    axes.forEach(k=> L.push(`| ${DIFF_AXIS_LABEL[k]} | ${DIFF_ORDER.map(D=>DIFFICULTY[D].axes[k]).join(" | ")} |`));
    L.push("");
    L.push("| 主要パラメータ | "+DIFF_ORDER.join(" | ")+" |");
    L.push("|---|"+DIFF_ORDER.map(()=>"---").join("|")+"|");
    [["需要のブレ","demandVolatility"],["市場の成長率","demandDrift"],
     ["レジームの粘り","regimeStickiness"],["CPC基準","cpcBase"],
     ["広告の飽和","adSaturation"],["価格弾力性","priceElasticityMultiplier"],
     ["固定費倍率","fixedCostMultiplier"],["開始現金倍率","startCashMultiplier"],
     ["競合の反応速度","competitorReactionSpeed"],["競合の記憶週数","competitorMemory"],
     ["離職しやすさ","staffTurnoverMultiplier"],["予測精度","forecastAccuracy"],
     ["借入枠","creditAvailability"]
    ].forEach(([jp,k])=> L.push(`| ${jp} | ${DIFF_ORDER.map(D=>DIFFICULTY[D][k]).join(" | ")} |`));
    L.push("");
    L.push("---");
    L.push("");
    L.push("> Difficulty = Decision Complexity × Economic Pressure × Uncertainty × Adaptive Competition（§57）");
    L.push("> EASY は舗装路、NORMAL は山道、HARD は天候が変わる山道、EXPERT は他の登山者がこちらのルートを見て先回りしてくる山道。");
    L.push("");

    return { md:L.join("\n"), summary:sum, gap, dom, ent, runs:runs.length };
  },
};

/* ========================= 起動 ========================= */
// デバッグ用に一部を公開（開発時のバランス確認に使う）
window.JB = { Engine, Economy, CONFIG, BUSINESSES, EVENTS,
  setSeed,
  /* ---- 難易度 v0.4 ---- */
  DIFFICULTY, DIFF_ORDER, DIFF_AXIS_LABEL, Difficulty,
  REGIMES, REGIME_MATRIX, MarketRegime,
  COMPETITOR_TYPES, Competitor, DIFFICULTY_PULSE, PRESSURE_KINDS,
  PERSONAS, Sim,
  recruitGate:(s)=>recruitGate(s||Engine.state), RECRUIT_EARLY,
  startNewBusiness, STAFF, AUTOMATIONS,
  /* ---- 創業融資 ---- */
  Finance, FINANCE_PLANS,
  openFinanceChoice:(cb)=>openFinanceChoice(cb), openLoanDesk:()=>openLoanDesk(),
  /* ---- プレイデータ（教育・分析用）---- */
  PlayLog, SHARE,
  playLog:{
    stats:()=>PlayLog.stats(),
    json:()=>PlayLog.toJSON(),
    csv:()=>PlayLog.toCSV(),
    saveJSON:()=>PlayLog.download("json"),
    saveCSV:()=>PlayLog.download("csv"),
    clear:()=>PlayLog.clear(),
  }, Metrics, BalanceReport,
  runOne:(b,p,d,sd,o)=>Sim.runOne(b,p,d,sd,o),
  monteCarlo:(o)=>Sim.monteCarlo(o),
  /* §39 docs/DIFFICULTY_BALANCE_REPORT.md を生成する。
     {save:true} でサーバーに書き出し、省略時は文字列を返すだけ。 */
  balanceReport(opt){
    opt=opt||{};
    const t0=Date.now();
    const rep=BalanceReport.build(opt);
    const ms=Date.now()-t0;
    console.log(`%cBALANCE REPORT: ${rep.runs}ラン / ${ms}ms`, "font-weight:bold;font-size:13px");
    console.table(rep.summary);
    if(opt.save===false || opt.save===undefined) return rep.md;
    return fetch("/api/report", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ name:opt.name||"DIFFICULTY_BALANCE_REPORT.md", content:rep.md }) })
      .then(r=>r.json())
      .then(j=>{ console.log(j.ok?`✅ 書き出し: ${j.path} (${j.bytes} bytes)`:`❌ ${j.error}`); return j; });
  },
  /* ===== §107 AIプレイヤー: 固定戦略が最適解にならないか検証する ===== */
  PLAYERS:{
    "A 何もしない":   (s)=>({produce:1, price:s.price, adBudget:0, actions:[]}),
    "B 広告だけ":     (s)=>({produce:2, price:s.price, adBudget:30000, actions:[]}),
    "C 値下げだけ":   (s)=>({produce:2, price:Math.round(BUSINESSES[s.bizId].price*0.55), adBudget:0, actions:[]}),
    "D 品質だけ":     (s)=>({produce:2, price:s.price, adBudget:0, actions:["improve"]}),
    "E バランス型":   (s,w)=>{
      const acts = w<=3 ? ["sns","improve"] : w<=8 ? ["sns","service"] : ["sns","service"];
      const ad = (w>=6 && w<=14 && s.conversionOK!==false) ? 20000 : 0;
      const hire = (w===9) ? ["ele"] : null;
      const manual = w>=15 ? ["manual"] : [];
      return {produce:2, price:Math.round(BUSINESSES[s.bizId].price*1.05), adBudget:ad,
              actions:acts.concat(manual), hire};
    },
    "F 採用しまくる": (s,w)=>({produce:2, price:s.price, adBudget:0, actions:["sns"],
              hire: w===3?["ele"] : w===5?["cheetah"] : w===7?["beaver"] : null}),
    "G 超節約型":     (s)=>({produce:1, price:s.price, adBudget:0, actions:["sns"]}),
  },

  // 1戦略を24週まわす
  runStrategy(bizId, key, seed){
    setSeed(seed===undefined?42:seed);
    Engine.newGame(bizId||"juice");
    const s=Engine.state, strat=this.PLAYERS[key];
    let cumProfit=0, cumSales=0, freeSum=0, minCash=s.cash, adSpend=0, lostTotal=0, peakLoad=0;
    const log=[];
    for(let w=1; w<=CONFIG.totalWeeks; w++){
      const p=strat(s,w);
      if(p.hire) p.hire.forEach(id=>{ const st=STAFF.find(x=>x.id===id);
        const has=s.staff.some(e=>(typeof e==="string"?e:e.id)===id);
        if(st && !has && s.cash>st.salary*2) s.staff.push({id, weeks:1, motivation:85}); });
      const acts=(p.actions||[]).filter(a=>ACTIONS[a]);
      const plan={produce:p.produce, price:p.price, adBudget:Math.min(p.adBudget||0, Math.max(0,s.cash)),
                  actions:acts.slice(), hoursUsed:0};
      const hrs=()=> plan.produce*ACTIONS.operate.hours
                     + plan.actions.reduce((a,id)=>a+ACTIONS[id].hours,0);
      plan.hoursUsed=hrs();
      while(plan.hoursUsed>CONFIG.baseHours && plan.actions.length){ plan.actions.pop(); plan.hoursUsed=hrs(); }
      const res=Economy.computeWeek(s, plan, {});
      s.cash+=res.cashDelta; Object.assign(s, res.next); s.price=plan.price;
      s.staff=(s.staff||[]).map(e=> typeof e==="string"?e:Object.assign({},e,{weeks:(e.weeks||1)+1}));
      cumProfit+=res.opProfit; cumSales+=res.sales; freeSum+=res.freeHours;
      adSpend+=res.adCost; lostTotal+=res.lost; peakLoad=Math.max(peakLoad,res.loadRatio);
      minCash=Math.min(minCash, s.cash); s.week++;
      log.push({w, sales:res.sales, profit:Math.round(res.opProfit), cash:Math.round(s.cash),
                cust:res.actual, lost:res.lost, conv:+(res.conversion*100).toFixed(1),
                free:res.freeHours, bn:res.bottleneck.code});
    }
    setSeed(null);
    return { key, cumSales, cumProfit:Math.round(cumProfit), endCash:Math.round(s.cash),
      minCash:Math.round(minCash), avgFree:+(freeSum/CONFIG.totalWeeks).toFixed(1),
      adSpend, lostTotal, peakLoad:+peakLoad.toFixed(2),
      sat:Math.round(s.satisfaction), brand:Math.round(s.brand), aware:Math.round(s.awareness),
      rep:Math.round(s.reputation), system:Math.round(s.systemLevel),
      dep:Math.round(s.ownerDependency), staff:s.staff.length, pool:Math.round(s.repeatPool), log };
  },

  // 全戦略を比較（§108 単一戦略が支配しないこと）
  compare(bizId, seed){
    const rows=Object.keys(this.PLAYERS).map(k=>{ const r=this.runStrategy(bizId,k,seed);
      delete r.log; return r; });
    console.table(rows); return rows;
  },

  sim(bizId, weeks){ const r=this.runStrategy(bizId,"E バランス型",42);
    console.table(r.log.slice(0,weeks||24)); return r.log; },

  /* ===== §26 24週で20体験に到達できるかの検証 ===== */
  checkExperiences(bizId){
    setSeed(99); Engine.newGame(bizId||"juice"); const s=Engine.state;
    // 本番と同じく、開業資金は借入込みで作る（自己資金だけで始めるのは実情では少数派）
    Finance.borrow(s, Math.round(s.cash*2.6/1000)*1000);
    const HIRE={17:'ele',18:'gorilla',19:'cheetah',20:'ant',21:'parrot'};
    const BUY={21:'pos',22:'booking',23:'mail'};
    let staffEvDone=false;
    for(let w=1; w<=CONFIG.totalWeeks; w++){
      s.week=w;
      if(HIRE[w]){ const st=STAFF.find(x=>x.id===HIRE[w]);
        if(s.cash>st.salary*2) s.staff.push({id:HIRE[w],weeks:1,motivation:85}); }
      if(BUY[w]){ const a=AUTOMATIONS.find(x=>x.id===BUY[w]);
        if(s.cash>a.cost*1.05){ s.cash-=a.cost; s.autos.push(a.id); s.systemLevel=Economy.clamp(s.systemLevel+a.sys,0,100); markExp("investment"); markExp("automation"); } }
      const acts=[]; let produce = w>=13?3:2;
      if(w>=2) acts.push('sns');
      if(w>=6 && w%3===0) acts.push('improve'); else if(w>=13) acts.push('service');
      if(w>=20) acts.push('manual');
      // ボス週は代表的な選択を当てて、その体験も通す
      const ctx={cashIn:0,cashOut:0}; const bs=bossFor(w);
      let evId=null;
      if(bs){ bs.choices[0].apply(ctx); evId=bs.id; }
      else if(!staffEvDone && w>=18 && s.staff.length>0){
        // 雇用後の最初のボス無し週に staff_morale を本番と同じ経路で1回通す
        // （事業によっては資金不足で雇用週がずれるため、週は固定しない）
        const ev=EVENTS.find(e=>e.id==='staff_morale');
        ev.choices[0].apply(ctx); evId=ev.id; staffEvDone=true;
      }
      const ref=BUSINESSES[s.bizId].price;      // 事業ごとの基準価格を使う
      /* 広告は「出せる範囲」で出す（本番も現金以上は出せない）。
         W9-11 は厚めに張る——初学者が一度は通る「広告を出せば売れるはず」の失敗を、
         この模範プレイにも通しておく。ここを通らないと §26 の20体験に届かない。 */
      const adRatio = (w>=9&&w<=11) ? 0.55 : 0.20;
      const adCap   = (w>=9&&w<=11) ? ref*60 : ref*20;   // 張る週は上限も緩める
      const ad=(w>=9&&w<=14) ? Math.max(0, Math.min(Math.round(adCap), Math.round(s.cash*adRatio))) : 0;
      const p={produce, price:ref, adBudget:ad,
               actions:acts, hoursUsed:produce*10+acts.length*8};
      const r=Economy.computeWeek(s,p,ctx);
      // 本番(resolveWeek)と同じ集約関数・同じ順序で判定する（これが噛み合わないと検証が本番とズレる）
      const prevH=s.history[s.history.length-1];   // push前なので前週
      const meta={ prevRep:s.reputation, eventId:evId,
                   hadTrainee:s.staff.some(e=>typeof e==="object" && (e.weeks||1)<=3),
                   prevSales:prevH?prevH.sales:null, prevConv:prevH?prevH.conv:null };
      s.cash+=r.cashDelta; Object.assign(s,r.next); s.price=p.price;
      s.staff=s.staff.map(e=>Object.assign({},e,{weeks:(e.weeks||1)+1}));
      s.history.push({week:w,sales:r.sales,profit:r.opProfit,cash:s.cash,customers:r.actual,conv:r.conversion,price:r.price});
      detectExperiences(s, r, meta);
    }
    const keys=Object.keys(EXPERIENCES);
    const got=keys.filter(k=>s.exp[k]);
    const missing=keys.filter(k=>!s.exp[k]);
    setSeed(null); pendingLessons=[];
    console.log(`§26 体験到達: ${got.length}/${keys.length}`);
    if(missing.length) console.log("未到達:", missing.map(k=>EXPERIENCES[k]).join(" / "));
    return { got:got.length, total:keys.length, missing:missing.map(k=>EXPERIENCES[k]) };
  },

  /* ===== §109 経済エンジン完成条件10項目の自動検証 ===== */
  checkConditions(bizId){
    bizId = bizId||"juice";
    const B=BUSINESSES[bizId], out=[];
    const add=(no,label,ok,detail)=> out.push({no, 条件:label, 判定: ok?"✅OK":"❌NG", 根拠:detail});
    const mk=(mut)=>{ setSeed(7); Engine.newGame(bizId); const s=Engine.state; if(mut) mut(s); return s; };
    const P=(o)=>Object.assign({produce:2, price:B.price, adBudget:0, actions:[], hoursUsed:20}, o);
    const C=Economy.computeWeek.bind(Economy);
    const y=(v)=>Math.round(v);

    // 1. 売上・利益・キャッシュが別々に動く
    { const s=mk(x=>{x.awareness=45;});
      setSeed(7); const r=C(s, P({adBudget:40000}), {cashOut:50000});
      add(1,"売上・利益・キャッシュが別々に動く",
        r.sales!==y(r.opProfit) && y(r.opProfit)!==y(r.cashDelta),
        `売上${y(r.sales)} / 利益${y(r.opProfit)} / 現金増減${y(r.cashDelta)}`); }

    // 2. 広告は自動的に儲かるわけではない
    //    低採算商材は「単価が薄くて回収できない」、高採算商材は「捌けない需要に払う」で失敗する（§43 §75）
    { // (a) 成約率が低い状態
      const s1=mk(x=>{x.awareness=30; x.quality=35; x.reputation=40;});
      setSeed(7); const n1=C(s1,P({adBudget:0}),{});
      setSeed(7); const a1=C(s1,P({adBudget:40000}),{});
      // (b) 供給能力が埋まっている状態（広告を打っても捌けない）
      const s2=mk(x=>{x.awareness=70; x.quality=60; x.reputation=65; x.repeatPool=40;});
      setSeed(7); const n2=C(s2,P({produce:1, adBudget:0}),{});
      setSeed(7); const a2=C(s2,P({produce:1, adBudget:40000}),{});
      const byConv = a1.opProfit < n1.opProfit, byCap = a2.opProfit < n2.opProfit;
      const why = byConv ? `成約率が低い時：${y(n1.opProfit)}→${y(a1.opProfit)}（成約率${(a1.conversion*100).toFixed(1)}%）`
                         : `供給が埋まっている時：${y(n2.opProfit)}→${y(a2.opProfit)}（${a2.lost}人を捌けず）`;
      add(2,"広告を増やしても必ず儲かるわけではない", byConv || byCap, why); }

    /* 3. 値下げの罠（供給能力で歪まないよう capMult で価格効果だけを見る）
          高弾力商材：売上は増えるのに粗利は減る／低弾力商材：客も増えず売上も粗利も落ちる（§17 §30）
          リピート客は価格に反応しないので、混ざると価格弾力が薄まる。
          ここは「価格が需要をどう動かすか」だけを見るテストなので、常連は外して測る。 */
    { const s=mk(x=>{x.awareness=65; x.repeatPool=0; x.activeCustomers=0;});
      setSeed(9); const normal=C(s,P({produce:4}),{capMult:10});
      setSeed(9); const cut=C(s,P({produce:4, price:Math.round(B.price*0.5)}),{capMult:10});
      const elastic = B.elas>1.0;   // 弾力性>1で値下げは売上増、<1なら売上も減る（経済学の境界）
      const ok = cut.gross<normal.gross && (elastic ? cut.sales>normal.sales : cut.sales<=normal.sales);
      const note = elastic ? "売上は増えたのに粗利は減った" : "低弾力: 値下げしても客は増えきらず、売上も粗利も減った";
      add(3,"値下げで売上が増えても利益は減る（罠）", ok,
        `${note}｜通常 客${normal.actual}/売上${y(normal.sales)}/粗利${y(normal.gross)} → 半額 客${cut.actual}/売上${y(cut.sales)}/粗利${y(cut.gross)}`); }

    // 4. 品質向上がリピートにつながる（6週まわして積み上がりを見る）
    { const run6=(q,sq)=>{ const s=mk(x=>{x.awareness=50; x.quality=q; x.serviceQuality=sq;});
        let last=null; for(let w=0;w<6;w++){ setSeed(11+w); last=C(s,P(),{});
          Object.assign(s,last.next); s.week++; } return last; };
      const rl=run6(45,50), rh=run6(88,75);
      add(4,"品質向上がリピートにつながる",
        rh.repeatRate>rl.repeatRate*1.15 && rh.next.repeatPool>rl.next.repeatPool*1.2,
        `質45→満足${y(rl.next.satisfaction)}/リピート率${(rl.repeatRate*100).toFixed(0)}%/プール${y(rl.next.repeatPool)}人 ｜ 質88→満足${y(rh.next.satisfaction)}/${(rh.repeatRate*100).toFixed(0)}%/${y(rh.next.repeatPool)}人`); }

    // 5. 成長すると時間（供給能力）が足りなくなる
    { const s=mk(x=>{x.awareness=95; x.quality=75; x.reputation=78; x.repeatPool=60;});
      setSeed(13); const r=C(s,P({produce:3, hoursUsed:30}),{});
      add(5,"成長すると時間が足りなくなる", r.lost>0 && r.loadRatio>1,
        `需要${r.demandCustomers}人 vs 能力${r.capacity}人 → ${r.lost}人を取りこぼし（負荷${r.loadRatio.toFixed(2)}倍）`); }

    // 6. 採用すると短期利益は減るが能力が増える
    { const a=mk(x=>{x.awareness=70;});
      setSeed(15); const ra=C(a,P(),{});
      const b2=mk(x=>{x.awareness=70; x.staff=[{id:"ele",weeks:1,motivation:85}];});
      setSeed(15); const rb=C(b2,P(),{});
      add(6,"採用すると短期利益は減るが能力は増える", rb.opProfit<ra.opProfit && rb.capacity>ra.capacity,
        `利益${y(ra.opProfit)}→${y(rb.opProfit)}（給与${y(rb.salaries)}）/ 能力${ra.capacity}→${rb.capacity}人`); }

    // 7. 仕組み化・委任で自由時間が増える
    { const a=mk(x=>{x.awareness=70;});
      setSeed(17); const ra=C(a,P({produce:3, hoursUsed:30}),{});
      const b2=mk(x=>{x.awareness=70; x.systemLevel=60; x.staff=[{id:"ele",weeks:5,motivation:85}];});
      setSeed(17); const rb=C(b2,P({produce:1, hoursUsed:10}),{});
      add(7,"仕組み化によって自由時間が増える", rb.capacity>=ra.capacity && rb.freeHours>ra.freeHours,
        `自力30h→能力${ra.capacity}人/自由${ra.freeHours}h ｜ 仕組み+人で10h→能力${rb.capacity}人/自由${rb.freeHours}h`); }

    // 8. 売れすぎが問題を生む
    { const s=mk(x=>{x.awareness=100; x.quality=80; x.reputation=88; x.repeatPool=80; x.satisfaction=75;});
      setSeed(19); const r=C(s,P({produce:1}),{});
      add(8,"売れすぎることも経営リスクになる", r.lost>0 && r.next.satisfaction<s.satisfaction,
        `${r.lost}人を捌けず、満足度${y(s.satisfaction)}→${y(r.next.satisfaction)}に低下`); }

    // 9. 利益が出ていてもキャッシュ危機は起こる
    { const s=mk(x=>{x.awareness=72; x.cash=30000;});
      setSeed(21); const r=C(s,P(),{cashOut:130000});
      add(9,"利益が出ていてもキャッシュ危機が起こる", r.opProfit>0 && (s.cash+r.cashDelta)<0,
        `今週利益${y(r.opProfit)}（黒字）なのに、投資13万で現金${y(s.cash+r.cashDelta)}`); }

    // 10. 単一の固定戦略では勝てない
    { const rows=Object.keys(this.PLAYERS).map(k=>this.runStrategy(bizId,k,42));
      const metrics=[["cumProfit","利益"],["endCash","現金"],["sat","顧客満足"],["avgFree","自由時間"],["system","仕組み化"]];
      const winners=metrics.map(([m,jp])=> jp+":"+rows.reduce((a,b)=> b[m]>a[m]?b:a).key.split(" ")[0]);
      const uniq=[...new Set(winners.map(w=>w.split(":")[1]))];
      add(10,"同じ戦略だけでは最後まで勝てない", uniq.length>1, winners.join(" / ")); }

    setSeed(null);
    const okCount=out.filter(o=>o.判定.includes("OK")).length;
    console.table(out);
    console.log(`%c経済エンジン v0.1 完成条件: ${okCount}/10 達成`, "font-weight:bold;font-size:14px");
    return {okCount, results:out};
  },
  // --- 開発検証用: 各モーダル/画面を直接呼び出す（クロージャ内関数にアクセス） ---
  /* ===== 事業ライフサイクル v0.3 の検証フック ===== */
  Macro, Runway, Valuation, Restructuring, Pivot, Exit, Portfolio,
  ERAS, MACRO_EVENTS, CHANNEL_MIX, PIVOTS, PHASES,
  test:{
    /* ---- §81 マクロ事象を即発生させる（要：プレイ中） ---- */
    pandemic(){ return this.macro("pandemic"); },
    recession(){ return this.macro("recession"); },
    boom(){ return this.macro("boom"); },
    inflation(){ return this.macro("inflation"); },
    competitor(){ return this.macro("competitor"); },
    /* 任意のマクロ事象を発生させる */
    macro(id){
      const s=Engine.state; if(!s) return "先に事業を開始してください";
      if(!MACRO_EVENTS[id]) return "不明な事象: " + Object.keys(MACRO_EVENTS).join(" / ");
      s.macro=null; s.macroSchedule=null; Macro.start(s,id); Engine.save();
      if(typeof renderPlay==="function") renderPlay();
      return { 事象:MACRO_EVENTS[id].name, フェーズ:Macro.phase(s).name,
               需要:Math.round(Macro.demandMult(s)*100)+"%（平常比）",
               原価:Macro.phase(s).cost+"倍",
               現金:fmt(s.cash), RUNWAY:Runway.label(s) };
    },
    /* 用意されているマクロ事象の一覧 */
    macroList(){ return Object.values(MACRO_EVENTS).map(d=>({
      id:d.id, 名前:d.name, 絵文字:d.emoji, フェーズ数:d.phases.length,
      合計週:d.phases.reduce((a,p)=>a+p.weeks,0)+"週+" })); },
    /* マクロ事象を1フェーズ進める（回復の確認用） */
    macroNext(){
      const s=Engine.state; if(!s||!s.macro) return "マクロ事象が発生していません";
      const d=Macro.def(s);
      if(s.macro.phase < d.phases.length-1){ s.macro.phase++; s.macro.weekInPhase=0; }
      Engine.save(); if(typeof renderPlay==="function") renderPlay();
      return { フェーズ:Macro.phase(s).name, 需要:Math.round(Macro.demandMult(s)*100)+"%" };
    },
    /* §30 一気に NEW NORMAL まで回復させる */
    recovery(){
      const s=Engine.state; if(!s||!s.macro) return "マクロ事象が発生していません";
      const d=Macro.def(s); s.macro.phase=d.phases.length-1; s.macro.weekInPhase=0;
      Engine.save(); if(typeof renderPlay==="function") renderPlay();
      return { フェーズ:Macro.phase(s).name, 需要:Math.round(Macro.demandMult(s)*100)+"%" };
    },
    /* 指定週へ飛ぶ（W24直前に飛べば ERA COMPLETE を確認できる） */
    jump(week){
      const s=Engine.state; if(!s) return "先に事業を開始してください";
      s.week=Math.max(1, week||24); s.era=eraOf(s); Engine.save();
      if(typeof renderPlay==="function") renderPlay();
      return { week:s.week, era:s.era };
    },
    /* STARTUP ERA COMPLETE 画面を直接表示 */
    eraComplete(){ if(!Engine.state) return "先に事業を開始してください"; openEraComplete("STARTUP"); },
    /* 本番と同じ週送り経路（advanceWeek）を1回通す。ERA節目・予兆・発生の確認用 */
    advance(){ if(!Engine.state) return "先に事業を開始してください";
      advanceWeek();
      const s=Engine.state;
      return { week:s.week, era:s.era, macro:s.macro?Macro.label(s):"—",
               schedule:s.macroSchedule ? JSON.stringify(s.macroSchedule) : "—" }; },
    /* CONTINUE / DOWNSIZE / PIVOT / EXIT の比較画面を直接表示 */
    strategy(){ if(!Engine.state) return "先に事業を開始してください"; openStrategy(); },
    pivotMenu(){ if(!Engine.state) return "先に事業を開始してください"; openPivot(); },
    exitMenu(){ if(!Engine.state) return "先に事業を開始してください"; openExitMenu(); },
    legacy(){ if(!Engine.state) return "先に事業を開始してください"; openLegacy(); },
    portfolio(){ if(!Engine.state) return "先に事業を開始してください"; openPortfolio(); },
    delegate(){ if(!Engine.state) return "先に事業を開始してください"; openDelegate(); },
    /* §37 §39 いま任せられるか＋任せた事業の収支 */
    portfolioState(){ const s=Engine.state; if(!s) return "先に事業を開始してください";
      return { 任せられるか:Portfolio.canDelegate(s)?"YES":("NO — "+Portfolio.reason(s)),
               仕組み化:Math.round(s.systemLevel), 依存度:Math.round(s.ownerDependency),
               まかせた事業:(s.portfolio||[]).length,
               週次合計:fmt(Portfolio.totalWeekly(s)), 管理コスト:fmt(overheadOf(s)),
               純資産:fmt(ownerNetWorth(s)) }; },
    /* 週ごとのフェーズ（W25以降も定義されているか） */
    phases(){ return PHASES.map(p=>({ PHASE:p.no, 週:p.from+"〜"+(p.to>9000?"":p.to),
      テーマ:p.title, ボトルネック:p.bottleneck })); },
    /* §26 撤退費用の内訳 */
    exitCost(){ const s=Engine.state; if(!s) return "先に事業を開始してください";
      const b=Exit.breakdown(s);
      return { 契約解除:fmt(b.lease), 退職金:fmt(b.severance), 処分:fmt(b.disposal),
               借入返済:fmt(b.debt), 合計:fmt(b.cost), 設備売却:"+"+fmt(b.assetSale),
               差引:fmt(b.net), 畳めるか:Exit.canClose(s)?"YES":"NO（現金不足）" }; },
    /* §15 §22 いまの Runway と事業価値の内訳 */
    runway(){ const s=Engine.state; if(!s) return "先に事業を開始してください";
      return { 現金:fmt(s.cash), 週あたりの減少:fmt(Runway.weeklyBurn(s)), RUNWAY:Runway.label(s) }; },
    valuation(){ const s=Engine.state; if(!s) return "先に事業を開始してください";
      const v=Valuation.breakdown(s);
      return { 利益価値:fmt(v.profitValue), ブランド:fmt(v.brandValue), 顧客:fmt(v.customerValue),
               設備:fmt(v.assetValue), 仕組み:fmt(v.systemValue),
               オーナー依存の割引:"-"+fmt(v.depDiscount), 借入:"-"+fmt(v.debtAdj),
               適正価値:fmt(v.fair), 市場係数:v.marketMult, 提示額:fmt(v.offer) }; },

    // イベント総数とカテゴリ内訳
    eventStats(){ const cats={}; let hidden=0;
      EVENTS.forEach(e=>{ cats[e.cat]=(cats[e.cat]||0)+1; if(e.hidden)hidden++; });
      const total=EVENTS.length + Object.keys(PHASE_BOSSES).length + Object.keys(FORCED_EVENTS).length;
      return {通常:EVENTS.length, ボス:Object.keys(PHASE_BOSSES).length, 強制:Object.keys(FORCED_EVENTS).length,
              隠し:hidden, カテゴリ:cats, 合計:total}; },
    // §50 の検証：同じ「talent」カードが、現金と認知で結果テキストを変えるか
    talentByState(){
      const run=(cash,aware)=>{ setSeed(1); Engine.newGame('juice'); const s=Engine.state; s.cash=cash; s.awareness=aware;
        const ev=EVENTS.find(e=>e.id==='talent'); const c={cashIn:0,cashOut:0,avgPrice:1000};
        ev.choices[0].apply(c); return c.note; };
      const out={ "現金3万/認知低":run(30000,20), "現金20万/認知低":run(200000,20), "現金20万/認知高":run(200000,60) };
      setSeed(null); console.table(out); return out; },
    // 抽選分布（状態依存が効いているか）
    drawDist(week, mutate, n){ const dist={}; n=n||300;
      for(let i=0;i<n;i++){ setSeed(1000+i); Engine.newGame('juice'); const s=Engine.state; s.week=week;
        if(mutate) mutate(s);
        const ev=drawEvent(s); if(ev) dist[ev.id]=(dist[ev.id]||0)+1; }
      setSeed(null);
      const sorted=Object.entries(dist).sort((a,b)=>b[1]-a[1]);
      console.table(sorted); return Object.fromEntries(sorted); },
    // 広告UIのHTMLを返す（NaN/undefined が出ていないか確認用）
    adHtml(adFatigue){ if(!Engine.state) Engine.newGame("juice");
      Engine.state.adFatigue=adFatigue||0; plan=plan||freshPlan(); plan.adBudget=30000;
      return renderAdCtrl(); },
    // checkExperiences の内訳（good_review 等が本当に立つかを個別確認）
    expDetail(bizId){ window.JB.checkExperiences(bizId); const s=Engine.state;
      const map={}; Object.keys(EXPERIENCES).forEach(k=> map[EXPERIENCES[k]] = s.exp[k]?"✓":"—");
      console.table(map); return map; },
    // 24週を複数シードで回し、実プレイで出るイベントの多様性を測る
    coverage(seeds){ seeds=seeds||8; const seen=new Set(); let boss=0, hidden=0;
      for(let sd=0; sd<seeds; sd++){ setSeed(sd*13+1); Engine.newGame('juice'); const s=Engine.state;
        for(let w=1; w<=CONFIG.totalWeeks; w++){ s.week=w;
          if(w>10){ s.satisfaction=Math.min(95,s.satisfaction+5); s.brand=Math.min(85,s.brand+4); }
          const ev=drawEvent(s); if(ev){ seen.add(ev.id); if(ev.boss)boss++; if(ev.hidden)hidden++; } } }
      setSeed(null);
      return { 出た種類:seen.size, ボス発生:boss, 隠し発生:hidden, 一覧:[...seen].sort() }; },
    // 週ごとの確定イベント（PHASE BOSS / 強制失敗）を一覧
    bosses(){ const out=[]; for(let w=1; w<=CONFIG.totalWeeks; w++){ const b=bossFor(w);
      out.push({週:w, 確定イベント: b?`${b.emoji} ${b.title}`:"—", 種別: b?(PHASE_BOSSES[w]?"PHASE BOSS":"強制失敗"):""}); }
      console.table(out); return out; },
    // その週の解放内容
    unlocks(){ const out=[]; Object.keys(WEEK_UNLOCKS).forEach(w=>{ const u=WEEK_UNLOCKS[w];
      out.push({週:+w, 解放:u.reveal.join("/"), 見出し:u.title}); }); console.table(out); return out; },
    boss(week){ const b=bossFor(week); if(!b) return "その週にボスはいません";
      if(!Engine.state) Engine.newGame("juice"); Engine.state.week=week; if(!plan)plan=freshPlan();
      openEventModal(b, ()=>{ modalRoot.innerHTML=""; }); return b.title; },
    event(id){ if(!Engine.state){Engine.newGame("juice");} if(!plan)plan=freshPlan();
      const ev=EVENTS.find(e=>e.id===id)||EVENTS[0]; openEventModal(ev, ()=>{ modalRoot.innerHTML=""; }); },
    analytics(){ if(Engine.state) openAnalytics(); },
    recruit(){ if(!Engine.state)Engine.newGame("juice"); Engine.state.level=6; openRecruit(); },
    levelup(lv){ const s=Engine.state; s.level=(lv||2)-1; const m=checkLevelUp(); if(m){ modalRoot.innerHTML='<div class="overlay"><div class="modal">'+m.html+'</div></div>'; m.wire(modalRoot,()=>{modalRoot.innerHTML="";}); } },
    badge(id){ modalRoot.innerHTML=""; const m=badgeModal(id||"first_profit"); modalRoot.innerHTML='<div class="overlay"><div class="modal">'+m.html+'</div></div>'; m.wire(modalRoot,()=>{modalRoot.innerHTML="";}); },
    final(bizId){ // 24週プレイ相当の履歴を作って最終画面を表示
      Engine.newGame(bizId||"juice"); const s=Engine.state;
      for(let w=0; w<24; w++){ plan={produce:2, price:s.price, adBudget:(w>4&&w<9?30000:0), actions:["sns","service","improve"], hoursUsed:0}; recalcHours();
        const res=Economy.computeWeek(s,plan,{}); s.cash+=res.cashDelta; Object.assign(s,res.next);
        s.history.push({week:s.week,sales:res.sales,profit:res.opProfit,cash:s.cash,customers:res.actual,reach:res.totalReach,conv:res.conversion,price:res.price});
        s.freeHoursLog.push(CONFIG.baseHours-plan.hoursUsed); s.week++; }
      s.staff=["ele"]; s.systemLevel=40; s.brand=Math.max(s.brand,45);
      openFinal(); },
  }
};

    DIFFICULTY, DIFF_ORDER, DIFF_AXIS_LABEL, Difficulty, REGIMES, MarketRegime,

    enqueueModal, runModalQueue, closeModals,

} else {

}
