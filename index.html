  /* §8 巨大競合：需要は減らない。あなたの取り分が減る */
  competitor: {
    id:"competitor", name:"GIANT COMPETITOR", emoji:"🏬",
    headline:"大きな資本が、隣に店を出した",
    lead: 2,
    news:"本土のチェーンがこの島に出店するという噂がある。場所はまだ分からない。",
    newsSub:"価格でも品揃えでも敵わない相手が来たとき、何で戦うのか。",
    desc:"市場が消えたわけではない。<b>あなたの取り分が削られた</b>。<br>安さで勝てない相手に、何で選ばれるかを決め直す時だ。",
    phases:[
      { id:"OPENING", name:"THEIR OPENING", weeks:4, walkIn:0.55, tourist:0.60, online:0.85, delivery:0.90, cap:1.00, cost:1.00, valuation:0.70 },
      { id:"PRESSURE",name:"PRESSURE",      weeks:6, walkIn:0.50, tourist:0.55, online:0.85, delivery:0.90, cap:1.00, cost:1.00, valuation:0.65 },
      { id:"NICHE",   name:"FINDING NICHE", weeks:5, walkIn:0.70, tourist:0.75, online:0.95, delivery:1.00, cap:1.00, cost:1.00, valuation:0.85 },
      { id:"NORMAL",  name:"NEW NORMAL",    weeks:0, walkIn:0.80, tourist:0.85, online:1.00, delivery:1.05, cap:1.00, cost:1.00, valuation:0.92 },
    ],
  },
};

const Macro = {
  def(s){ return (s && s.macro) ? MACRO_EVENTS[s.macro.id] : null; },
  phase(s){
    const d=this.def(s); if(!d) return null;
    return d.phases[Math.min(s.macro.phase, d.phases.length-1)];
  },
  active(s){ return !!(s && s.macro); },

  /* 発生。現金には一切触れない（§4 §5 破壊するのはビジネスモデル） */
  start(s, id){
    const d = MACRO_EVENTS[id]; if(!d) return null;
    s.macro = { id, phase:0, weekInPhase:0, weeks:0 };
    s.macroSchedule = null;
    if(!s.macroSeen.includes(id)) s.macroSeen.push(id);
    return d;
  },
  /* 週送りのたびに1つ進める。フェーズを渡り終えたら NEW NORMAL に留まる */
  tick(s){
    if(!s.macro) return;
    const d=this.def(s); if(!d){ s.macro=null; return; }
    s.macro.weeks++; s.macro.weekInPhase++;
    const cur = d.phases[s.macro.phase];
    // §14 リストラした事業は回復が遅い（フェーズ進行に必要な週が伸びる）
    const need = cur.weeks + Math.round((s.recoveryPenalty||0) * cur.weeks);
    if(cur.weeks > 0 && s.macro.weekInPhase >= need && s.macro.phase < d.phases.length-1){
      s.macro.phase++; s.macro.weekInPhase = 0;
    }
    // §41 §42 NEW NORMAL が定着したら、その波は終わる。次の波は、しばらく先に来る
    if(s.macro.phase === d.phases.length-1 && s.macro.weekInPhase >= 6){
      s.macro = null;
      s.recoveryPenalty = Math.max(0, (s.recoveryPenalty||0) - 0.2);   // 落ち着けば体力も戻る
      scheduleMacro(s);
    }
  },
  /* §6 チャネル構成に応じた需要倍率。店舗型は弱く、EC/デリバリー型は強い */
  demandMult(s){
    const p=this.phase(s); if(!p) return 1;
    const mix = Pivot.mixOf(s);      // §17 転換していれば、新しいチャネル構成で受ける
    return Math.max(0.05,
      mix.walkIn*p.walkIn + mix.tourist*p.tourist + mix.online*p.online + mix.delivery*p.delivery);
  },
  /* computeWeek へ渡す ctx。イベント由来の ctx とは掛け算で合成する */
  applyCtx(s, ctx){
    ctx = ctx || {};
    if(!this.active(s)) return ctx;
    const p = this.phase(s);
    ctx.marketMult = (ctx.marketMult||1) * this.demandMult(s);
    ctx.capMult    = (ctx.capMult||1)    * p.cap;
    ctx.costMult   = (ctx.costMult||1)   * p.cost;
    return ctx;
  },
  label(s){
    const d=this.def(s), p=this.phase(s);
    return d ? `${d.emoji} ${d.name} — ${p.name}` : "";
  },
  /* §31 需要が戻る見込み（週）。§64 OWLはこれを示して問いを返す */
  recoveryForecast(s){
    const d=this.def(s); if(!d) return null;
    let left=0;
    for(let i=s.macro.phase; i<d.phases.length-1; i++){
      const ph=d.phases[i];
      const need = ph.weeks + Math.round((s.recoveryPenalty||0)*ph.weeks);
      left += (i===s.macro.phase) ? Math.max(0, need - s.macro.weekInPhase) : need;
    }
    return { min:Math.max(1,Math.round(left*0.8)), max:Math.round(left*1.4)+2 };
  },
};

/* ---- §15 §16 CASH RUNWAY。現金 ÷ 週あたりの現金減少。黒字なら STABLE ---- */
const Runway = {
  weeklyBurn(s){
    const h = s.history || [];
    if(h.length < 2){
      const last = h[h.length-1];
      return last ? Math.max(0, -(last.profit||0)) : 0;
    }
    const use = h.slice(-4);           // 直近4週の現金の動きを均す
    let sum=0, n=0;
    for(let i=1;i<use.length;i++){ sum += (use[i-1].cash - use[i].cash); n++; }
    return n ? sum/n : 0;              // 正の値 ＝ 毎週減っている
  },
  weeks(s){
    const b=this.weeklyBurn(s);
    if(b <= 0) return Infinity;        // 現金が増えている
    return Math.max(0, s.cash / b);
  },
  label(s){
    const w=this.weeks(s);
    if(!isFinite(w)) return "STABLE";  // §16 Infinity と出さない
    if(w >= 99) return "99+ 週";
    return Math.floor(w) + " 週";
  },
  danger(s){ const w=this.weeks(s); return isFinite(w) && w < 8; },

  /* §55 借りられる額には限りがある。ここが「無限に延命できる」を止める線。
     固定費の何週ぶんまで銀行が見てくれるか——それが難易度ごとの復帰余地。 */
  creditLimit(s){
    const p = Difficulty.profile(s);
    const weekly = Math.max(3000, weeklyBurn(s));
    return Math.round(weekly * 10 * p.creditAvailability);
  },
  creditLeft(s){ return Math.max(0, this.creditLimit(s) - (s.loan||0)); },
};

/* ========================= 創業融資（§実情ベース） =========================
   現実の創業は、手持ちだけでは始まらない。調達額の 2/3 は借入で、自己資金は 1/4 ほど。
   借りた金は「入ってくる時は嬉しく、返す時は静かに効いてくる」。
   利息は費用（利益から引かれる）。元金の返済は費用ではない（利益からは引かれない）。
   なのに現金は確実に減る——この非対称を、毎週の数字で見せる。 */
const Finance = {
  // 銀行との関係。実績で育ち、延滞で壊れる。金利と枠の両方に効く。
  trust(s){ return Economy.clamp(s.bankTrust!=null ? s.bankTrust : ECON.bankTrustStart, 0, 100); },
  trustLabel(s){
    const t=this.trust(s);
    if(t>=80) return {name:"厚い信頼", emoji:"🤝", tone:"good"};
    if(t>=60) return {name:"良好", emoji:"🙂", tone:"good"};
    if(t>=40) return {name:"ふつう", emoji:"😐", tone:"mid"};
    if(t>=20) return {name:"不安がられている", emoji:"😟", tone:"warn"};
    return {name:"信用を失っている", emoji:"🚫", tone:"bad"};
  },
  // 年利。信用が高いほど下がる（現実でも実績と計画で利率は動く）
  rate(s){
    const t=this.trust(s)/100;
    return ECON.loanRateBase - (ECON.loanRateBase-ECON.loanRateBest)*t;
  },
  // 返済条件は島（難易度）で違う。創業支援の手厚さの差。
  graceWeeks(s){ const p=Difficulty.profile(s); return p.loanGrace || ECON.loanGraceWeeks; },
  termWeeks(s){ const p=Difficulty.profile(s); return p.loanTerm || ECON.loanTermWeeks; },
  weeklyRate(s){ return this.rate(s)/52; },
  interest(s){ return Math.round((s.loan||0) * this.weeklyRate(s)); },

  // 据置が明けたら、残り期間で元金を割って返していく
  inGrace(s){ return (s.loanGrace||0) > 0; },
  principalDue(s){
    if(!(s.loan>0)) return 0;
    if(this.inGrace(s)) return 0;
    const left = Math.max(1, s.loanTermLeft||1);
    return Math.min(s.loan, Math.ceil(s.loan/left));
  },
  dueTotal(s){ return this.principalDue(s) + this.interest(s); },

  // 借りられる上限。事業の体力（固定費）と信用で決まる
  limit(s){
    const p = Difficulty.profile(s);
    const weekly = Math.max(3000, weeklyBurn(s));
    const trustMult = 0.55 + this.trust(s)/100 * 0.9;      // 信用50で1.0倍
    return Math.round(weekly * 14 * p.creditAvailability * trustMult);
  },
  available(s){ return Math.max(0, this.limit(s) - (s.loan||0)); },
  canBorrow(s){ return this.trust(s) >= 15 && this.available(s) >= 10000; },

  /* 借りる。据置と返済期間はここで引き直す（追加借入で期間が延びる） */
  borrow(s, amount){
    const amt = Math.max(0, Math.min(Math.round(amount), this.available(s)));
    if(amt<=0) return 0;
    s.loan = (s.loan||0) + amt;
    s.loanTotal = (s.loanTotal||0) + amt;
    s.cash += amt;
    s.loanGrace = Math.max(s.loanGrace||0, this.graceWeeks(s));
    s.loanTermLeft = Math.max(s.loanTermLeft||0, this.termWeeks(s));
    return amt;
  },

  /* 週次の返済。resolveWeek から呼ぶ。
     返り値の principal は「利益に出ないが現金から消えた額」＝教材の主役。 */
  tick(s){
    const out = { interest:0, principal:0, late:false, cleared:false };
    if(!(s.loan>0)){
      if(s.loanGrace) s.loanGrace=0;
      return out;
    }
    out.interest = this.interest(s);
    if(this.inGrace(s)){
      s.loanGrace--;                                        // 据置中は利息だけ
    } else {
      const due = this.principalDue(s);
      if(s.cash >= due){
        s.loan = Math.max(0, s.loan - due);
        out.principal = due;
        s.bankTrust = Economy.clamp(this.trust(s)+ECON.bankTrustRepay, 0, 100);
        if(s.loan<=0){
          out.cleared = true;
          s.bankTrust = Economy.clamp(this.trust(s)+ECON.bankTrustDone, 0, 100);
          s.loanTermLeft = 0;
        }
      } else {
        out.late = true;                                    // 返せなかった。ここが一番効く
        s.bankTrust = Economy.clamp(this.trust(s)+ECON.bankTrustLate, 0, 100);
        s.lateCount = (s.lateCount||0)+1;
      }
      if(s.loanTermLeft>0) s.loanTermLeft--;
    }
    return out;
  },
};

/* ---- §22 §23 事業価値。利益・ブランド・顧客・設備・仕組みから積み上げ、
        借入とオーナー依存度で引く。市場が悪ければディスカウントされる ---- */
const Valuation = {
  normalizedProfit(s){
    const h=(s.history||[]).slice(-8);
    if(!h.length) return 0;
    return h.reduce((a,x)=>a+(x.profit||0),0)/h.length;
  },
  breakdown(s){
    const wp = this.normalizedProfit(s);
    const profitValue   = Math.max(0, Math.round(wp*52*1.6));               // 年換算利益×1.6
    const brandValue    = Math.round((s.brand||0)*2600 + (s.reputation||0)*900);
    const customerValue = Math.round((s.repeatPool||0)*760);
    const assetValue    = Math.round((s.autos||[]).reduce((a,id)=>{
      const x=AUTOMATIONS.find(y=>y.id===id); return a + (x ? x.cost*0.44 : 0); }, 0));  // §28 買値では売れない
    const systemValue   = Math.round((s.systemLevel||0)*2200);
    const debtAdj       = Math.round((s.loan||0) + (s.debt||0));
    const base = profitValue + brandValue + customerValue + assetValue + systemValue;
    // §22 オーナー依存度が高い事業は「あなたごと」でないと回らない＝買い手には価値が低い
    const depDiscount = Math.round(base * ((s.ownerDependency||0)/100) * 0.30);
    const fair = Math.max(0, base - depDiscount - debtAdj);
    const p = Macro.phase(s);
    const marketMult = p ? p.valuation : 1;                                  // §23 市場ショック中は買い叩かれる
    return { profitValue, brandValue, customerValue, assetValue, systemValue,
             depDiscount, debtAdj, base, fair, marketMult,
             offer: Math.max(0, Math.round(fair*marketMult)) };
  },
  value(s){ return this.breakdown(s).offer; },
};

/* ---- §12 §13 §14 縮小（リストラ）。人を減らせば固定費は下がるが、
        退職金が即座に現金を奪い、供給力と回復力が落ちる ---- */
const Restructuring = {
  layoffCost(n){ return n * CONFIG.severancePerStaff; },
  /* n人を解雇。戻り値は実際に減った人数と支払った退職金 */
  layoff(s, n){
    const staff = s.staff||[];
    const cut = Math.min(n, staff.length);
    if(cut<=0) return { cut:0, cost:0 };
    const cost = this.layoffCost(cut);
    s.staff = staff.slice(0, staff.length-cut);      // 後から入った人から離れる
    s.cash -= cost;
    s.severancePaid = (s.severancePaid||0) + cost;
    s.recoveryPenalty = Math.min(0.8, (s.recoveryPenalty||0) + 0.12*cut);   // §14 回復が遅くなる
    s.reputation = Economy.clamp((s.reputation||50) - 2.5*cut, 0, 100);     // §13 ブランドリスク
    s.bizStatus = "DOWNSIZING";
    return { cut, cost };
  },
  /* 営業を絞る：固定費が下がる代わりに供給力も落ちる */
  shrinkOps(s){
    s.fixedMult = Math.max(0.5, (s.fixedMult||1) - 0.25);
    s.capPenalty = Math.min(0.5, (s.capPenalty||0) + 0.15);
    s.bizStatus = "DOWNSIZING";
    return { fixedMult:s.fixedMult };
  },
};

/* ---- §17-20 PIVOT。売り方そのものを変える。ただしタダではないし、すぐには戻らない ---- */
const PIVOTS = {
  delivery: { id:"delivery", emoji:"🛵", name:"デリバリー中心", cost:200000, learn:0.45,
    mix:{ walkIn:0.25, tourist:0.05, online:0.20, delivery:0.50 },
    desc:"来てもらうのをやめ、こちらから届ける。店の前の人通りに頼らなくなる。" },
  ec: { id:"ec", emoji:"📦", name:"オンライン販売（EC）", cost:300000, learn:0.55,
    mix:{ walkIn:0.15, tourist:0.05, online:0.70, delivery:0.10 },
    desc:"島の外へ売る。作る場所と、売る場所を切り離す。" },
  subscription: { id:"subscription", emoji:"🔁", name:"定期購入（サブスク）", cost:250000, learn:0.50,
    mix:{ walkIn:0.30, tourist:0.10, online:0.50, delivery:0.10 },
    desc:"毎週買ってくれる人を作る。売上が「読める」ようになる。" },
  wholesale: { id:"wholesale", emoji:"🏪", name:"卸・法人向け", cost:180000, learn:0.40,
    mix:{ walkIn:0.20, tourist:0.10, online:0.25, delivery:0.45 },
    desc:"1人ずつではなく、まとめて買う相手に売る。" },
};
const Pivot = {
  /* §20 転換しても、ブランド・顧客・仲間・現金は引き継がれる。ゼロからではない */
  mixOf(s){
    return (s && s.pivot && PIVOTS[s.pivot.id]) ? PIVOTS[s.pivot.id].mix
         : (CHANNEL_MIX[s.bizId] || CHANNEL_MIX.juice);
  },
  apply(s, id){
    const p=PIVOTS[id]; if(!p) return null;
    s.cash -= p.cost;
    s.pivot = { id, week:s.week, learning:p.learn };      // §19 学習曲線
    s.awareness = Economy.clamp(s.awareness*0.55, 0, 100); // 新しい売り方は、まだ知られていない
    s.bizStatus = "PIVOTING";
    markExp("investment");
    return p;
  },
  /* §19 習熟していく。最初は本来の力が出ない */
  tick(s){
    if(!s.pivot) return;
    s.pivot.learning = Math.max(0, +(s.pivot.learning - 0.06).toFixed(3));
    if(s.pivot.learning <= 0 && s.bizStatus === "PIVOTING") s.bizStatus = "ACTIVE";
  },
  ctx(s, ctx){
    ctx = ctx || {};
    if(!s.pivot || s.pivot.learning <= 0) return ctx;
    ctx.convMult = (ctx.convMult||1) * (1 - s.pivot.learning*0.55);
    return ctx;
  },
};

/* ---- §25-28 撤退と売却。どちらも「タダでは終われない」 ---- */
const Exit = {
  breakdown(s){
    const B=BUSINESSES[s.bizId];
    const lease     = Math.round(B.fixed*4);                       // 契約解除（固定費4週ぶん）
    const severance = (s.staff||[]).length * CONFIG.severancePerStaff;
    const disposal  = Math.round(B.fixed*0.8);                     // 在庫処分・設備撤去
    const debt      = Math.round((s.loan||0) + (s.debt||0));
    const assetSale = Math.round((s.autos||[]).reduce((a,id)=>{     // §28 買値では売れない
      const x=AUTOMATIONS.find(y=>y.id===id); return a + (x ? x.cost*0.44 : 0); }, 0));
    const cost = lease + severance + disposal + debt;
    return { lease, severance, disposal, debt, assetSale, cost, net: assetSale - cost };
  },
  /* §27 畳むだけの現金が無ければ、畳むこともできない */
  canClose(s){ const b=this.breakdown(s); return (s.cash + b.assetSale) >= b.cost; },
  close(s){
    const b=this.breakdown(s);
    s.cash += b.assetSale - b.cost;
    s.loan=0; s.debt=0;
    this.archive(s, "CLOSED", 0);
    return b;
  },
  /* §21-24 売却。買い手が引き継ぐので在庫処分・設備撤去はかからない */
  sell(s){
    const v=Valuation.breakdown(s), b=this.breakdown(s);
    const exitCost = b.lease + b.severance;
    const net = v.offer - exitCost - b.debt;
    s.cash += net;
    s.loan=0; s.debt=0;
    this.archive(s, "SOLD", v.offer);
    return { offer:v.offer, exitCost, debt:b.debt, net, marketMult:v.marketMult, fair:v.fair };
  },
  /* §57 §58 事業の一生を記録に残す */
  archive(s, type, price){
    const h=s.history||[];
    s.bizHistory = s.bizHistory || [];
    s.bizHistory.push({
      bizId:s.bizId, name:BUSINESSES[s.bizId].name, emoji:BUSINESSES[s.bizId].emoji,
      founded:s.founded||1, exitWeek:s.week, exitType:type,
      price:Math.round(price||0),
      peakSales:Math.round(h.reduce((a,x)=>Math.max(a,x.sales||0),0)),
      peakStaff:Math.max(s._peakStaff||0, (s.staff||[]).length),
      totalProfit:Math.round(h.reduce((a,x)=>a+(x.profit||0),0)),
      weeks:h.length,
      pivot: s.pivot ? PIVOTS[s.pivot.id].name : null,
    });
    s.bizStatus = type;
  },
};

/* §34-36 事業を手放しても、経営者は残る。現金・XP・学んだことを持って次へ */
function startNewBusiness(bizId, difficulty){
  const s=Engine.state;
  const keep = {
    cash:s.cash, week:s.week, owner:s.owner, bizHistory:s.bizHistory,
    xp:s.xp, level:s.level, badges:s.badges, exp:s.exp, reveal:s.reveal,
    macro:s.macro, macroSeen:s.macroSeen, macroSchedule:s.macroSchedule, eraDone:s.eraDone,
  };
  // §35 次の事業は、別の島（難易度）を選び直せる。指定が無ければ今と同じ島で続ける。
  Engine.newGame(bizId, difficulty || s.difficulty);
  const n=Engine.state;
  n.cash=keep.cash; n.week=keep.week;                    // §35 週は戻らない。人生は続いている
  n.owner=keep.owner; n.bizHistory=keep.bizHistory;
  n.xp=keep.xp; n.level=keep.level; n.badges=keep.badges;
  n.exp=keep.exp; n.reveal=keep.reveal;                  // §36 学んだ指標は忘れない
  n.macro=keep.macro; n.macroSeen=keep.macroSeen; n.macroSchedule=keep.macroSchedule;
  n.eraDone=keep.eraDone;
  n.founded=keep.week; n.era=eraOf(n);
  n.owner.businessesRun=(n.owner.businessesRun||1)+1;
  Engine.save();
  return n;
}

/* §59 オーナーの純資産（現金＋いまの事業価値＋任せている事業−借入）。§60 序盤では見せない */
function ownerNetWorth(s){
  const pf=(s.portfolio||[]).reduce((a,b)=> a + Math.max(0, Portfolio.passiveWeekly(b,s)*52*1.6), 0);
  return Math.round((s.cash||0) + Valuation.value(s) + pf - ((s.loan||0)+(s.debt||0)));
}

/* §84 §85 大きくなるほど、別の難しさが来る。
   任せた事業が増えるほど管理コストがかかり、現金が増え続けるだけの展開にはならない。 */
function overheadOf(s){
  const n=(s.portfolio||[]).length;
  return n<=0 ? 0 : Math.round(n*n*6000);   // 事業2つで¥24,000/週、3つで¥54,000/週
}

const Sound = {
  ctx:null, muted:false,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  beep(freq,dur,type){ if(this.muted)return; this.ensure(); if(!this.ctx)return;
    try{ const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||"sine"; o.frequency.value=freq; o.connect(g); g.connect(this.ctx.destination);
      g.gain.setValueAtTime(0.14,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
      o.start(); o.stop(this.ctx.currentTime+dur);
    }catch(e){} },
  coin(){ this.beep(880,0.08,"triangle"); setTimeout(()=>this.beep(1320,0.1,"triangle"),70); },
  level(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.16,"triangle"),i*90)); },
  warn(){ this.beep(200,0.25,"sawtooth"); },
  click(){ this.beep(440,0.04,"square"); },
};

// トースト
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .4s"; setTimeout(()=>t.remove(),400); }, 1800);
}
// コイン演出
function coinBurst(x,y){
  for(let i=0;i<6;i++){ const c=document.createElement("div"); c.className="coin"; c.textContent="🪙";
    c.style.left=(x+(Math.random()*60-30))+"px"; c.style.top=(y+(Math.random()*20-10))+"px";
    c.style.animationDelay=(i*0.05)+"s"; document.body.appendChild(c); setTimeout(()=>c.remove(),1100); }
}

/* ---------- モーダル基盤（順番に出すキュー） ---------- */
let modalQueue=[];
function enqueueModal(spec){ modalQueue.push(spec); }
function runModalQueue(onAllDone){
  if(modalQueue.length===0){ modalRoot.innerHTML=""; if(onAllDone)onAllDone(); return; }
  const spec = modalQueue.shift();
  showModal(spec, ()=> runModalQueue(onAllDone));
}
function showModal(spec, done){
  modalRoot.innerHTML = '<div class="overlay"><div class="modal">'+spec.html+'</div></div>';
  if(spec.wire) spec.wire(modalRoot, done);
}
function closeModals(){ modalRoot.innerHTML=""; modalQueue=[]; }

function freshPlan(){ const s=Engine.state; return { produce:1, price:s.price, adBudget:0, actions:[], hoursUsed:0 }; }
function recalcHours(){
  let h = (plan.produce||0)*ACTIONS.operate.hours;
  plan.actions.forEach(id=>{ if(ACTIONS[id]) h+=ACTIONS[id].hours; });
  plan.hoursUsed=h; return h;
}

/* 借入の状態。返済が始まると、毎週いくら現金が出ていくかを常に見せる。
   §30 §31「利益は出ているのに現金が減る」の正体を、数字で名指しする。 */
function renderFinanceBar(s){
  const hasLoan=(s.loan||0)>0;
  const canAsk=Finance.canBorrow(s);
  if(!hasLoan && !canAsk) return "";
  const t=Finance.trustLabel(s);
  const due=Finance.principalDue(s), int=Finance.interest(s);
  const grace=Finance.inGrace(s);
  const color = t.tone==="bad"?"var(--danger)": t.tone==="warn"?"#c98a00":"var(--leaf-700)";
  return `<div class="card" style="margin-top:10px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="font-size:20px">🏦</div>
      <div style="flex:1;min-width:150px">
        ${hasLoan?`<div style="font-weight:900;font-size:14px">借入残高 ${fmt(s.loan)}</div>
          <div class="muted" style="font-size:12px">
            ${grace?`据置中（あと${s.loanGrace}週）・利息 ${fmt(int)}/週`
                   :`毎週 <b style="color:var(--danger)">${fmt(due+int)}</b> の返済（元金 ${fmt(due)}＋利息 ${fmt(int)}）・残り${s.loanTermLeft||0}週`}
          </div>`
          :`<div style="font-weight:900;font-size:14px">借入なし</div>
            <div class="muted" style="font-size:12px">あと ${fmt(Finance.available(s))} まで借りられる</div>`}
      </div>
      <div style="text-align:right">
        <div class="muted" style="font-size:11px;font-weight:800;letter-spacing:.12em">銀行との関係</div>
        <div style="font-size:14px;font-weight:900;color:${color}">${t.emoji} ${t.name}</div>
      </div>
    </div>
    ${hasLoan && !grace?`<div class="muted" style="font-size:11.5px;margin-top:8px;line-height:1.6">
      🦉 元金の返済は<b>費用ではない</b>ので利益には出ない。それでも現金からは毎週 ${fmt(due)} 消えていく。</div>`:''}
    <button class="btn outline small" id="loanDeskBtn" style="margin-top:10px">🏦 銀行に相談する</button>
  </div>`;
}

/* §19 §20 §47〜§49 市場と競合のバー。
   難易度が上がるほど「数字」ではなく「気配」しか出ない。ただし推測材料は必ず残す。 */
function renderMarketBar(s){
  if(!s || s.week<3) return "";                     // 序盤は情報を出しすぎない（§15 理解の順番）
  const D=Difficulty.profile(s), R=MarketRegime.def(s);
  const cp=Competitor.pressure(s);
  const last=s.history[s.history.length-1];
  const fc=Difficulty.forecast(s, last?last.customers*4:null);   // 直近の客数から需要規模を概算
  const fcHtml = fc.mode==="range"
    ? `来週の見込み客 <b>${fmtNum(fc.low)}〜${fmtNum(fc.high)}人</b>`
    : `<b>${fc.text}</b>`;
  // 競合の相場（自分の価格との比較で「高いか安いか」を出す）
  const B=BUSINESSES[s.bizId];
  const myRatio=(s.price||B.price)/B.price;
  const gap=myRatio-cp.priceLevel;
  const priceNote = Math.abs(gap)<0.04 ? "相場どおり"
    : gap>0 ? `相場より <b style="color:var(--warn)">${Math.round(gap*100)}%高い</b>`
            : `相場より <b>${Math.round(-gap*100)}%安い</b>`;
  // §14 読まれているかどうかは、EXPERT ほど強く警告する
  const pred=cp.predictability||0;
  const readNote = (pred>0.45 && D.axes.competitorIntelligence>=60)
    ? `<div class="mb-warn">👁 同じ手を続けている。競合に読まれ始めた。</div>` : "";
  const notes=(cp.notes||[]).slice(0,1).map(n=>
    `<div class="mb-warn">⚔️ ${COMPETITOR_TYPES[n.by].emoji} ${n.note}</div>`).join("");
  return `
    <div class="marketbar">
      <div class="mb-row">

function renderKPIs(s){

  const trend=(cur,prev,inv)=>{ if(prev===undefined||prev===null) return `<div class="trend flat">—</div>`;
    const up=cur>prev; const good= inv? !up : up; const same=Math.abs(cur-prev)<0.001;
    if(same) return `<div class="trend flat">→ 横ばい</div>`;
    return `<div class="trend ${good?'up':'down'}">${up?'↑':'↓'} ${good?'GOOD':'WATCH'}</div>`; };
  const prev=s.history[s.history.length-1];

  let heroHtml=`
    <div class="kpi hero">

    cells.push(`<div class="kpi"><div class="lbl">💰 PROFIT 利益</div><div class="val tabnum" style="color:${prev&&prev.profit<0?'var(--danger)':'inherit'}">${prev?fmt(prev.profit):'—'}</div>${prev?trend(prev.profit, s.history[s.history.length-2]?.profit):''}</div>`);
  cells.push(`<div class="kpi"><div class="lbl">👥 CUSTOMERS</div><div class="val tabnum">${prev?fmtNum(prev.customers):'—'}</div>${prev?trend(prev.customers, s.history[s.history.length-2]?.customers):''}</div>`);
  // §15 §60 CASH RUNWAY は最初から見せない。危機に入るか、現金が細ってきた時だけ前に出す
  if(Macro.active(s) || Runway.danger(s))
    cells.push(`<div class="kpi"><div class="lbl">⏳ RUNWAY 現金の持ち時間</div><div class="val tabnum" style="color:${Runway.danger(s)?'var(--danger)':'inherit'}">${Runway.label(s)}</div></div>`);

    cells.push(`<div class="kpi"><div class="lbl">📣 認知</div><div class="val tabnum">${Math.round(s.awareness)}<small>/100</small></div></div>`);
  if(Engine.isRevealed("SATISFACTION"))
    cells.push(`<div class="kpi"><div class="lbl">❤️ 満足度</div><div class="val tabnum">${Math.round(s.satisfaction)}<small>/100</small></div></div>`);
  if(Engine.isRevealed("REPUTATION"))
    cells.push(`<div class="kpi"><div class="lbl">🗣 評判</div><div class="val tabnum">${Math.round(s.reputation)}<small>/100</small></div></div>`);
  if(Engine.isRevealed("NEWREPEAT"))
    cells.push(`<div class="kpi"><div class="lbl">🔁 リピート力</div><div class="val tabnum">${Math.round(BUSINESSES[s.bizId].repeat*(0.30+s.satisfaction/100*1.40)*(1+s.brand/300)*100)}<small>%</small></div></div>`);
  if(Engine.isRevealed("FATIGUE"))
    cells.push(`<div class="kpi"><div class="lbl">😵 疲労</div><div class="val tabnum" style="color:${s.ownerFatigue>70?'var(--danger)':'inherit'}">${Math.round(s.ownerFatigue||0)}<small>/100</small></div></div>`);
  if(Engine.isRevealed("DEPENDENCY"))

/* §13 採用の解放。週が来たから雇えるのではなく、
   「自分の手では捌けない」と数字で分かり、かつ給与を払える現金があるときに解放する。
   ——人を雇う理由が、プレイヤー自身の画面の中にある状態を作る。 */
const RECRUIT_EARLY = { fromWeek:5, lostNeeded:12, lookback:3, salaryWeeks:3 };
function recruitGate(s){
  const A=ACTIONS.recruit;
  if(s.week >= A.unlockWeek) return { ok:true, by:"week" };
  if(s.week < RECRUIT_EARLY.fromWeek)
    return { ok:false, reason:`WEEK ${RECRUIT_EARLY.fromWeek} から挑戦できる`, lost:0, need:RECRUIT_EARLY.lostNeeded };
  const h=(s.history||[]).slice(-RECRUIT_EARLY.lookback);
  const lost=h.reduce((a,x)=>a+(x.lost||0),0);
  const cheapest=STAFF.reduce((a,x)=>Math.min(a,x.salary), Infinity);
  const cashNeed=cheapest*RECRUIT_EARLY.salaryWeeks;
  if(lost < RECRUIT_EARLY.lostNeeded)
    return { ok:false, lost, need:RECRUIT_EARLY.lostNeeded, cashNeed,
             reason:`直近${RECRUIT_EARLY.lookback}週で ${RECRUIT_EARLY.lostNeeded}人 を取りこぼすと解放（いま ${lost}人）` };
  if(s.cash < cashNeed)
    return { ok:false, lost, need:RECRUIT_EARLY.lostNeeded, cashNeed,
             reason:`給与${RECRUIT_EARLY.salaryWeeks}週ぶん ${fmt(cashNeed)} の現金が要る` };
  return { ok:true, by:"early", lost };
}
/* 採用が解放された週に、給与とスタッフの指標も一緒に開示する */
function syncRecruitReveal(s){
  const g=recruitGate(s);
  if(g.ok && !s.reveal.STAFF){
    s.reveal.STAFF=true; s.reveal.SALARY=true;
    if(g.by==="early") toast("🧑‍🤝‍🧑 取りこぼしが続いた。仲間を探せるようになった");
  }
  return g;
}

/* 価格コントロールの配線。入力中に再描画するとフォーカスが飛ぶので、
   打っている間は plan とスライダーとヒントだけを更新し、確定時に丸める。 */
function wirePriceCtrl(){
  const s=Engine.state, b=BUSINESSES[s.bizId];
  const inp=$("#priceInput"), sl=$("#priceSlider");
  const clamp=(v)=> Math.max(b.minP, Math.min(b.maxP, v));
  const syncHint=()=>{ const h=$("#priceHint"); if(h) h.innerHTML=priceHintHtml(s); };
  if(sl){
    sl.oninput=()=>{ plan.price=parseInt(sl.value,10);
      if(inp) inp.value=plan.price; syncHint(); };
    sl.onchange=()=>Sound.click();
  }
  if(inp){
    inp.oninput=()=>{
      const v=parseInt(inp.value,10);
      if(isNaN(v)) return;                       // 消している途中は触らない
      plan.price=clamp(v);
      if(sl) sl.value=plan.price;
      syncHint();
    };
    // 確定時にだけ範囲へ丸めて、表示を正す
    const settle=()=>{ let v=parseInt(inp.value,10);
      if(isNaN(v)) v=plan.price;
      plan.price=clamp(v); inp.value=plan.price;
      if(sl) sl.value=plan.price; syncHint(); Sound.click(); };
    inp.onblur=settle;
    inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } };
  }
}

// 簡易ラインチャート（SVG。外部ライブラリ不要）
function lineChart(data, color, allowNeg){
  if(data.length<2){ return `<svg class="chart" viewBox="0 0 300 120"><text x="150" y="64" text-anchor="middle" fill="#aaa" font-size="12">データがたまると表示されます</text></svg>`; }
  const w=300,h=120,pad=8;
  const min=Math.min(...data, allowNeg?0:Math.min(...data));
  const max=Math.max(...data,1);
  const range=(max-min)||1;
  const pts=data.map((v,i)=>{ const x=pad+i/(data.length-1)*(w-pad*2); const y=h-pad-((v-min)/range)*(h-pad*2); return [x,y]; });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]},${h-pad} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[pts.length-1][0]},${h-pad} Z`;
  const zeroY = allowNeg ? (h-pad-((0-min)/range)*(h-pad*2)) : null;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${zeroY!==null?`<line x1="0" y1="${zeroY.toFixed(1)}" x2="${w}" y2="${zeroY.toFixed(1)}" stroke="#e0d9c8" stroke-dasharray="3 3"/>`:''}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${color}"/>`).join('')}
  </svg>`;
}

// §43 状態依存の重み付け。今の会社の状況に合ったカードを出やすくする。
function eventWeight(e, s){
  let w = e.weight || 5;
  // レア度で基本の出やすさを調整
  w *= (e.rarity==="rare" ? 0.5 : e.rarity==="uncommon" ? 0.8 : 1);
  // フェーズのボトルネックに合ったカテゴリを厚めに（§14 の流れに沿わせる）
  const bnCat = { TRAFFIC:"marketing", MARGIN:"money", CONVERSION:"marketing",
                  CAPACITY:"operations", PEOPLE:"staff", CAPITAL:"finance" }[phaseOf(s.week).bottleneck];
  if(e.cat===bnCat) w *= 1.8;
  // 状態が合致したカードの重みを増やす（§43）
  if(e.cat==="customer" && s.satisfaction>85) w *= 1.8;   // 高満足 → ファン/口コミ系
  if(e.cat==="staff" && (s.staff||[]).length>0) w *= 1.6;
  if(e.cat==="finance" && s.cash < (BUSINESSES[s.bizId].fixed)*4) w *= 2.2; // 現金薄い → 資金系
  if(e.id==="viral" && (s.awareness>40 || s.brand>30)) w *= 2.0;
  if(e.hidden) w *= 1.4;   // 条件を満たした隠しカードは、出たら嬉しいので厚め
  return Math.max(0.2, w);
}

function drawEvent(s){
  // PHASE BOSS / 強制失敗は抽選より先。必ずこの週に出る（§13 §10）
  const boss = bossFor(s.week);
  if(boss){ if(!s.seenEvents.includes(boss.id)) s.seenEvents.push(boss.id); return boss; }
  if(s.week<=1) return null;                 // 最初の週は静かに
  const phaseRate = phaseOf(s.week).no>=4 ? 0.7 : 0.6;  // 後半ほどイベントが増える（§12）
  if(rnd()>phaseRate) return null;
  // §42 候補 = 週条件 + 状態条件（完全ランダムにしない）
  const pool=EVENTS.filter(e=> (e.minWeek||1)<=s.week && (!e.maxWeek || s.week<=e.maxWeek)
                            && (!e.cond || e.cond(s)) );
  // 直近で出たものは避ける（隠しイベントは条件が貴重なので除外しない）
  const fresh=pool.filter(e=> e.hidden || !s.seenEvents.slice(-5).includes(e.id));
  const use=(fresh.length?fresh:pool);
  if(use.length===0) return null;
  // §42 重み付きランダム抽選
  const weights=use.map(e=> eventWeight(e,s));
  let total=weights.reduce((a,b)=>a+b,0), r=rnd()*total, ev=use[use.length-1];
  for(let i=0;i<use.length;i++){ r-=weights[i]; if(r<=0){ ev=use[i]; break; } }
  s.seenEvents.push(ev.id);
  return ev;
}

function resolveWeek(ctx){
  const s=Engine.state;
  /* §4 世界が先に動く：市場レジームが遷移し、競合が先週のこちらの手に反応する。
     その結果を ctx に載せてから今週を計算する（＝プレイヤーは動いた世界の中で判断する）。 */
  const evCtx = ctx || {};
  Difficulty.tick(s);
  const dctx = Difficulty.ctx(s);
  // 難易度側とイベント側で同じ係数が来たら掛け合わせる（どちらかが消えないように）
  const merged = Object.assign({}, dctx, evCtx);
  ["marketMult","capMult","convMult","costMult","reachMult","priceMult","fixedMult"]
    .forEach(k=>{ if(dctx[k]!=null && evCtx[k]!=null) merged[k] = dctx[k]*evCtx[k]; });
  ctx = Macro.applyCtx(s, merged);
  ctx = Pivot.ctx(s, ctx);            // §19 転換直後は、まだ本来の力が出ない
  const res=Economy.computeWeek(s, plan, ctx);
  Competitor.remember(s, res, plan);  // §47 相手はこちらの打ち手を記憶する
  // 今週の世界の状態を残す（振り返り・レポート用）
  (s.diffLog=s.diffLog||[]).push({ week:s.week, regime:s.regime.id,
    predictability:+(dctx._diff.pressure.predictability||0).toFixed(2),
    cpc:+(dctx.cpcMult||1).toFixed(2), refPrice:+(dctx.marketPriceMult||1).toFixed(3),
    primary:dctx._diff.budget.primary });
  if(s.diffLog.length>60) s.diffLog.shift();
  // 状態を書き換える前に旧値を退避（20体験の「変化」判定に使う）。
  // これを怠ると、更新後の値どうしを比較して good/bad_review が永久に立たない。
  const prevRep = s.reputation;
  const hadTrainee = (s.staff||[]).some(e=> typeof e==="object" && (e.weeks||1)<=3);

  // --- 状態を更新 ---
  s.cash += res.cashDelta;
  const n=res.next;
  s.awareness=n.awareness; s.quality=n.quality; s.satisfaction=n.satisfaction;
  s.brand=n.brand; s.reputation=n.reputation; s.serviceQuality=n.serviceQuality;
  s.systemLevel=n.systemLevel; s.repeatPool=n.repeatPool; s.activeCustomers=n.activeCustomers;
  s.adFatigue=n.adFatigue; s.ownerFatigue=n.ownerFatigue;
  s.complexity=n.complexity; s.ownerDependency=n.ownerDependency;
  s.convPermanent=n.convPermanent;
  s.price=plan.price;
  // §53 スタッフは在籍が進むほど戦力になる
  s.staff=(s.staff||[]).map(e=> (typeof e==="string") ? e : Object.assign({}, e, {weeks:(e.weeks||1)+1}));

  // 履歴
  const profit=res.opProfit + (res.otherIn - res.otherOut); // 実質の週次利益（一時収支込み）
  s.history.push({ week:s.week, sales:res.sales, profit:res.opProfit, cash:s.cash,
    customers:res.actual, reach:res.totalReach, conv:res.conversion, price:res.price,
    lost:res.lost });   // §13 取りこぼしは「人手が足りない」証拠。採用の解放条件に使う
  /* 借入の返済。利息はすでに利益から引かれている（res.interest）。
     元金はここで現金からだけ引く——利益には出ないのに現金が減る。§30 §31 の実体。 */
  const repay = Finance.tick(s);
  if(repay.principal>0){ s.cash -= repay.principal; }
  s._lastRepay = repay;
  if(repay.late) toast("⚠️ 返済ができなかった。銀行の信用が下がった");
  else if(repay.cleared) toast("🤝 完済した。銀行の信頼が厚くなった");

  s.freeHoursLog.push(Math.max(0, CONFIG.baseHours - plan.hoursUsed));
  syncRecruitReveal(s);   // §13 取りこぼしが続いたなら、採用と給与の指標を開く
  // 教育・分析用の記録（端末内。ここは本番の週送りだけを通る＝シミュレーションは記録しない）
  PlayLog.week(s, plan, res, { eventId:(ctx && ctx._event)?ctx._event.id:null });

  // XP
  Engine.addXp(10 + plan.actions.length*3 + (res.ctxXp||0));

  // --- 20体験の記録（§26）。判定は detectExperiences に集約（本番もテストも同じ関数）---
  const prevH=s.history[s.history.length-2];
  detectExperiences(s, res, { prevRep, hadTrainee,
    eventId: (ctx && ctx._event) ? ctx._event.id : null,
    prevSales: prevH?prevH.sales:null, prevConv: prevH?prevH.conv:null });

  // バッジ判定
  checkBadges(res);

  // 決算モーダル → なぜ？ → レベルアップ → バッジ → 危機 → 次週
  // シーン層があれば段階演出版の決算モーダル（§22-23）。無ければ従来版
  enqueueModal((window.Scenes && Scenes.buildResultModal)
    ? Scenes.buildResultModal(res, ctx, { owlCheck, isRevealed:(k)=>Engine.isRevealed(k) })
    : resultModal(res, ctx));
  const why=maybeWhy(res, s);
  if(why) enqueueModal(why);
  // 🎓 BUSINESS LESSON（§9 失敗は罰ではなく学習イベント）
  pendingLessons.forEach(k=> enqueueModal(lessonModal(k))); pendingLessons=[];
  // レベルアップ
  const lvUp=checkLevelUp();
  if(lvUp) enqueueModal(lvUp);
  // バッジ
  pendingBadges.forEach(id=> enqueueModal(badgeModal(id))); pendingBadges=[];

  Sound.coin();
  s.lastWeek={sales:res.sales, profit:res.opProfit};
  Engine.save();

  runModalQueue(()=> afterWeek(res));
}

function afterWeek(res){
  const s=Engine.state;
  // 現金危機
  if(s.cash<0){ openCrisis(); return; }
  advanceWeek();
}

/* §1 §40 週送りの中心。ここで「24週で終わる」のをやめ、
   ERAの節目とマクロ事象（予兆→発生）を裁く。以降、週は無限に進む。 */
function advanceWeek(){
  const s=Engine.state;
  s.week++;
  Macro.tick(s);                         // §30 危機は同じ強度のまま続かない
  Pivot.tick(s);                         // §19 新しい売り方に、少しずつ慣れていく
  const passive = Portfolio.tick(s);     // §37 任せた事業が、あなたが居なくても稼ぐ（または損を出す）
  if(passive) s._lastPassive = passive;
  s._peakStaff = Math.max(s._peakStaff||0, (s.staff||[]).length);   // §57 記録用
  const era = eraOf(s);
  const eraChanged = (era !== s.era);
  s.era = era;
  plan = freshPlan();
  Engine.save();

  // §3 §77 §78 STARTUP ERA 完了（かつての「ゲーム終了」地点）
  if(eraChanged && era === "SURVIVAL_SCALE" && !s.eraDone.STARTUP){
    s.eraDone.STARTUP = true;
    scheduleMacro(s);                    // §4 次の時代では市場そのものが動く
    Engine.save();
    openEraComplete("STARTUP");
    return;
  }
  // §43 §44 予兆（完全な予言ではない）→ 発生
  if(s.macroSchedule){
    if(s.week === s.macroSchedule.newsWeek){ Engine.save(); openMacroNews(); return; }
    if(s.week >= s.macroSchedule.startWeek){ Engine.save(); openMacroStart(); return; }
  }
  renderPlay();
}

/* §42 マクロ事象の予定を組む。毎週危機だらけにはしない（大波は12〜30週おき） */
function scheduleMacro(s, opts){
  if(s.macro || s.macroSchedule) return;
  const seen = s.macroSeen || [];
  let id, gap;
  if(!seen.length){
    // 最初の1つは PANDEMIC。STARTUP を終えた直後に来る（学びの順序を設計する）
    id = "pandemic"; gap = 2;
  } else {
    const pool = Object.keys(MACRO_EVENTS);
    let cands = pool.filter(k=> !seen.includes(k));          // まだ見ていないものを優先
    if(!cands.length) cands = pool.filter(k=> k !== seen[seen.length-1]);
    if(!cands.length) cands = pool;
    id = cands[Math.floor(rnd()*cands.length)];
    gap = Math.round(12 + rnd()*18);                          // §42 12〜30週
  }
  const d = MACRO_EVENTS[id];
  const startWeek = s.week + gap;
  s.macroSchedule = { id, startWeek, newsWeek: Math.max(s.week+1, startWeek - (d.lead||1)) };
}

/* ===== §37 §38 複数事業（PORTFOLIO） =====
   §39 仕組み化した事業だけが「手を離せる」。自分が居ないと回らない事業は任せられない。 */
const Portfolio = {
  /* 手を離せる条件（§48 オーナー依存度が低いこと） */
  canDelegate(s){ return (s.systemLevel||0) >= 40 && (s.ownerDependency||100) <= 60; },
  reason(s){
    if((s.systemLevel||0) < 40) return "仕組み化が足りない（40以上でまかせられる）";
    if((s.ownerDependency||100) > 60) return "あなたへの依存が高すぎる（60以下にする）";
    return "";
  },
  /* 任せた事業の週次利益。仕組みが強いほど、あなたが居なくても稼ぐ */
  passiveWeekly(b, s){
    const quality = (b.systemLevel/100) * (1 - (b.ownerDependency||0)/160);
    const base = b.baseProfit * Math.max(0.15, quality);
    const macroMult = Macro.active(s)
      ? Math.max(0.2, Macro.demandMult({ bizId:b.bizId, macro:s.macro, pivot:b.pivot })) : 1;
    return Math.round(base * macroMult - b.managerCost);
  },
  totalWeekly(s){
    return (s.portfolio||[]).reduce((a,b)=> a + this.passiveWeekly(b, s), 0);
  },
  /* いま経営している事業を、人に任せる（自分は次の事業へ） */
  delegate(s){
    const h=(s.history||[]).slice(-8);
    const avgProfit = h.length ? h.reduce((a,x)=>a+(x.profit||0),0)/h.length : 0;
    const B=BUSINESSES[s.bizId];
    const managerCost = Math.round(22000 + (s.staff||[]).length*3000);   // 任せる＝店長を置く
    const rec = {
      bizId:s.bizId, name:B.name, emoji:B.emoji,
      founded:s.founded||1, delegatedWeek:s.week,
      brand:Math.round(s.brand), systemLevel:Math.round(s.systemLevel),
      ownerDependency:Math.round(s.ownerDependency),
      staff:(s.staff||[]).length, pivot:s.pivot||null,
      baseProfit: Math.max(0, Math.round(avgProfit)),
      managerCost,
    };
    s.portfolio = s.portfolio || [];
    s.portfolio.push(rec);
    return rec;
  },
  /* §38 任せた事業を、あとから売る */
  sellOne(s, idx){
    const b=(s.portfolio||[])[idx]; if(!b) return null;
    const yearly = this.passiveWeekly(b, s)*52;
    const p=Macro.phase(s);
    const offer = Math.max(0, Math.round(yearly*1.6 * (p ? p.valuation : 1)));
    s.cash += offer;
    s.bizHistory = s.bizHistory || [];
    s.bizHistory.push({
      bizId:b.bizId, name:b.name, emoji:b.emoji, founded:b.founded,
      exitWeek:s.week, exitType:"SOLD", price:offer,
      peakSales:0, peakStaff:b.staff, totalProfit:0, weeks:s.week-b.founded,
      pivot: b.pivot ? PIVOTS[b.pivot.id].name : null, delegated:true,
    });
    s.portfolio.splice(idx,1);
    return { offer };
  },
  /* 毎週の収益を現金に入れる */
  tick(s){
    if(!(s.portfolio||[]).length) return 0;
    const sum = this.totalWeekly(s) - overheadOf(s);   // §84 規模が増えれば管理コストも増える
    s.cash += sum;
    return sum;
  },
};

// OWLのルールベース経営アドバイス（数字を見て最も重要な指摘を1つ）
// §77 OWLは答えを言い切らない。事実（数字）を見せて、問いを返す。
// §16 §17 さらに、進むほど説明を減らし、最後は問いだけにする。
function owlCheck(res, s){
  const bn = res.bottleneck || {code:"NONE"};
  const conv = Math.round(res.conversion*100);
  const ph = phaseOf(s.week).no;

  /* §51 §52 §53 難易度は「経営結果」ではなく学習支援の側で適応させる。
     高難易度ほど答えを渡さず、複数の数字を並べて「最大要因と次の一手」まで問う。
     経済ロジックは一切いじらない（§50 露骨なラバーバンディングはしない）。 */
  const D = Difficulty.profile(s);
  const opacity = D.axes.informationOpacity;
  if(opacity>=60 && s.week>=6){
    const cp = Competitor.pressure(s);
    const load = res.capacity>0 ? (res.demandCustomers/res.capacity) : 0;
    const facts = [
      `売上 <b>${fmt(res.sales)}</b>`,
      `利益 <b>${fmt(Math.round(res.opProfit))}</b>`,
      `成約率 <b>${conv}%</b>`,
      `供給の埋まり具合 <b>${Math.round(load*100)}%</b>`,
      res.adCost>0 ? `広告 <b>${fmt(res.adCost)}</b>` : `リピート <b>${res.repeatCustomers}人</b>`,
      `相場との差 <b>${Math.round(((s.price/BUSINESSES[s.bizId].price)-cp.priceLevel)*100)}%</b>`,
    ];
    // EXPERT は「最大要因＋次に打つべき施策」まで聞く（§53）
    const tail = opacity>=80
      ? `——<b>いちばんの制約はどれか</b>。そして<b>来週いちばん期待値が高い一手は何か</b>。両方を言えるだろうか。`
      : `——この中で、<b>いちばんの制約はどれ</b>だと思う？`;
    return facts.join(" ／ ") + "。<br>" + tail;
  }

  // PHASE 5以降は、答えを渡さず問いだけを置く（チュートリアルの減衰）
  if(ph>=6){
    const q=[
      `売上は <b>${fmt(res.sales)}</b>、自由時間は <b>${res.freeHours}h</b>。——これは、あなたが望んだ成長だろうか？`,
      `いま一番詰まっている数字は、何だと思う？　わたしはもう答えを言わない。`,
      `何を伸ばすかではなく、<b>何を捨てるか</b>を決める時だ。今週、捨てたものは何だった？`,
      `この事業は、あなたが1週間いなくても回るだろうか。（オーナー依存度 <b>${Math.round(s.ownerDependency)}</b>）`,
    ];
    return q[s.week % q.length];
  }
  if(ph===5){
    if(res.freeHours<=4) return `売上は伸びている。<b>${fmt(res.sales)}</b>だ。しかし自由時間は <b>${res.freeHours}h</b>。この伸ばし方を、来年も続けられるか？`;
    if((s.staff||[]).length>0) return `仲間が増えた。人件費は <b>${fmt(res.salaries)}/週</b>。<br>この固定費を、増えた粗利で回収できているだろうか？　数字はどう言っている？`;
  }

  // 広告を出した週は、まずROIの事実を突きつける（§10 §42 §43）
  if(res.adCost>0){
    const adRevenue = Math.round(res.adReach*res.conversion*res.price);
    if(adRevenue < res.adCost){
      return `広告に <b>${fmt(res.adCost)}</b> 使って <b>${res.adReach}人</b> に届いた。
        でも買ったのは約 <b>${Math.round(res.adReach*res.conversion)}人</b>（成約率 ${conv}%）、広告からの売上は <b>${fmt(adRevenue)}</b>。
        次に手を入れるのは、広告の「量」だろうか？　それとも「買う割合」だろうか？`;
    }
    if(res.cac && res.breakEvenCAC && res.cac > res.breakEvenCAC){
      return `広告で1人集めるのに <b>${fmt(res.cac)}</b> かかった。
        でも1人が生む利益は約 <b>${fmt(res.breakEvenCAC)}</b> まで。
        これは「広告が悪い」のか、「1人あたりの利益が薄い」のか。どちらを直す？`;
    }
  }

  switch(bn.code){
    case "CASH":
      return `⚠ 現金は <b>${fmt(s.cash)}</b>。固定費は毎週 <b>${fmt(res.fixed)}</b> 出ていく。
        利益が出ていても、現金が尽きれば商売は終わる。今止めるべき支出はどれだろう？`;
    case "CAPACITY":
      return `需要は <b>${res.demandCustomers}人</b>、でも対応できたのは <b>${res.actual}人</b>。<b>${res.lost}人</b>を逃した。
        これは「集客が足りない」問題ではないな。増やすべきは客か、それとも<b>供給する力</b>か？`;
    case "TRAFFIC":
      return `今週あなたを知って来た人は <b>${res.totalProspects}人</b>。認知度は <b>${Math.round(s.awareness)}</b>。
        商品は悪くないのに、そもそも知られていない。お金をかけずに認知を増やす手はないだろうか？`;
    case "CONVERSION":
      return `<b>${res.totalProspects}人</b>が来て、買ったのは <b>${res.actual}人</b>（成約率 ${conv}%）。
        人を増やしても、この割合のままなら結果は変わらない。なぜ買わなかったと思う？　価格か、価値の伝え方か。`;
    case "MARGIN":
      return `売上 <b>${fmt(res.sales)}</b> のうち、手元に残る粗利は <b>${Math.round(res.grossMargin*100)}%</b>。
        1個売って残るのは <b>${fmt(res.contributionMargin)}</b> だ。
        売る数を増やすのと、1個あたりを増やすの——今のあなたに効くのはどっちだ？`;
    case "TIME":
      return `今週の自由時間は <b>${res.freeHours}h</b>。ほぼ全部を自分で回している。
        売上は伸ばせても、あなたの時間は増えない。この仕事、<b>自分がやる必要がある</b>だろうか？`;
  }

  if(res.opProfit>0 && res.repeatCustomers>res.newInterested){
    return `いい流れだ。新規 <b>${res.newInterested}人</b> に対してリピーターが <b>${res.repeatCustomers}人</b>。
      広告費ゼロで来てくれる客が売上を支えはじめた。この人たちを、どう大事にする？`;
  }
  if(res.opProfit>0){
    return `黒字。<b>${fmt(res.opProfit)}</b> 残った。
      経営の本番はここからだ。この利益を——商品・集客・人・自分の時間——どこへ配る？`;
  }
  return `まだ固定費 <b>${fmt(res.fixed)}</b> を粗利が超えられていない。立ち上げ期はこうだ。
    今週の粗利は <b>${fmt(res.gross)}</b>。あと何人来れば、この線を超える？`;
}

/* ---------- 「なぜ？」振り返りモーダル ---------- */
function maybeWhy(res, s){
  const prev=s.history[s.history.length-2];
  if(!prev) return null;
  // 売上が増えたのに利益が減った → 学びの瞬間
  if(res.sales>prev.sales*1.05 && res.opProfit<prev.profit-1000){
    // 正解を推定
    let correct, opts;
    const adUp = res.adCost>0;
    const priceDown = res.price<prev.price;
    const costHeavy = res.grossMargin<0.4;
    if(priceDown){ correct=2; }
    else if(adUp){ correct=1; }
    else if(costHeavy){ correct=3; }
    else { correct=1; }
    opts=[
      "客数が減ったから",
      "広告など経費が増えたから",
      "価格を下げて1個あたりの利益が減ったから",
      "原価の割合が高かったから",
    ];
    return { html:`
      <div class="mhead"><div class="mbig">🤔</div><div class="mtit">なぜ？を考えよう</div></div>
      <div class="mbody">
        <div class="muted" style="font-size:14px;line-height:1.6;margin-bottom:8px">
          今週は <b>売上が増えた</b>のに、<b>利益は減りました</b>。<br>いちばんの原因はどれだと思いますか？</div>
        ${opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span>${o}</button>`).join("")}
      </div>`,
      wire:(root,done)=>{ root.querySelectorAll(".choice").forEach(b=>{ b.onclick=()=>{
        const i=parseInt(b.dataset.i,10); const ok=(i===correct);
        Sound[ok?'coin':'warn']();
        let expl;
        if(correct===2) expl="価格を下げると客数は増えても、1個あたりの粗利が減る。売上が増えても利益が減るのはこのパターン。<b>売上 ≠ 利益</b>。";
        else if(correct===1) expl="広告などの経費が売上の伸び以上に増えると、利益は減る。集客コストが見合っているか（ROI）を常に見よう。";
        else expl="原価（変動費）の割合が高いと、売れば売るほど粗利が薄い。原価率のコントロールが効いてくる。";
        b.parentNode.innerHTML=`<div class="speech" style="box-shadow:none;background:${ok?'#f2fff7':'#fff7e6'}"><div class="ava">🦉</div><div class="bub"><b>${ok?'正解！':'惜しい。'}</b><br>${expl}</div></div><button class="btn banana big" data-next style="margin-top:14px">なるほど！ ▶</button>`;
        $("[data-next]",b.parentNode).onclick=()=>{ Sound.click(); done(); };
      };});} };
  }
  return null;
}

/* ---------- 現金危機（倒産の一歩手前） ----------
   §54 §55 ここは「無限に延命できる部屋」ではない。
   借りられる額には枠があり、売れる設備には限りがあり、減らせる人にも限りがある。
   手が尽きたら事業は終わる——それを体験させるための分岐。 */
function creditTopUp(s){                      // 現金がまだマイナスなら、残枠のぶんだけ借りて埋める
  if(s.cash>=0) return 0;
  const take=Math.min(-s.cash, Runway.creditLeft(s));
  if(take<=0) return 0;
  s.loan=(s.loan||0)+take; s.cash+=take;
  return take;
}
function openCrisis(){
  const s=Engine.state;
  s.crisisCount=(s.crisisCount||0)+1;
  const left=Runway.creditLeft(s);
  const loanAmt=Math.min(200000, left);
  const assets=(s.autos||[]).reduce((a,id)=>{ const x=AUTOMATIONS.find(y=>y.id===id);
    return a+(x?Math.round(x.cost*0.44):0); },0);
  const sev=(s.staff||[]).length*CONFIG.severancePerStaff;
  const canLoan  = loanAmt>=30000;
  const canSell  = assets>0;
  const canCut   = (s.staff||[]).length>0 && (s.cash+left)>=sev;

  // §54 打つ手が無くなったら、そこが終わり
  if(!canLoan && !canSell && !canCut){ openBankrupt(); return; }

  const nth=s.crisisCount;
  const warn = nth>=3 ? "これで3度目だ。同じことを繰り返すなら、結果も同じになる。"
             : nth===2 ? "2度目だ。今度こそ、出ていく金そのものを見直す番かもしれない。"
             : "だが、まだ終わりじゃない。経営再建も経営のうちだ。";
  modalRoot.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><div class="mbig">🚨</div><div class="mtit" style="color:var(--danger)">CASH CRISIS</div></div>
    <div class="mbody">
      <div class="muted" style="font-size:14px;line-height:1.6">現金が <b style="color:var(--danger)">${fmt(s.cash)}</b> に。このままでは事業が続けられない。<br>${warn}どうする？</div>
      <div class="muted" style="font-size:12px;margin:8px 0 2px">借入 ${fmt(s.loan||0)} ／ 枠の残り <b>${fmt(left)}</b></div>
      ${canLoan?`<button class="choice" data-c="loan"><span class="k">A</span>銀行に融資を頼む（+${fmt(loanAmt)}）<div class="cd">借りられる額には限りがある。返す前提のお金だ。</div></button>`:
                `<div class="choice" style="opacity:.45"><span class="k">A</span>銀行に融資を頼む<div class="cd">断られた。これ以上は貸してもらえない。</div></div>`}
      ${canSell?`<button class="choice" data-c="sell"><span class="k">B</span>設備を売って現金を作る（+${fmt(assets)}）<div class="cd">買値では売れない。だが毎週の固定費は軽くなる。</div></button>`:''}
      ${canCut?`<button class="choice" data-c="cut"><span class="k">C</span>人を減らして固定費を下げる（−${fmt(sev)}）<div class="cd">退職金がいま出ていく。それでも来週からの給与は止まる。</div></button>`:''}
    </div></div></div>`;
  modalRoot.querySelectorAll("button.choice").forEach(b=>{ b.onclick=()=>{
    const c=b.dataset.c;
    if(c==="loan"){ s.loan=(s.loan||0)+loanAmt; s.cash+=loanAmt;
      toast("融資を受けた。ここから立て直そう"); }
    else if(c==="sell"){ s.cash+=assets; s.autos=[]; creditTopUp(s);
      toast("設備を手放した。身軽になった"); }
    else { s.cash-=sev; s.severancePaid=(s.severancePaid||0)+sev; s.staff=[];
      s.capPenalty=Math.min(0.5,(s.capPenalty||0)+0.15); creditTopUp(s);
      toast("仲間に事情を話した。固定費は軽くなる"); }
    Sound.coin(); Engine.save(); modalRoot.innerHTML="";
    if(s.cash<0){ openCrisis(); return; }      // まだ足りなければ、次の手を選ぶ
    advanceWeek();
  };});
}

/* ---------- 開業資金をどう作るか（最初の意思決定） ----------
   実情では、開業資金の 65.2% が金融機関からの借入、自己資金は 24.5%（公庫2025年度調査）。
   手持ちだけで始めるのは「安全だが、動けない」。借りれば動けるが、返済が毎週効いてくる。
   どちらが正解でもない——それを最初に体験させる。 */
const FINANCE_PLANS = [
  { id:"none",  emoji:"🪙", name:"自己資金だけで始める", mult:0,
    desc:"借金はしない。返済もない。ただし打てる手が少なく、最初の数週は本当に苦しい。" },
  { id:"small", emoji:"🏦", name:"少しだけ借りる",      mult:1.4,
    desc:"最低限の余裕を作る。返済は軽いが、大きくは動けない。" },
  { id:"full",  emoji:"🏛", name:"しっかり借りる",       mult:2.6,
    desc:"実際の創業に一番近い形。動ける代わりに、毎週の返済が重くのしかかる。" },
];
function openFinanceChoice(after){
  const s=Engine.state, B=BUSINESSES[s.bizId];
  const own=s.cash;
  const rate=Finance.rate(s);
  const cards=FINANCE_PLANS.map(p=>{
    const amt=Math.round(own*p.mult/1000)*1000;
    const total=own+amt;
    const weekly=amt>0 ? Math.ceil(amt/ECON.loanTermWeeks) : 0;
    return `<button class="choice" data-p="${p.id}" data-amt="${amt}">
      <span class="k">${p.emoji}</span>${p.name}
      <div class="cd">${p.desc}<br>
      <b>開業資金 ${fmt(total)}</b>${amt>0?`（自己資金 ${fmt(own)} ＋ 融資 ${fmt(amt)}）
      <br>据置${ECON.loanGraceWeeks}週のあと、毎週 <b style="color:var(--danger)">${fmt(weekly)}</b> の元金返済（${ECON.loanTermWeeks}週）`
      :`（借入なし・返済なし）`}</div></button>`;
  }).join("");
  modalRoot.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><div class="mbig">🏦</div><div class="mtit">開業資金を、どう作る？</div></div>
    <div class="mbody">
      <div class="speech" style="box-shadow:none;background:#f2fff7">
        <div class="ava">🦉</div>
        <div class="bub"><b>OWL：</b>手持ちは <b>${fmt(own)}</b>。正直、これだけで商売を始めるのは厳しい。<br>
        実際、開業した人の資金は<b>3分の2が借入</b>で、自己資金は4分の1ほどだ。<br>
        借りるのは悪いことじゃない。<b>返せる範囲で借りて、返しきる</b>——それも経営の腕だ。</div>
      </div>
      <div class="muted" style="font-size:12px;margin:10px 0 6px">
        年利 ${(rate*100).toFixed(2)}%（信用が上がると下がる）／ 据置 ${ECON.loanGraceWeeks}週 ／ 返済 ${ECON.loanTermWeeks}週
      </div>
      ${cards}
      <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.6">
        ※ 元金の返済は「費用」ではないので、利益には出ない。<b>それでも現金は毎週減る</b>。
      </div>
    </div></div></div>`;
  modalRoot.querySelectorAll("button.choice").forEach(b=>{ b.onclick=()=>{
    const amt=parseInt(b.dataset.amt,10)||0;
    s.financeChoice=b.dataset.p;
    if(amt>0){ Finance.borrow(s, amt); Sound.coin(); }
    else Sound.click();
    Engine.save(); modalRoot.innerHTML="";
    if(amt>0) toast(`${fmt(amt)} を借りた。据置${ECON.loanGraceWeeks}週のあと返済が始まる`);
    else toast("自己資金だけで始める");
    after && after();
  };});
}

      </div>

      ${SHARE.configured()?`<button class="btn ghost big" id="dShare" style="margin-top:8px">
        ${PlayLog.consent()?"🔕 共有をやめる":"🤝 記録の共有に協力する"}</button>`:""}

      <button class="btn banana big" data-close style="margin-top:10px">閉じる</button>
    </div></div></div>`;
  $("#dCsv").onclick=()=>{ Sound.click(); PlayLog.download("csv"); };
  $("#dJson").onclick=()=>{ Sound.click(); PlayLog.download("json"); };

    openDataMenu(); };
  $("#dClear").onclick=()=>{ if(confirm("この端末に保存したプレイの記録を、すべて削除しますか？")){

/* ---------- プレイ記録の共有について聞く（1回だけ） ----------

      <div class="muted" style="font-size:12px;margin-top:10px">

      </div>
      <button class="btn banana big" data-c="yes" style="margin-top:14px">協力する</button>
      <button class="btn ghost big" data-c="no" style="margin-top:10px">送らない</button>

  };
}

/* §54 破綻。ここで終わりではなく、経営者としての一生は続く（§34-36） */
function openBankrupt(){
  const s=Engine.state;
  const h=s.history||[];
  const totalProfit=Math.round(h.reduce((a,x)=>a+(x.profit||0),0));
  const peakSales=Math.round(h.reduce((a,x)=>Math.max(a,x.sales||0),0));
  PlayLog.end(s, "BANKRUPT"); PlayLog.submit(s._runId);
  Exit.archive(s, "BANKRUPT", 0);
  s.bizStatus="BANKRUPT"; s.loan=0; s.debt=0; s.cash=0;
  s.owner=s.owner||{}; s.owner.knowledge=s.owner.knowledge||[];
  if(!s.owner.knowledge.includes("bankruptcy")) s.owner.knowledge.push("bankruptcy");
  Engine.save();
  modalRoot.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><div class="mbig">🕯</div><div class="mtit" style="color:var(--danger)">BANKRUPT</div></div>
    <div class="mbody">
      <div class="muted" style="font-size:14px;line-height:1.7">
        現金が尽き、借りる先も、売る設備も、減らせる人も無くなった。<br>
        <b>${BUSINESSES[s.bizId].emoji} ${BUSINESSES[s.bizId].name}</b> は W${s.week} で終わった。</div>
      <div class="pl" style="margin-top:10px">
        <div class="r"><span>続いた期間</span><b class="tabnum">${h.length} 週</b></div>
        <div class="r"><span>最高の週商</span><b class="tabnum">${fmt(peakSales)}</b></div>
        <div class="r"><span>累計利益</span><b class="tabnum" style="color:var(--danger)">${fmt(totalProfit)}</b></div>
        <div class="r"><span>資金危機の回数</span><b class="tabnum">${s.crisisCount||0} 回</b></div>
      </div>
      <div class="card" style="margin-top:12px;background:#fff7f5">

        <div style="font-size:13.5px;line-height:1.65;margin-top:6px">
          潰れた理由は「売れなかった」ことじゃない。<b>出ていく金が、入ってくる金を上回り続けた</b>ことだ。
          利益が黒字でも現金は尽きる。次は RUNWAY——あと何週もつか——を、毎週見てくれ。</div>
      </div>
      <button class="btn banana big" data-c="next" style="margin-top:12px">🔄 次の事業を始める</button>
    </div></div></div>`;
  modalRoot.querySelector("[data-c=next]").onclick=()=>{
    Sound.click(); modalRoot.innerHTML="";
    renderSelect();                            // §34-36 現金は失っても、経験は残る
  };

/* §29 §65 CONTINUE / DOWNSIZE の比較。「おすすめ」は出さない。正解は状態が決める */
function openStrategy(){
  const s=Engine.state;
  const B=BUSINESSES[s.bizId];
  const staffCost=Economy.staffEffect(s).salary;
  const fixedNow=Math.round((B.fixed + Economy.autoEffect(s).fixed) * (s.fixedMult||1));
  const lastSales=s.history.length ? s.history[s.history.length-1].sales : 0;
  const dm=Macro.demandMult(s);
  const estSales=Math.round(lastSales*dm);
  const contBurn=estSales - Math.round(estSales*0.42) - fixedNow - staffCost;   // 粗い見積り（粗利率58%想定）
  const cutFixed=Math.round(fixedNow*0.75);
  const oneStaff=(s.staff||[]).length ? 1 : 0;
  const dsBurn=Math.round(estSales*0.85) - Math.round(estSales*0.85*0.42) - cutFixed - (staffCost - (oneStaff? Math.round(staffCost/Math.max(1,(s.staff||[]).length)) : 0));
  const runwayOf=(burn)=> burn>=0 ? "STABLE" : Math.max(0,Math.floor(s.cash/Math.abs(burn))) + " 週";
  const fc=Macro.recoveryForecast(s);
  const val=Valuation.breakdown(s), ex=Exit.breakdown(s);   // §22 §26 売る/畳む場合の数字
  modalRoot.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><div class="mbig">⚖️</div><div class="mtit">この事業を、どうする？</div></div>
    <div class="mbody">
      <div class="pl card" style="box-shadow:none;background:#fffdf5;border:2px solid #f0e9d6">
        <div class="r"><span>💵 いまの現金</span><b class="tabnum">${fmt(s.cash)}</b></div>
        <div class="r"><span>⏳ 現金の持ち時間</span><b class="tabnum" style="color:${Runway.danger(s)?'var(--danger)':'inherit'}">${Runway.label(s)}</b></div>
        ${fc?`<div class="r sub"><span>　需要が戻るまでの見込み</span><span class="tabnum">${fc.min}〜${fc.max}週</span></div>`:''}
      </div>

      <button class="choice" data-c="continue" style="margin-top:12px"><span class="k">A</span>このまま続ける
        <div class="cd">初期費用 ¥0／ブランドも顧客も仲間も失わない。<br>
        見込み週商 <b>${fmt(estSales)}</b>・固定費 <b>${fmt(fixedNow)}</b>・人件費 <b>${fmt(staffCost)}</b><br>
        週の収支 <b style="color:${contBurn<0?'var(--danger)':'var(--good)'}">${contBurn>=0?'+':''}${fmt(contBurn)}</b>／持ち時間 <b>${runwayOf(contBurn)}</b></div></button>

      <button class="choice" data-c="downsize"><span class="k">B</span>縮小して耐える
        <div class="cd">固定費と人件費を削る。ただし<b>退職金が即座に現金を奪い</b>、回復も遅くなる。<br>
        固定費 <b>${fmt(fixedNow)}</b> → <b>${fmt(cutFixed)}</b>／週の収支 <b style="color:${dsBurn<0?'var(--danger)':'var(--good)'}">${dsBurn>=0?'+':''}${fmt(dsBurn)}</b><br>
        <span class="muted">※ 縮小の中身は次の画面で選ぶ</span></div></button>

      <button class="choice" data-c="pivot"><span class="k">C</span>売り方を変える（PIVOT）
        <div class="cd">来店に頼らない売り方へ転換する。投資 <b>${fmt(180000)}〜${fmt(300000)}</b> が必要。<br>
        ブランド・顧客・仲間は引き継げるが、<b>すぐには元の売上に戻らない</b>。</div></button>

      <button class="choice" data-c="exit"><span class="k">D</span>手放す（売却・撤退）
        <div class="cd">いま売るなら <b>${fmt(val.offer)}</b>${val.marketMult<1?`<span style="color:var(--danger)">（市場の落ち込みで ${Math.round((1-val.marketMult)*100)}% 割引）</span>`:''}<br>
        畳む場合の費用 <b style="color:var(--danger)">${fmt(ex.cost)}</b>（契約解除・退職金・処分・借入返済）</div></button>

      <div class="muted" style="font-size:12px;margin-top:10px;line-height:1.6">
        🦉 どれが正解かは、<b>いまの君の現金と、耐える期間</b>で変わる。<br>
        現金が厚いなら耐えるのも戦略。薄いなら、身を軽くするのも、手放すのも戦略だ。
      </div>
    </div></div></div>`;
  modalRoot.querySelectorAll(".choice").forEach(b=>{ b.onclick=()=>{
    Sound.click();
    const c=b.dataset.c;
    if(c==="continue"){ modalRoot.innerHTML=""; toast("この体制のまま、耐える"); Engine.save(); renderPlay(); }
    else if(c==="downsize"){ openDownsize(); }
    else if(c==="pivot"){ openPivot(); }
    else { openExitMenu(); }
  };});
}

  const s=Engine.state;
  const cur=Pivot.mixOf(s);
  const list=Object.values(PIVOTS).map(p=>{
    const afford=s.cash>=p.cost;
    return `<button class="choice" data-p="${p.id}" ${afford?'':'style="opacity:.45"'}>
      <span class="k">${p.emoji}</span>${p.name}

      転換後の構成：来店${Math.round(p.mix.walkIn*100)}%・観光${Math.round(p.mix.tourist*100)}%・オンライン${Math.round(p.mix.online*100)}%・配達${Math.round(p.mix.delivery*100)}%</div></button>`;
  }).join("");
  modalRoot.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mhead"><div class="mbig">🔀</div><div class="mtit">売り方を、変える</div></div>

      </div>
      <div style="margin-top:10px">${list}</div>

    Sound.level(); Engine.save(); modalRoot.innerHTML="";
    enqueueModal({ html:`
      <div class="mhead"><div class="mbig">${p.emoji}</div><div class="mtit">${p.name}へ転換した</div></div>

        </div>
        <div class="speech" style="margin-top:12px"><div class="ava">🦉</div><div class="bub">

        </div></div>

  };});

/* ---------- 最終評価 ---------- */
function computeFinalScores(){
  const s=Engine.state;
  const h=s.history;
  const cumProfit=h.reduce((a,x)=>a+x.profit,0);
  const avgSat=h.length?h.reduce((a,x)=>a+ (0),0):0;
  // 各軸 0-100
  const clamp=(v)=>Math.max(0,Math.min(100,Math.round(v)));
  const PROFIT=clamp(cumProfit/1000000*100 + 30);        // 累計利益100万で概ね満点圏
  const CASH=clamp((s.cash-s.loan)/600000*100 + 20);
  const CUSTOMER=clamp(s.satisfaction*0.7 + (s.activeCustomers)/1.2);
  const MARKETING=clamp(s.awareness*0.6 + s.brand*0.4);
  const SYSTEM=clamp(s.systemLevel*0.7 + s.staff.length*12);
  const avgFree=s.freeHoursLog.length? s.freeHoursLog.reduce((a,x)=>a+x,0)/s.freeHoursLog.length:0;
  const FREEDOM=clamp(avgFree/40*100*0.7 + (cumProfit>0? s.systemLevel*0.3:0));
  return {PROFIT,CASH,CUSTOMER,MARKETING,SYSTEM,FREEDOM, cumProfit, avgFree};
}
// §5 経営スタイルで称号が変わる。失敗にも、笑って再挑戦したくなる名前をつける。
function finalTitle(sc){
  const s=Engine.state, h=s.history;
  const totalSales=h.reduce((a,x)=>a+x.sales,0);
  const adHeavy = (s.exp&&s.exp.ads_fail) && sc.MARKETING>=55 && sc.PROFIT<50;
  const avgPrice = h.length ? h.reduce((a,x)=>a+x.price,0)/h.length : 0;
  const discountish = avgPrice < BUSINESSES[s.bizId].price*0.82;

  // 全能力70以上 → 完全体
  const all=[sc.PROFIT,sc.CASH,sc.CUSTOMER,sc.MARKETING,sc.SYSTEM,sc.FREEDOM];
  if(all.every(v=>v>=70)) return {emoji:"👑",title:"JUNGLE OWNER",desc:"利益も、キャッシュも、顧客も、仕組みも、自由も。全部を70以上で揃えた。あなたが働かなくても回る商売を、本当に作り上げた。"};

  if(sc.cumProfit<=0 && totalSales>500000) return {emoji:"💀",title:"SALES ONLY CEO",desc:"売上は作った。でも利益もキャッシュも残らなかった。——売上は「通過したお金」だ。次は、残すことを目標にしてみよう。"};
  if(sc.cumProfit<=0) return {emoji:"🌱",title:"STILL GROWING",desc:"今回は利益を残せなかった。でも24週を走り切った経験は消えない。どの数字で詰まったか、もう分かっているはずだ。"};
  if(discountish) return {emoji:"🏷",title:"DISCOUNT KING",desc:"安さで客を集めた。客数は多い。でも1人あたりの利益は薄かった。——値下げは一瞬、利益を戻すのは何ヶ月だ。"};

// レーダーチャート（6角形。SVG手描き）
function radarChart(sc){
  const keys=["PROFIT","CASH","CUSTOMER","MARKETING","SYSTEM","FREEDOM"];
  const labels={PROFIT:"利益",CASH:"財務",CUSTOMER:"顧客",MARKETING:"集客",SYSTEM:"仕組み",FREEDOM:"自由"};
  const cx=150,cy=140,R=95;
  const pt=(i,r)=>{ const ang=-Math.PI/2 + i/6*Math.PI*2; return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]; };
  let grid="";
  [0.25,0.5,0.75,1].forEach(f=>{ const p=keys.map((k,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" "); grid+=`<polygon points="${p}" fill="none" stroke="#e0d9c8" stroke-width="1"/>`; });
  let axes="";
  keys.forEach((k,i)=>{ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e0d9c8"/>`;
    const [lx,ly]=pt(i,R+20); axes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="800" fill="#4d5f48">${labels[k]}</text>`; });
  const poly=keys.map((k,i)=>pt(i,R*sc[k]/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 300 300" style="width:100%;max-width:320px;display:block;margin:0 auto">
    ${grid}${axes}
    <polygon points="${poly}" fill="rgba(47,191,113,.35)" stroke="#2fbf71" stroke-width="3"/>
    ${keys.map((k,i)=>{const[x,y]=pt(i,R*sc[k]/100);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#14603f"/>`;}).join("")}
  </svg>`;
}
